    function getSmartImage(item, fallbackCategory) {
      let cat = fallbackCategory || item.categoryKey || item.category || 'default';
      if (item.islandType === 'hotel' || item.islandType === 'villa') cat = 'hotel_villa';
      if (item.category === 'beach' || item.category === 'island_hopping') cat = 'beach';
      const pool = PHOTO_POOLS[cat] || PHOTO_POOLS['default'];
      const keyStr = (item.id || item.name || 'item').toLowerCase();
      let hash = 0;
      for (let i = 0; i < keyStr.length; i++) {
        hash = (hash << 5) - hash + keyStr.charCodeAt(i);
        hash |= 0;
      }
      return pool[Math.abs(hash) % pool.length];
    }

      return String(val).toLowerCase();
    }

    function getText(val) {
      if (!val) return '';
      if (typeof val === 'string') return val;
      if (typeof val === 'object') {
        return val['zh-TW'] || val['zh'] || val['en'] || val['tl'] || Object.values(val)[0] || '';
      }
      return String(val);
    }

    // 8. 城市精確比對（薩馬爾與達沃嚴格隔離）
    function isCityMatch(item, targetCity) {
      if (targetCity === 'all') return true;
      const c = safeStr(item.city);
      const a = safeStr(item.address);
      if (targetCity === 'samal') {
        return c === 'samal' || a.includes('samal');
      }
      if (targetCity === 'davao') {
        return (c === 'davao' || a.includes('davao')) && !c.includes('samal') && !a.includes('samal');
      }
      if (targetCity === 'manila') {
        return c === 'manila' || a.includes('manila') || a.includes('makati') || a.includes('taguig') || a.includes('pasay') || a.includes('bgc');
      }
      return c === targetCity || a.includes(targetCity);
    }

      }`;
      typeIslandBtn.className = `flex-1 py-1.5 text-xs font-bold rounded-xl transition text-center shadow-sm flex items-center justify-center gap-1.5 ${

      }`;

      const list = isCity ? REGION_CONFIG.cities : REGION_CONFIG.islands;
      if (!list.some(r => r.id === currentCity)) {
        currentCity = list[0].id;
        localStorage.setItem('ph_app_city', currentCity);
      }

      regionPillsNav.innerHTML = list.map(r => {
        const active = r.id === currentCity;
        return `
          <button data-city="${r.id}" class="region-pill px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all duration-200 ${
            active ? 'bg-slate-900 text-white shadow-md scale-105' : 'bg-orange-800/40 text-amber-100 hover:bg-orange-800/80'
          }">
            ${r.name}
          </button>
        `;
      }).join('');

      document.querySelectorAll('.region-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCity = btn.getAttribute('data-city');
          currentSubFilter = 'all';
          sessionStorage.setItem('ph_nav_sub', 'all');
          localStorage.setItem('ph_app_city', currentCity);
          renderRegionPills();
          renderSubFilterBar();
          renderContent();
        });
      });
    }

    function renderSubFilterBar() {
      let filterList = [];
      const isIsland = isIslandMode(currentCity);

      if (currentMainTab === 'map') {
        filterList = isIsland ? SUB_FILTERS.food_island : SUB_FILTERS.food_urban;
      } else if (currentMainTab === 'attraction') {
        filterList = isIsland ? SUB_FILTERS.attraction_island : SUB_FILTERS.attraction_urban;
      } else {
        filterList = SUB_FILTERS.news;
      }

      if (!filterList.some(f => f.key === currentSubFilter)) {
        currentSubFilter = 'all';
        sessionStorage.setItem('ph_nav_sub', 'all');
      }

      subFilterContainer.innerHTML = filterList.map(f => {
        const active = f.key === currentSubFilter;
        return `
          <button data-subkey="${f.key}" class="sub-pill px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition ${
            active ? 'bg-orange-500 text-white shadow-xs font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }">
            ${f.label}
          </button>
        `;
      }).join('');

      document.querySelectorAll('.sub-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          currentSubFilter = btn.getAttribute('data-subkey');
          sessionStorage.setItem('ph_nav_sub', currentSubFilter);
          renderSubFilterBar();
          renderContent();
        });
      });

    function renderContent() {
      // 切換主頁籤顯隱
      ['map', 'attraction', 'news'].forEach(tab => {
        document.getElementById(`section-${tab}`).classList.toggle('hidden', tab !== currentMainTab);
        const btn = document.getElementById(`tab-btn-${tab}`);
        if (tab === currentMainTab) {
          btn.className = 'main-tab-pill py-1.5 rounded-lg text-center transition flex items-center justify-center gap-1 bg-white text-orange-600 shadow-sm font-bold';
        } else {
          btn.className = 'main-tab-pill py-1.5 rounded-lg text-center transition flex items-center justify-center gap-1 text-amber-100 hover:text-white';
        }
      });

      // 海島狀態下更新第一 Tab 標題
      document.getElementById('tab-label-map').innerText = isIslandMode(currentCity) ? '美食/度假' : '美食饗宴';

      if (currentMainTab === 'map') renderRestaurants();
      if (currentMainTab === 'attraction') renderAttractions();
      if (currentMainTab === 'news') renderNews();
    }

      document.getElementById('loading').style.display = 'none';

      let filtered = allRestaurants.filter(item => {
        const matchC = isCityMatch(item, currentCity);
        if (!matchC) return false;

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `${msg}（請用繁體中文以2到3句話俐落重點回答，字數嚴格控制在100字內）`,
            lang: 'zh-TW',
            currentCity: currentCity,
            restaurantsContext: `精選參考: ${resContext}`
          })
        });
        const data = await res.json();
        const loadEl = document.getElementById(loadId);
        if (loadEl) {
          loadEl.className = 'bg-white p-2.5 rounded-xl rounded-tl-sm border border-slate-200/70 text-slate-800 text-xs self-start max-w-[88%] leading-relaxed shadow-2xs';
          loadEl.innerText = data.reply;
        }
      } catch (err) {
        const loadEl = document.getElementById(loadId);
        if (loadEl) {
          loadEl.className = 'bg-white p-2.5 rounded-xl rounded-tl-sm border border-slate-200/70 text-slate-800 text-xs self-start max-w-[88%] leading-relaxed shadow-2xs';
          loadEl.innerText = "已為您快速查詢！推薦造訪達沃 Yaki2gether 日料、馬尼拉王城區歷史古蹟與長灘島白沙灘。";
        }
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 12. 初始化啟動
    initVisitorCounter();
    fetchData();
  </script>
</body>
</html>
