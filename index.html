    <meta charset="UTF-8">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#EA580C">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdfbf7; color: #333; padding-bottom: 50px; }
        
        /* 頂部固定 Header */
        header { background: #EA580C; color: white; padding: 12px 16px 0 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; }
        .header-inner { max-width: 600px; margin: 0 auto; width: 100%; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-top h1 { font-size: 1.15rem; font-weight: bold; letter-spacing: 0.5px; }
        
        .btn-share { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; outline: none; }
        .btn-share:active { background: rgba(255, 255, 255, 0.35); }

        .controls-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .app-select { flex: 1; background: rgba(255, 255, 255, 0.18); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 6px 10px; border-radius: 6px; font-size: 0.82rem; outline: none; cursor: pointer; text-overflow: ellipsis; }
        .app-select option { color: #333; background: white; }

        /* 即時搜尋框 */
        .search-container { position: relative; margin-bottom: 10px; display: flex; align-items: center; width: 100%; }
        .search-input { width: 100%; background: #ffffff; color: #292524; border: 1px solid #fed7aa; border-radius: 22px; padding: 8px 36px 8px 36px; font-size: 0.85rem; outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: all 0.2s; }
        .search-input:focus { border-color: #ea580c; box-shadow: 0 2px 10px rgba(234, 88, 12, 0.2); }
        .search-icon { position: absolute; left: 12px; color: #ea580c; font-size: 0.85rem; pointer-events: none; }
        .search-clear-btn { position: absolute; right: 10px; background: #e7e5e4; border: none; width: 20px; height: 20px; border-radius: 50%; color: #78716c; font-size: 0.72rem; cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 1; }

        /* 三欄式主導覽 Tab 切換（絕對鎖定在 Header 底部，絕不跑版） */
        .main-tabs { display: flex; border-top: 1px solid rgba(255,255,255,0.2); width: 100%; margin-top: 6px; }
        .main-tab-btn { flex: 1; text-align: center; padding: 10px 4px; font-weight: bold; font-size: 0.85rem; color: rgba(255,255,255,0.75); border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
        .main-tab-btn.active { color: white; border-bottom: 3px solid white; }

        /* 分類列與二級篩選 Bar */
        .category-bar, .sub-filter-bar { display: none; gap: 8px; overflow-x: auto; padding: 10px 16px; background: #ffffff; margin: 0 auto; border-bottom: 1px solid #f1ece1; width: 100vw; max-width: 600px; }
        .category-bar::-webkit-scrollbar, .sub-filter-bar::-webkit-scrollbar { display: none; }
        .cat-chip { padding: 6px 14px; border-radius: 18px; font-size: 0.85rem; background: #f5f2eb; color: #666; white-space: nowrap; border: none; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
        .cat-chip.active { background: #EA580C; color: white; font-weight: bold; }

        /* 內容容器與卡片設計 */
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .grid-layout { display: flex; flex-direction: column; gap: 20px; }
        .search-results-info { font-size: 0.8rem; color: #78716c; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

        .card { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.05); border: 1px solid #f0eae1; display: flex; flex-direction: column; }
        .carousel-container { position: relative; width: 100%; height: 210px; min-height: 210px; background: #f7f5f0; overflow: hidden; flex-shrink: 0; }
        .carousel-track { display: flex; width: 100%; height: 210px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide { flex: 0 0 100%; width: 100%; height: 210px; scroll-snap-align: start; position: relative; }
        .carousel-slide img { width: 100%; height: 210px; object-fit: cover; display: block; }
        .carousel-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; z-index: 10; pointer-events: none; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); }
        .dot.active { background: #ffffff; width: 14px; border-radius: 4px; }
        .photo-tag { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.6); color: white; font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; z-index: 10; }

        .card-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
        .badge-group { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .badge { display: inline-flex; align-items: center; background: #fff7ed; color: #c2410c; font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; border: 1px solid #ffedd5; }
        .badge-city { background: #f0f9ff; color: #0369a1; border-color: #e0f2fe; }
        .badge-promo { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
        .badge-brand { background: #fefce8; color: #a16207; border-color: #fef08a; }
        .badge-expiry { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; font-weight: bold; }
        .badge-google-rating { background: #fef3c7; color: #92400e; border-color: #fde68a; font-weight: bold; gap: 4px; }
        .badge-elite-choice { background: #fff1f2; color: #e11d48; border-color: #fecdd3; font-weight: bold; gap: 4px; }

        .card-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; color: #1c1917; line-height: 1.35; }
        .card-desc { font-size: 0.88rem; color: #57534e; line-height: 1.5; margin-bottom: 12px; }
        .info-item { font-size: 0.85rem; color: #78716c; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }

        .btn-group { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: calc(50% - 3px); padding: 10px 6px; border-radius: 8px; font-size: 0.82rem; font-weight: bold; text-align: center; text-decoration: none; border: none; cursor: pointer; }
        .btn-primary { background: #EA580C; color: white; }
        .btn-secondary { background: #f5f2eb; color: #44403c; }
        .btn-grab { background: #00B14F; color: white; }
        .btn-foodpanda { background: #D70F64; color: white; }
        
        #loading { text-align: center; padding: 40px; color: #a8a29e; }

        /* 3D AI 管家懸浮按鈕 */
        .chat-fab { position: fixed; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: #ffffff; border: 2px solid #ea580c; box-shadow: 0 6px 20px rgba(234, 88, 12, 0.45); overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; }
        .chat-fab img { width: 100%; height: 100%; object-fit: cover; }
        .chat-modal { display: none; position: fixed; bottom: 92px; right: 20px; width: 350px; max-width: calc(100vw - 32px); height: 500px; max-height: calc(100vh - 110px); background: #ffffff; border-radius: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.18); border: 1px solid #f0e6d8; flex-direction: column; z-index: 1000; overflow: hidden; }
        .chat-modal.show { display: flex; }
        .chat-header { background: #EA580C; color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header-info { display: flex; align-items: center; gap: 8px; }
        .chat-avatar-small { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 1.5px solid white; background: white; flex-shrink: 0; }
        .chat-avatar-small img { width: 100%; height: 100%; object-fit: cover; }
        .btn-close-chat { background: rgba(255,255,255,0.2); border: none; color: white; width: 26px; height: 26px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fdfbf7; font-size: 0.85rem; }
        .chat-bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; word-break: break-word; }
        .chat-bubble.bot { background: #ffffff; border: 1px solid #e7e2d7; align-self: flex-start; color: #292524; border-top-left-radius: 4px; }
        .chat-bubble.user { background: #EA580C; color: white; align-self: flex-end; border-top-right-radius: 4px; }
        .chat-input-area { display: flex; border-top: 1px solid #efe8dc; padding: 10px 12px; background: #ffffff; gap: 8px; align-items: center; }
        .chat-input { flex: 1; border: 1px solid #e2d9cd; border-radius: 20px; padding: 9px 14px; font-size: 0.85rem; outline: none; background: #faf8f5; }
        .btn-send-chat { background: #EA580C; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; font-weight: bold; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>

<body>

    <header>
        <div class="header-inner">
            <div class="header-top">
                <h1 id="app-title">📍 大V的旅遊窩</h1>
                <button class="btn-share" id="share-btn" onclick="shareApp()">📤 分享</button>
            </div>
            
            <div class="controls-row">
                <select class="app-select" id="city-select" onchange="changeCity(this.value)">
                    <option value="all">全部城市 (All Cities)</option>
                    <option value="davao">達沃 (Davao)</option>
                    <option value="manila">馬尼拉 (Manila)</option>
                    <option value="cebu">宿霧 (Cebu)</option>
                </select>
                <select class="app-select" id="lang-select" onchange="changeLanguage(this.value)">
                    <option value="zh-TW">繁體中文</option>
                    <option value="en">English</option>
                    <option value="tl">Tagalog</option>
                </select>
            </div>

            <!-- 即時搜尋框 -->
            <div class="search-container" id="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" class="search-input" id="search-input" placeholder="搜尋燒肉、火鍋、景點、演唱會..." oninput="handleSearchInput(this.value)">
                <button class="search-clear-btn" id="search-clear-btn" onclick="clearSearch()" title="清除">✕</button>
            </div>

            <!-- 三欄式主導覽 Tab 切換 -->
            <div class="main-tabs">
                <button class="main-tab-btn active" id="tab-btn-map" onclick="switchMainTab('map')">🗺️ 美食地圖</button>
                <button class="main-tab-btn" id="tab-btn-attraction" onclick="switchMainTab('attraction')">🏛️ 景點導覽</button>
                <button class="main-tab-btn" id="tab-btn-news" onclick="switchMainTab('news')">📰 城市動態</button>
            </div>
        </div>
    </header>

    <!-- 美食分類列 -->
    <div class="category-bar" id="category-bar"></div>

    <!-- 景點二級分類 Bar -->
    <div class="sub-filter-bar" id="attraction-filter-bar">
        <button class="cat-chip active" id="att-sub-all" onclick="filterAttractionCat('all')">全部景點</button>
        <button class="cat-chip" id="att-sub-history" onclick="filterAttractionCat('history')">🏛️ 歷史文化</button>
        <button class="cat-chip" id="att-sub-nature" onclick="filterAttractionCat('nature')">🌳 自然海灘</button>
        <button class="cat-chip" id="att-sub-shopping" onclick="filterAttractionCat('shopping')">🛒 購物商場</button>
    </div>

    <!-- 城市動態二級篩選 Bar -->
    <div class="sub-filter-bar" id="news-filter-bar">
        <button class="cat-chip active" id="news-sub-all" onclick="filterNewsType('all')">全部動態</button>
        <button class="cat-chip" id="news-sub-promo" onclick="filterNewsType('promo')">🔥 限時優惠</button>
        <button class="cat-chip" id="news-sub-new" onclick="filterNewsType('new')">✨ 新開餐廳</button>
        <button class="cat-chip" id="news-sub-event" onclick="filterNewsType('event')">🎵 演唱會與活動</button>
        <button class="cat-chip" id="news-sub-movie" onclick="filterNewsType('movie')">🎬 電影與娛樂</button>
    </div>

    <!-- 美食地圖 Tab 內容 -->
    <div id="main-tab-map" class="tab-content active">
        <div class="container">
            <div id="search-results-info" class="search-results-info" style="display:none;"></div>
            <div id="loading">載入最新美食與旅遊清單中...</div>
            <div id="restaurant-list" class="grid-layout"></div>
        </div>
    </div>

    <!-- 景點導覽 Tab 內容 -->
    <div id="main-tab-attraction" class="tab-content">
        <div class="container">
            <div id="attraction-list" class="grid-layout">載入景點導覽中...</div>
        </div>
    </div>

    <!-- 城市動態 Tab 內容 -->

    <button class="chat-fab" id="chat-fab" onclick="toggleChat()" title="大V旅遊窩管家">
        <img src="ai-avatar.png" alt="AI 管家" onerror="this.src='ai-avatar.jpg'">
    </button>

    <div class="chat-modal" id="chat-modal">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-avatar-small">
                    <img src="ai-avatar.png" alt="AI" onerror="this.src='ai-avatar.jpg'">

        <div class="chat-input-area">

        function normalizeName(name) {
            if (!name) return '';
            return name.toLowerCase().replace(/\([^)]*\)/g, '').replace(/[^a-z0-9\u4e00-\u9fa5]/g, '').trim();
        }

        function deduplicate(list) {
            const uniqueMap = new Map();
            list.forEach(item => {
                const normName = normalizeName(item.name_en || item.name || '');
                const city = (item.city || 'davao').toLowerCase();
                const key = `${city}_${normName}`;
                if (!uniqueMap.has(key)) uniqueMap.set(key, item);
            });
            return Array.from(uniqueMap.values());
        }

        function getImageArray(name, poolKey) {
            const pool = categoryImagePools[poolKey] || categoryImagePools.attraction;
            let hash = 0;
            const str = name || 'default';
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            const start = Math.abs(hash) % pool.length;
            const res = [];
            for (let i = 0; i < 3; i++) res.push(pool[(start + i) % pool.length]);
            return res;
        }

        window.handleCarouselScroll = function(el, key) {
            const idx = Math.round(el.scrollLeft / el.clientWidth);
            const dots = document.querySelectorAll('#dots-' + key + ' .dot');
            dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        };

        function matchQuery(item, q) {
            if (!q) return true;
            const query = q.toLowerCase();
            const keywords = new Set([query]);
            Object.keys(SYNONYM_MAP).forEach(k => {
                if (query.includes(k) || k.includes(query)) SYNONYM_MAP[k].forEach(s => keywords.add(s.toLowerCase()));
            });
            const text = `${item.name || ''} ${item.name_en || ''} ${item.address || ''} ${item.description || ''} ${item.title || ''}`.toLowerCase();
            for (const kw of keywords) {
                if (text.includes(kw)) return true;
            }
            return false;
        }

                return matchC && matchK;
            });

            const searchInfo = document.getElementById('search-results-info');

                filtered = filtered.filter(item => matchQuery(item, currentSearchQuery));
                searchInfo.style.display = 'flex';
                searchInfo.innerHTML = `<span>${langData.searchResultText.replace('{count}', filtered.length).replace('{keyword}', currentSearchQuery)}</span><a href="javascript:void(0)" onclick="clearSearch()" style="color:#ea580c; text-decoration:underline;">${langData.clearSearch}</a>`;
            } else {
                searchInfo.style.display = 'none';

                listEl.innerHTML = `<p style="text-align:center; color:#a8a29e; padding: 40px; grid-column: 1/-1;">${langData.noData}</p>`;

                    badge = `<span class="badge badge-google-rating"><i class="fa-solid fa-star" style="color:#eab308;"></i> Google ${Number(item.googleRating).toFixed(1)} (${item.googleReviewCount||0}則)</span>`;

                    badge = `<span class="badge badge-elite-choice"><i class="fa-solid fa-award"></i> ${langData.eliteChoice} (${count}則)</span>`;
                }

                const comments = resComments[key] || [];
                const name = item.names?.[currentLang] || item.name || 'Unknown';
                const desc = item.descriptions?.[currentLang] || item.description || langData.noDesc;

                return `
                    <div class="card">
                        <div class="carousel-container">

                            </div>
                            <div class="carousel-dots" id="dots-${key}">
                                ${images.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('')}
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="badge-group">
                                <span class="badge badge-city">${langData.cities[item.city || 'davao']}</span>
                                <span class="badge">${langData.cats[catKey] || catKey}</span>
                                ${badge}
                            </div>
                            <div class="card-title">${name}</div>
                            <div class="card-desc">${desc}</div>
                            <div class="info-item"><span>📍</span> <span>${item.address || ''}</span></div>
                            <div class="info-item"><span>📞</span> <span>${item.phone || langData.noPhone}</span></div>

                            <div class="card-forum-box">
                                <div class="rating-header">
                                    <div class="rating-left">
                                        <span class="rating-label">${langData.localScoreLabel}</span>
                                        <span class="rating-score-num">${avg}</span>
                                        <span class="rating-count-hint">(${count})</span>
                                    </div>
                                    <div class="star-picker">
                                        ${[1,2,3,4,5].map(s => `<span class="${s <= userScore ? 'active' : ''}" onclick="rateRestaurant('${key}', ${s})">★</span>`).join('')}
                                    </div>
                                </div>
                                <button class="btn-toggle-forum" onclick="toggleRestaurantForum('${key}')">
                                    <span>💬 ${langData.toggleForumText} (${comments.length})</span><span>▼</span>
                                </button>
                                <div class="forum-content" id="forum-${key}">
                                    <div class="mini-comment-form">
                                        <div class="mini-form-row">
                                            <input type="text" id="input-user-${key}" class="mini-input" placeholder="Nickname" maxlength="15">
                                            <select id="select-rating-${key}" class="mini-select">
                                                <option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option>
                                            </select>
                                        </div>
                                        <textarea id="input-text-${key}" class="mini-textarea" placeholder="Tips..."></textarea>
                                        <button class="btn-mini-post" onclick="postResComment('${key}')">${langData.postBtnText}</button>
                                    </div>
                                    <div>
                                        ${comments.length > 0 ? comments.map(c => `
                                            <div class="review-item">
                                                <div><span class="review-user">👤 ${c.user}</span> <span style="color:#f59e0b;">${'⭐'.repeat(c.rating)}</span><span class="review-time">${c.time}</span></div>
                                                <div class="review-text">${c.text}</div>
                                            </div>
                                        `).join('') : '<div style="color:#a8a29e; font-size:0.78rem; text-align:center;">No reviews.</div>'}
                                    </div>
                                </div>
                            </div>

                            <div class="btn-group">
                                <a class="btn btn-primary" href="tel:${item.phone}">${langData.call}</a>
                                <a class="btn btn-secondary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' ' + (item.address || ''))}" target="_blank">${langData.map}</a>
                                ${item.grabUrl ? `<a class="btn btn-grab" href="${item.grabUrl}" target="_blank">${langData.grab}</a>` : ''}
                                ${item.foodpandaUrl ? `<a class="btn btn-foodpanda" href="${item.foodpandaUrl}" target="_blank">${langData.foodpanda}</a>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染景點（確保所有分類皆能正常顯示）
        function renderAttractionList() {
            const listEl = document.getElementById('attraction-list');
            const langData = i18n[currentLang];

            let filtered = (allAttractions || []).filter(item => {
                const matchC = (currentCity === 'all') || (item.city === currentCity);
                const matchCat = (currentAttractionCat === 'all') || (item.category === currentAttractionCat);
                return matchC && matchCat;
            });

            if (currentSearchQuery) filtered = filtered.filter(item => matchQuery(item, currentSearchQuery));

            if (filtered.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:#a8a29e; padding: 40px; grid-column: 1/-1;">${langData.noAttractionData}</p>`;
                return;
            }

            listEl.innerHTML = filtered.map((item, idx) => {
                const key = 'att_' + (item.city || 'davao') + '_' + idx;
                const images = item.images || getImageArray(item.name, 'attraction');
                const name = item.name || 'Attraction';
                const desc = item.description_zh || item.description || langData.noDesc;

                return `
                    <div class="card">
                        <div class="carousel-container">
                            <span class="photo-tag">${langData.slideHint}</span>
                            <div class="carousel-track" onscroll="handleCarouselScroll(this, '${key}')">
                                ${images.map(img => `<div class="carousel-slide"><img src="${img}" alt="Attraction" loading="lazy"></div>`).join('')}
                            </div>
                            <div class="carousel-dots" id="dots-${key}">
                                ${images.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('')}
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="badge-group">
                                <span class="badge badge-city">${langData.cities[item.city || 'davao']}</span>
                                <span class="badge" style="background:#fdf4ff; color:#a21caf;">🏛️ 景點</span>
                            </div>
                            <div class="card-title">${name}</div>
                            <div class="card-desc">${desc}</div>
                            <div class="info-item"><span>📍</span> <span>${item.address || ''}</span></div>
                            <div class="info-item"><span>📞</span> <span>${item.phone || langData.noPhone}</span></div>
                            <div class="btn-group" style="margin-top:auto;">
                                <a class="btn btn-primary" href="tel:${item.phone || ''}">${langData.call}</a>
                                <a class="btn btn-secondary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' ' + (item.address || ''))}" target="_blank">${langData.map}</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染城市動態（全面修復各類別篩選與文字對應，絕不空白）
        function renderNewsList() {
            const listEl = document.getElementById('news-list');
            const langData = i18n[currentLang];

            let filtered = (allNews || []).filter(item => {
                const matchC = (currentCity === 'all') || (item.city === 'all') || (item.city === currentCity);
                // 確保動態分類（promo, new, event, movie）與篩選按鈕完全吻合
                const matchS = (currentNewsSubFilter === 'all') || (item.type === currentNewsSubFilter);
                return matchC && matchS;
            });

            if (currentSearchQuery) filtered = filtered.filter(item => matchQuery(item, currentSearchQuery));

            if (filtered.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:#a8a29e; padding: 40px; grid-column: 1/-1;">${langData.noNewsData}</p>`;
                return;
            }

            listEl.innerHTML = filtered.map((item, idx) => {
                const title = item.title || 'Event News';
                const tag = item.tag || '🔥 動態';
                const validity = item.validity || '本週最新';
                const desc = typeof item.description === 'string' ? item.description : (typeof item.description_zh === 'string' ? item.description_zh : (item.description?.zh || langData.noDesc));
                const location = item.location || 'Philippines';
                const img = item.imageUrl || (item.type === 'movie' ? categoryImagePools.movie[0] : (item.type === 'event' ? categoryImagePools.event[0] : (item.type === 'new' ? categoryImagePools.chinese[0] : categoryImagePools.filipino[0])));
                const titleHtml = item.url ? `<a href="${item.url}" target="_blank" style="color:#1c1917; text-decoration:none; border-bottom:2px solid #EA580C;">${title} 🔗</a>` : title;

                return `
                    <div class="card">
                        <div style="width:100%; height:200px; background:#f7f5f0; flex-shrink:0;">
                            <img src="${img}" alt="News" style="width:100%; height:100%; object-fit:cover; display:block;" loading="lazy">
                        </div>
                        <div class="card-body">
                            <div class="badge-group">
                                <span class="badge badge-city">${langData.cities[item.city] || 'Philippines'}</span>
                                ${item.brand ? `<span class="badge badge-brand">${item.brand}</span>` : ''}
                                <span class="badge badge-promo">${tag}</span>
                                ${validity ? `<span class="badge badge-expiry">⏰ ${validity}</span>` : ''}
                            </div>
                            <div class="card-title" style="font-size:1.1rem;">${titleHtml}</div>
                            <div class="card-desc" style="color:#44403c;">${desc}</div>
                            <div class="info-item" style="margin-top:auto;"><span>📍</span> <span>${location}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // AI 聊天
        window.toggleChat = function() {
            const modal = document.getElementById('chat-modal');
            modal.classList.toggle('show');
            if (modal.classList.contains('show')) document.getElementById('chat-input').focus();
        };

        window.handleChatKeyPress = function(e) { if (e.key === 'Enter') sendChatMessage(); };

        window.sendChatMessage = async function() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            const messages = document.getElementById('chat-messages');
            const langData = i18n[currentLang];

            messages.innerHTML += `<div class="chat-bubble user">${msg}</div>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            const loadId = 'load-' + Date.now();
            messages.innerHTML += `<div class="chat-bubble bot" id="${loadId}">${langData.chatThinking}</div>`;
            messages.scrollTop = messages.scrollHeight;

            const activeCity = document.getElementById('city-select').value || currentCity;
            const resContext = (allRestaurants || []).filter(i => activeCity === 'all' || i.city === activeCity).slice(0, 30).map(r => r.name).join(', ');
            const attContext = (allAttractions || []).filter(i => activeCity === 'all' || i.city === activeCity).slice(0, 20).map(a => a.name).join(', ');

            try {
                const res = await fetch(AI_WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, lang: currentLang, currentCity: activeCity, restaurantsContext: `餐廳: ${resContext} | 景點: ${attContext}` })
                });
                const data = await res.json();
                const loadEl = document.getElementById(loadId);
                if (loadEl) loadEl.innerText = data.reply;
            } catch (err) {
                const loadEl = document.getElementById(loadId);
                if (loadEl) loadEl.innerText = langData.chatError;
            }
            messages.scrollTop = messages.scrollHeight;
        };

        fetchData();
    </script>
</body>
</html>
