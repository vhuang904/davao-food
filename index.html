        function getInitialLanguage() {
            const savedLang = localStorage.getItem('ph_app_lang');
            if (savedLang && i18n[savedLang]) return savedLang;

            const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            if (browserLang.startsWith('zh')) return 'zh-TW';
            if (browserLang.startsWith('tl') || browserLang.startsWith('fil')) return 'tl';
            return 'en';
        }

        let currentLang = getInitialLanguage();
        let currentCity = localStorage.getItem('ph_app_city') || 'all';
        let currentCategoryKey = localStorage.getItem('ph_app_cat') || 'all';
        let currentMainTab = localStorage.getItem('ph_app_tab') || 'map';
        let currentNewsSubFilter = localStorage.getItem('ph_app_news_sub') || 'all';
        let allRestaurants = [];

        let itemRatings = JSON.parse(localStorage.getItem('ph_item_ratings')) || {};
        let resComments = JSON.parse(localStorage.getItem('ph_res_comments')) || {};

        // 從 Firebase Firestore 讀取餐廳清單
        async function fetchRestaurants() {
            try {
                const querySnapshot = await getDocs(collection(db, "restaurants"));
                allRestaurants = [];
                querySnapshot.forEach((doc) => {
                    allRestaurants.push(doc.data());
                });
                
                // 如果資料庫剛建立還沒有資料，提供備用或提示
                if (allRestaurants.length === 0) {
                    console.log("Firestore 尚無餐廳資料");
                }
            } catch (error) {
                console.error("讀取 Firebase 資料失敗：", error);
                allRestaurants = [];
            }
            renderUI();
            switchMainTab(currentMainTab);
            filterNewsType(currentNewsSubFilter);
        }

        function switchMainTab(tab) {
            currentMainTab = tab;
            localStorage.setItem('ph_app_tab', tab);

            document.getElementById('tab-btn-map').classList.toggle('active', tab === 'map');
            document.getElementById('tab-btn-news').classList.toggle('active', tab === 'news');
            document.getElementById('main-tab-map').classList.toggle('active', tab === 'map');
            document.getElementById('main-tab-news').classList.toggle('active', tab === 'news');
            
            document.getElementById('category-bar').style.display = (tab === 'map') ? 'flex' : 'none';
            document.getElementById('news-filter-bar').style.display = (tab === 'news') ? 'flex' : 'none';

            if (tab === 'news') renderNewsList();
        }

        function filterNewsType(subType) {
            currentNewsSubFilter = subType;
            localStorage.setItem('ph_app_news_sub', subType);

            document.getElementById('news-sub-all').classList.toggle('active', subType === 'all');
            document.getElementById('news-sub-promo').classList.toggle('active', subType === 'promo');
            document.getElementById('news-sub-new').classList.toggle('active', subType === 'new');
            renderNewsList();
        }

            currentLang = lang;
            localStorage.setItem('ph_app_lang', lang);
            renderUI();
        }

        function changeCity(city) {
            currentCity = city;
            localStorage.setItem('ph_app_city', city);
            renderList();
            renderNewsList();
        }

        function filterCategory(catKey) {
            currentCategoryKey = catKey;
            localStorage.setItem('ph_app_cat', catKey);
            renderCategoryBar();

        }

        function shareApp() {
            const langData = i18n[currentLang];
            const shareUrl = window.location.href;

            if (navigator.share) {
                navigator.share({
                    title: langData.shareTitle,
                    text: langData.shareText,
                    url: shareUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert(langData.shareSuccess);
                }).catch(() => {
                    alert("連結：" + shareUrl);
                });
            }
        }

        function renderUI() {
            const langData = i18n[currentLang];
            document.getElementById('lang-select').value = currentLang;
            document.getElementById('city-select').value = currentCity;
            document.getElementById('app-title').innerText = langData.title;
            document.getElementById('tab-btn-map').innerText = langData.tabMap;
            document.getElementById('tab-btn-news').innerText = langData.tabNews;
            document.getElementById('share-btn').innerText = langData.shareBtn;

            renderCategoryBar();
            renderList();
            renderNewsList();
        }

        function renderCategoryBar() {
            const bar = document.getElementById('category-bar');
            const cats = i18n[currentLang].cats;
            const keys = ['all', 'chinese', 'japanese_korean', 'fast_food', 'bbq_seafood', 'coffee_drinks', 'filipino'];

            bar.innerHTML = keys.map(key => `
                <button class="cat-chip ${key === currentCategoryKey ? 'active' : ''}" onclick="filterCategory('${key}')">
                    ${cats[key]}
                </button>
            `).join('');
        }

        function rateRestaurant(resKey, score) {
            if (!itemRatings[resKey]) {
                itemRatings[resKey] = { scores: [], userRated: null };
            }
            itemRatings[resKey].scores.push(score);
            itemRatings[resKey].userRated = score;
            localStorage.setItem('ph_item_ratings', JSON.stringify(itemRatings));
            
            alert(i18n[currentLang].rateSuccess);
            renderList();
        }

        function toggleRestaurantForum(resKey) {
            const el = document.getElementById('forum-' + resKey);
            if (el) el.classList.toggle('show');
        }

        function postResComment(resKey) {
            const user = document.getElementById('input-user-' + resKey).value.trim();
            const rating = parseInt(document.getElementById('select-rating-' + resKey).value);
            const text = document.getElementById('input-text-' + resKey).value.trim();
            const langData = i18n[currentLang];

            if (!user || !text) {
                alert(langData.emptyCommentAlert);
                return;
            }

            const now = new Date();
            const timeStr = (now.getMonth()+1) + '/' + now.getDate() + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

            if (!resComments[resKey]) resComments[resKey] = [];
            
            resComments[resKey].unshift({
                user: user,
                rating: rating,
                text: text,
                time: timeStr
            });

            rateRestaurant(resKey, rating);

            localStorage.setItem('ph_res_comments', JSON.stringify(resComments));
            alert(langData.commentSuccess);
            
            document.getElementById('input-text-' + resKey).value = '';
            renderList();
            const el = document.getElementById('forum-' + resKey);
            if (el) el.classList.add('show');
        }

        function getUniqueRestaurantImageArray(name, catKey) {
            const pool = categoryImagePools[catKey] || categoryImagePools.filipino;
            let hash = 0;
            const str = name || 'default';
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const startIndex = Math.abs(hash) % pool.length;
            
            const images = [];
            for (let i = 0; i < 4; i++) {
                images.push(pool[(startIndex + i) % pool.length]);
            }
            return images;
        }

        function handleCarouselScroll(el, resKey) {
            const scrollLeft = el.scrollLeft;
            const width = el.clientWidth;
            const index = Math.round(scrollLeft / width);
            
            const dots = document.querySelectorAll('#dots-' + resKey + ' .dot');
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === index);
            });
        }

            const listEl = document.getElementById('restaurant-list');
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.style.display = 'none';
            const langData = i18n[currentLang];

            const filtered = (allRestaurants || []).filter(item => {
                const matchesCity = (currentCity === 'all') || (item.city === currentCity);
                const matchesCat = (currentCategoryKey === 'all') || ((item.categoryKey || 'filipino') === currentCategoryKey);
                return matchesCity && matchesCat;
            });

            if (!filtered || filtered.length === 0) {
                listEl.innerHTML = `<p style="text-align:center; color:#a8a29e; padding: 40px;">${langData.noData}</p>`;
                return;
            }

            listEl.innerHTML = filtered.map((item, idx) => {
                const catKey = item.categoryKey || 'filipino';
                const resKey = (item.city || 'davao') + '_' + (item.name || idx).replace(/[^a-zA-Z0-9]/g, '');

                const imageList = getUniqueRestaurantImageArray(item ? item.name : '', catKey);

                const ratingData = itemRatings[resKey] || { scores: [5], userRated: null };
                const totalScores = ratingData.scores;
                const avgRating = (totalScores.reduce((a, b) => a + b, 0) / totalScores.length).toFixed(1);
                const count = totalScores.length;
                const userScore = ratingData.userRated || 0;

                const commentsList = resComments[resKey] || [];

                let displayDesc = langData.noDesc;
                if (item.descriptions && item.descriptions[currentLang]) {
                    displayDesc = item.descriptions[currentLang];
                } else if (item.description_zh) {
                    displayDesc = item.description_zh;
                } else if (item.description) {
                    displayDesc = item.description;
                }

                var carouselSlides = imageList.map(function(imgUrl) {
                    return '<div class="carousel-slide"><img src="' + imgUrl + '" alt="Restaurant" loading="lazy"></div>';
                }).join('');

                var carouselDots = imageList.map(function(_, imgIdx) {
                    return '<div class="dot ' + (imgIdx === 0 ? 'active' : '') + '"></div>';
                }).join('');

                var grabBtnHtml = item.grabUrl ? `<a class="btn btn-grab" href="${item.grabUrl}" target="_blank">${langData.grab}</a>` : '';
                var foodpandaBtnHtml = item.foodpandaUrl ? `<a class="btn btn-foodpanda" href="${item.foodpandaUrl}" target="_blank">${langData.foodpanda}</a>` : '';

                return `
                    <div class="card">
                        <div class="carousel-container">
                            <span class="photo-tag">👈 左右滑動看多圖 (${imageList.length})</span>
                            <div class="carousel-track" onscroll="handleCarouselScroll(this, '${resKey}')">
                                ${carouselSlides}
                            </div>
                            <div class="carousel-dots" id="dots-${resKey}">
                                ${carouselDots}
                            </div>
                        </div>

                        <div class="card-body">
                            <div class="badge-group">
                                <span class="badge badge-city">${langData.cities[item.city || 'davao']}</span>
                                <span class="badge">${langData.cats[catKey] || catKey}</span>
                            </div>
                            <div class="card-title">${item.name || 'Unknown'}</div>
                            <div class="card-desc">${displayDesc}</div>
                            <div class="info-item">📍 ${item.address || ''}</div>
                            <div class="info-item">📞 ${item.phone || langData.noPhone}</div>

                            <div class="card-forum-box">
                                <div class="rating-header">
                                    <span class="rating-score">⭐ ${avgRating} / 5.0 (${count}則評分)</span>
                                    <div class="star-picker" title="點擊進行評分">
                                        ${[1, 2, 3, 4, 5].map(s => `
                                            <span class="${s <= userScore ? 'active' : ''}" onclick="rateRestaurant('${resKey}', ${s})">★</span>
                                        `).join('')}
                                    </div>
                                </div>

                                <button class="btn-toggle-forum" onclick="toggleRestaurantForum('${resKey}')">
                                    <span>${langData.toggleForumText} (${commentsList.length})</span>
                                    <span style="font-size:0.75rem;">▼ 展開 / 留言</span>
                                </button>

                                <div class="forum-content" id="forum-${resKey}">
                                    <div class="mini-comment-form">
                                        <div class="mini-form-row">
                                            <input type="text" id="input-user-${resKey}" class="mini-input" placeholder="暱稱" maxlength="15">
                                            <select id="select-rating-${resKey}" class="mini-select">
                                                <option value="5">⭐⭐⭐⭐⭐</option>
                                                <option value="4">⭐⭐⭐⭐</option>
                                                <option value="3">⭐⭐⭐</option>
                                                <option value="2">⭐⭐</option>
                                                <option value="1">⭐</option>
                                            </select>
                                        </div>
                                        <textarea id="input-text-${resKey}" class="mini-textarea" placeholder="分享您對這家餐廳的吃法、推薦菜色或避雷心得..."></textarea>
                                        <button class="btn-mini-post" onclick="postResComment('${resKey}')">${langData.postBtnText}</button>
                                    </div>

                                    <div class="reviews-list">
                                        ${commentsList.length > 0 ? commentsList.map(c => `
                                            <div class="review-item">
                                                <div>
                                                    <span class="review-user">👤 ${c.user}</span>
                                                    <span style="color:#f59e0b; font-size:0.75rem; margin-left:4px;">${'⭐'.repeat(c.rating)}</span>
                                                    <span class="review-time">${c.time}</span>
                                                </div>
                                                <div class="review-text">${c.text}</div>
                                            </div>
                                        `).join('') : '<div class="review-item" style="color:#a8a29e; text-align:center;">尚無討論，成為第一個評價這家餐廳的人吧！</div>'}
                                    </div>
                                </div>
                            </div>

                            <div class="btn-group">
                                <a class="btn btn-primary" href="tel:${item.phone}">${langData.call}</a>
                                <a class="btn btn-secondary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((item.name || '') + ' ' + (item.address || ''))}" target="_blank">${langData.map}</a>
                                ${grabBtnHtml}
                                ${foodpandaBtnHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderNewsList() {
            const newsEl = document.getElementById('news-list');
            const langData = i18n[currentLang];

            const filteredNews = newsData.filter(item => {
                const matchesCity = (currentCity === 'all') || (item.city === 'all') || (item.city === currentCity);
                const matchesSub = (currentNewsSubFilter === 'all') || (item.type === currentNewsSubFilter);
                return matchesCity && matchesSub;
            });

            if (!filteredNews || filteredNews.length === 0) {
                newsEl.innerHTML = `<p style="text-align:center; color:#a8a29e; padding: 40px;">${langData.noNewsData}</p>`;
                return;
            }

            newsEl.innerHTML = filteredNews.map(item => `
                <div class="card">
                    <img src="${item.imageUrl}" alt="${item.title}" loading="lazy">
                    <div class="card-body">
                        <div class="badge-group">
                            <span class="badge badge-city">${langData.cities[item.city] || '全菲律賓'}</span>
                            ${item.brand ? `<span class="badge badge-brand">${item.brand}</span>` : ''}
                            <span class="badge badge-promo">${item.tag}</span>
                            ${item.validity ? `<span class="badge badge-expiry">⏰ ${item.validity}</span>` : ''}
                        </div>
                        <div class="card-title" style="font-size:1.1rem; margin-top:4px;">${item.title}</div>
                        <div class="card-desc" style="color:#44403c; margin-top:8px;">${item.descriptions[currentLang] || item.descriptions['en']}</div>
                        <div class="info-item" style="margin-top:10px;">📍 ${item.location}</div>
                    </div>
                </div>
            `).join('');
        }

        // 啟動程式
        fetchRestaurants();
    </script>
