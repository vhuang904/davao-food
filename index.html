  <style>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 全域 Toast 提示（置中顯示） -->
  <div id="toastNotification" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[99999] transition-all duration-300 pointer-events-none opacity-0 scale-95 w-auto min-w-[240px] max-w-xs px-4">
    <div id="toastInnerBox" class="bg-slate-950/95 text-white text-xs font-bold px-5 py-3.5 rounded-2xl shadow-2xl flex items-center justify-center gap-2.5 border border-amber-400/50 backdrop-blur-md text-center">
      <i id="toastIcon" class="fa-solid fa-check text-amber-400 text-sm"></i>
      <span id="toastMessage">已完成操作</span>
    </div>
  </div>

  <!-- 頂部 Header -->
  <header class="sticky top-0 z-40 glass-header text-white transition-all">
    <div class="max-w-md mx-auto px-3.5 pt-2.5 pb-1.5 flex flex-col gap-2">
      
      <!-- 第一列：Logo + 訪客計數 + 會員 -->
      <div class="flex items-center justify-between gap-1.5">
        <div class="flex items-center gap-2 min-w-0 flex-1">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center justify-center text-slate-950 shadow-md shadow-amber-500/30 flex-shrink-0">
            <i class="fa-solid fa-crown text-xs"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <h1 data-i18n="appTitle" class="text-xs sm:text-sm font-black tracking-tight text-white truncate leading-none">大V的旅遊窩</h1>
              <div class="bg-slate-800 border border-amber-400/30 rounded-full px-2 py-0.5 text-[9px] sm:text-[10px] font-bold text-amber-300 flex items-center gap-1 shadow-inner flex-shrink-0">
                <i class="fa-solid fa-fire text-amber-400 text-[10px]"></i>
                <span id="visit-count-val">3,856</span>
              </div>
            </div>
            <p data-i18n="appSubtitle" class="text-[9px] text-amber-400/80 font-bold tracking-tight truncate mt-0.5">菲律賓精緻生活 & 海島漫遊地圖</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5 flex-shrink-0">
          <button id="auth-state-btn" class="bg-slate-900 hover:bg-slate-800 border border-amber-400/50 text-amber-300 rounded-full px-2.5 py-1 text-[11px] font-bold flex items-center gap-1.5 transition active:scale-95 whitespace-nowrap shadow-sm">
            <span id="user-avatar-container" class="inline-flex items-center justify-center">
              <i id="user-avatar-icon" class="fa-regular fa-user text-[10px]"></i>
            </span>
            <span id="auth-btn-text" data-i18n="btnLogin">登入</span>
          </button>
          <button id="share-btn" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 flex items-center justify-center transition active:scale-95 shadow-sm">
            <i class="fa-solid fa-share-nodes text-[11px]"></i>
          </button>
        </div>
      </div>

      <!-- 第二列：搜尋欄 + 語言 -->
      <div class="flex items-center gap-1.5">
        <div class="relative flex-1 flex items-center">
          <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-500 text-xs pointer-events-none"></i>
          <input id="search-input" type="text" placeholder="搜尋和牛、海鮮、夜生活、Villa、急診..." class="w-full bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-500 text-xs rounded-xl pl-8 pr-7 py-2 focus:outline-none focus:border-amber-400/70 shadow-inner transition" />
          <button id="search-clear-btn" class="absolute right-2 text-slate-500 hover:text-slate-300 hidden text-xs p-1">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
        <select id="lang-select" class="bg-slate-950 border border-slate-800 text-amber-300 text-[11px] font-bold rounded-xl px-2 py-2 focus:outline-none cursor-pointer flex-shrink-0">
          <option value="zh-TW" class="bg-slate-900 text-white">繁體中文</option>
          <option value="en" class="bg-slate-900 text-white">English</option>
          <option value="tl" class="bg-slate-900 text-white">Tagalog</option>
        </select>
      </div>

      <!-- 第三列：都會 vs 海島 -->
      <div class="bg-slate-950 p-1 rounded-2xl border border-slate-800 flex gap-1 shadow-inner">
        <button id="typeCityBtn" class="flex-1 py-1.5 text-xs font-bold rounded-xl transition text-center shadow-md flex items-center justify-center gap-1.5 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black">
          <i class="fa-solid fa-city"></i> <span data-i18n="tabMetro">都會生活圈</span>
        </button>
        <button id="typeIslandBtn" class="flex-1 py-1.5 text-xs font-bold rounded-xl transition text-center flex items-center justify-center gap-1.5 text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-umbrella-beach"></i> <span data-i18n="tabIsland">渡假海島專區</span>
        </button>

    function expandSearchKeywords(query) {

      const terms = [q];
      for (const [key, synonyms] of Object.entries(SEARCH_SYNONYMS)) {

          terms.push(key.toLowerCase(), ...synonyms.map(s => s.toLowerCase()));

      }
      return Array.from(new Set(terms));

    function getGrabLink(item, name, city) {

      let cleanQuery = (item.name_en || name || item.id || '').trim();

    function parseImages(item, fallback) {
      if (!item) return [fallback || CATEGORY_FALLBACK_IMAGES.default[0]];

      if (Array.isArray(item.images) && item.images.length > 0) {
        const valid = item.images.filter(s => typeof s === 'string' && s.startsWith('http'));
        if (valid.length > 0) return valid;
      }
      if (Array.isArray(item.photos) && item.photos.length > 0) {
        const valid = item.photos.filter(s => typeof s === 'string' && s.startsWith('http'));
        if (valid.length > 0) return valid;
      }

      const keys = ['images', 'image_url', 'imageurl', 'image', 'photo_url', 'photo', 'cover', 'thumbnail', 'col_14', 'col_7', 'img'];
      for (let k of keys) {
        const val = item[k];
        if (val) {
          if (Array.isArray(val)) {
            const list = val.filter(s => typeof s === 'string' && s.startsWith('http'));
            if (list.length > 0) return list;
          } else if (typeof val === 'string' && val.trim().length > 5) {
            const list = val.split(',')
              .map(s => s.trim())
              .filter(s => s.startsWith('http') && !s.includes('goo.gl/maps') && !s.includes('maps.app.goo.gl') && (!s.includes('maps.google.com') || s.includes('maps.googleapis.com')));
            if (list.length > 0) return list;
          }
        }
      }

      const cat = (safeStr(item.categoryKey) + ' ' + safeStr(item.category) + ' ' + safeStr(item.name)).toLowerCase();
      let pool = CATEGORY_FALLBACK_IMAGES.default;
      if (cat.includes('海鮮') || cat.includes('seafood') || cat.includes('crab') || cat.includes('lobster') || cat.includes('fish')) pool = CATEGORY_FALLBACK_IMAGES.seafood;
      else if (cat.includes('中餐') || cat.includes('chinese') || cat.includes('hotpot') || cat.includes('dim sum') || cat.includes('火鍋')) pool = CATEGORY_FALLBACK_IMAGES.chinese;
      else if (cat.includes('日料') || cat.includes('日式') || cat.includes('japan') || cat.includes('yaki') || cat.includes('sushi') || cat.includes('teppan') || cat.includes('tsumura')) pool = CATEGORY_FALLBACK_IMAGES.japanese;
      else if (cat.includes('西洋') || cat.includes('western') || cat.includes('steak') || cat.includes('排餐') || cat.includes('bistro')) pool = CATEGORY_FALLBACK_IMAGES.western;
      else if (cat.includes('菲') || cat.includes('filipino') || cat.includes('lechon')) pool = CATEGORY_FALLBACK_IMAGES.filipino;
      else if (cat.includes('夜生活') || cat.includes('nightlife') || cat.includes('club') || cat.includes('bar') || cat.includes('lounge')) pool = CATEGORY_FALLBACK_IMAGES.nightlife;
      else if (cat.includes('早午餐') || cat.includes('brunch') || cat.includes('咖啡') || cat.includes('cafe')) pool = CATEGORY_FALLBACK_IMAGES.brunch;

      const str = item.id || item.name || 'default';
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const chosenImg = pool[Math.abs(hash) % pool.length];

      return [fallback || chosenImg];
    }

    function makeScrollable(element) {
      if (!element) return;
      let isDown = false;
      let startX = 0;
      let scrollLeft = 0;

      element.addEventListener('mousedown', (e) => {
        isDown = true;
        element.classList.add('drag-scroll-active');
        startX = e.pageX - element.offsetLeft;
        scrollLeft = element.scrollLeft;
      });

      element.addEventListener('mouseleave', () => {
        isDown = false;
        element.classList.remove('drag-scroll-active');
      });

      element.addEventListener('mouseup', () => {
        isDown = false;
        element.classList.remove('drag-scroll-active');
      });

      element.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - element.offsetLeft;
        const walk = (x - startX) * 1.5;
        element.scrollLeft = scrollLeft - walk;
      });
    }

    function bindCarouselControls() {
      document.querySelectorAll('.carousel-track').forEach(track => {
        const id = track.id.replace('track-', '');
        const dotsContainer = document.getElementById(`dots-${id}`);
        const dots = dotsContainer ? dotsContainer.querySelectorAll('.dot-indicator') : [];
        
        track.addEventListener('scroll', () => {
          const slideWidth = track.offsetWidth;
          if (slideWidth === 0) return;
          const activeIndex = Math.round(track.scrollLeft / slideWidth);
          dots.forEach((dot, idx) => {
            dot.classList.toggle('active', idx === activeIndex);
          });
        }, { passive: true });

        makeScrollable(track);
      });
    }

    function enableHorizontalScroll() {
      ['regionPillsNav', 'subFilterContainer'].forEach(id => {
        const c = document.getElementById(id);
        if (!c) return;

        c.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) {
            e.preventDefault();
            c.scrollLeft += e.deltaY;
          }
        }, { passive: false });
      });
    }

    function isCityMatch(item, targetCity) {
      if (!item) return false;
      const c = safeStr(item.city);
      const a = safeStr(item.address);

      const foreignBlacklist = [
        'japan', 'tokyo', 'osaka', 'kyoto,', 'hokkaido', '日本',
        'usa', 'united states', 'california', 'new york', 'ny ', '10550',
        'singapore', 'australia', 'france', 'italy', 'spain', 'london', 'uk'
      ];
      if (foreignBlacklist.some(fk => a.includes(fk))) return false;

      if (!targetCity || targetCity === 'all') return true;

      if (targetCity === 'samal') {
        if (a.includes('cebu') || a.includes('manila') || a.includes('mactan') || (a.includes('davao city') && !a.includes('samal'))) return false;
        return c === 'samal';
      }

      if (targetCity === 'davao') {
        if (a.includes('palawan') || a.includes('el nido') || a.includes('samal')) return false;
        return c === 'davao';
      }

      if (targetCity === 'cebu') {
        if (a.includes('davao') || a.includes('manila') || a.includes('palawan')) return false;
        return c === 'cebu';
      }

      if (targetCity === 'manila') {
        if (a.includes('cebu') || a.includes('davao') || a.includes('palawan')) return false;
        return c === 'manila';
      }

      return c === targetCity;
    }

        const btn = document.getElementById(`tab-btn-${tab}`);
        if (tab === currentMainTab) {
          btn.className = 'main-tab-pill py-1.5 rounded-lg text-center transition flex items-center justify-center gap-1 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 shadow-sm font-black';
        } else {
          btn.className = 'main-tab-pill py-1.5 rounded-lg text-center transition flex items-center justify-center gap-1 text-slate-400 hover:text-white';
        }
      });

      const mapLabel = document.getElementById('tab-label-map');
      if (mapLabel) mapLabel.innerText = isIsland ? dict.navFoodIsland : dict.navFood;

      const newsLabel = document.getElementById('tab-label-news');
      if (newsLabel) newsLabel.innerText = isIsland ? dict.navNewsIsland : dict.navNews;

      if (currentMainTab === 'map') renderRestaurants();
      if (currentMainTab === 'attraction') renderAttractions();
      if (currentMainTab === 'medical') renderMedical();
      if (currentMainTab === 'news') renderNews();

      bindCarouselControls();
      bindCommentButtons();
    }

    // ==========================================================
    // 1. 美食卡片渲染 (站長嚴選優先 -> Google 評分排序 -> 評論數排序)
    // ⭐ 都會生活圈加入嚴格門檻清洗：非嚴選必須達到 4.5 分且評論數 >= 100
    // ==========================================================
    function renderRestaurants() {
      const listEl = document.getElementById('restaurant-list');
      document.getElementById('loading').style.display = 'none';
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const currentShortLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      let filtered = allRestaurants.filter(item => {
        const matchC = isCityMatch(item, currentCity);
        if (!matchC) return false;

        // ⭐ 都會區嚴格品質門檻清洗：非站長嚴選的都會餐廳，必須達到 4.5 分且評論數 >= 100
        if (!item.isCurated && !isIslandMode(item.city || currentCity)) {
          const r = parseFloat(String(item.googleRating ?? item.google_rating ?? item.rating ?? 0).replace(/[^\d.]/g, '')) || 0;
          const c = parseInt(String(item.googleReviewCount ?? item.google_reviews ?? item.review_count ?? item.reviews ?? 0).replace(/[^\d]/g, ''), 10) || 0;
          if (r < 4.5 || c < 100) return false;
        }

        if (currentSubFilter === 'all') return true;

        const cat = (safeStr(item.categoryKey) + ' ' + safeStr(item.category) + ' ' + safeStr(item.name) + ' ' + safeStr(item.name_zh) + ' ' + safeStr(item.name_en)).toLowerCase();

        if (currentSubFilter === 'seafood') {
          return cat.includes('海鮮') || cat.includes('seafood') || cat.includes('crab') || cat.includes('lobster') || 
                 cat.includes('fish') || cat.includes('shrimp') || cat.includes('prawn') || cat.includes('dampa') || 
                 cat.includes('fishermans') || cat.includes('huashan') || cat.includes('west empire') || cat.includes('pagkaing-dagat');
        }

        if (isIslandMode(currentCity)) {
          if (currentSubFilter === 'food') return item.islandType === 'food' || cat.includes('food') || cat.includes('seafood') || cat.includes('海鮮');
          if (currentSubFilter === 'nightlife') return item.islandType === 'nightlife' || item.categoryKey === 'nightlife';
          if (currentSubFilter === 'hotel_villa') return item.islandType === 'hotel_villa' || item.categoryKey === 'hotel_villa' || item.categoryKey === 'hotel' || item.categoryKey === 'villa';
          return true;
        } else {
          if (currentSubFilter === 'chinese') {
            return cat.includes('精緻中餐') || cat.includes('中餐') || cat.includes('chinese') || 
                   cat.includes('hotpot') || cat.includes('shabu') || cat.includes('dim sum') || 
                   cat.includes('火鍋') || cat.includes('粵菜') || cat.includes('川菜') || cat.includes('red house');
          }
          if (currentSubFilter === 'japanese') {
            return cat.includes('頂級日料') || cat.includes('日料') || cat.includes('日式') || 
                   cat.includes('japanese') || cat.includes('yaki') || cat.includes('sushi') || 
                   cat.includes('teppan') || cat.includes('omakase') || cat.includes('tsumura');
          }
          if (currentSubFilter === 'western') {
            return cat.includes('西洋美饌') || cat.includes('西洋') || cat.includes('western') || 
                   cat.includes('steak') || cat.includes('牛排') || cat.includes('排餐') || 
                   cat.includes('bistro') || cat.includes('italian') || cat.includes('french');
          }
          if (currentSubFilter === 'filipino') {
            return cat.includes('菲式御膳') || cat.includes('菲式') || cat.includes('菲餐') || 
                   cat.includes('filipino') || cat.includes('lechon') || cat.includes('crispy pata');
          }
          if (currentSubFilter === 'nightlife') {
            return cat.includes('夜生活') || cat.includes('club') || cat.includes('nightclub') || 
                   cat.includes('bar') || cat.includes('lounge') || cat.includes('rooftop') || 
                   cat.includes('speakeasy') || cat.includes('酒吧');
          }
          if (currentSubFilter === 'brunch') {
            return cat.includes('奢華早午餐') || cat.includes('早午餐') || cat.includes('brunch') || 
                   cat.includes('咖啡') || cat.includes('cafe') || cat.includes('bakery') || 
                   cat.includes('甜點') || cat.includes('下午茶');
          }
          return cat.includes(currentSubFilter.toLowerCase());
        }
      });

      if (currentSearchQuery) {
        const expandedTerms = expandSearchKeywords(currentSearchQuery);
        filtered = filtered.filter(item => {
          const corpus = (
            safeStr(item.name) + ' ' +
            safeStr(item.name_zh) + ' ' +
            safeStr(item.name_en) + ' ' +
            safeStr(item.address) + ' ' +
            safeStr(item.category) + ' ' +
            safeStr(item.categoryKey) + ' ' +
            safeStr(item.mustTry) + ' ' +
            safeStr(item.must_try) + ' ' +
            safeStr(item.curatedNote) + ' ' +
            safeStr(item.bigv_comment_zh) + ' ' +
            safeStr(item.desc) + ' ' +
            safeStr(item.description)
          ).toLowerCase();

          return expandedTerms.some(term => corpus.includes(term));
        });
      }

      filtered.sort((a, b) => {
        const aIsCurated = !!a.isCurated;
        const bIsCurated = !!b.isCurated;
        if (aIsCurated && !bIsCurated) return -1;
        if (!aIsCurated && bIsCurated) return 1;

        const ratingA = parseFloat(String(a.googleRating ?? a.google_rating ?? a.rating ?? 0).replace(/[^\d.]/g, '')) || 0;
        const ratingB = parseFloat(String(b.googleRating ?? b.google_rating ?? b.rating ?? 0).replace(/[^\d.]/g, '')) || 0;
        if (ratingB !== ratingA) return ratingB - ratingA;

        const reviewsA = parseInt(String(a.googleReviewCount ?? a.google_reviews ?? a.review_count ?? a.reviews ?? 0).replace(/[^\d]/g, ''), 10) || 0;
        const reviewsB = parseInt(String(b.googleReviewCount ?? b.google_reviews ?? b.review_count ?? b.reviews ?? 0).replace(/[^\d]/g, ''), 10) || 0;
        return reviewsB - reviewsA;
      });
      
      const curReg = [...REGION_CONFIG.cities, ...REGION_CONFIG.islands].find(r => r.id === currentCity);
      const cityName = dict['city_' + currentCity] || curReg?.name || '';
      filterSummaryText.textContent = `${cityName} · 頂級推薦`;
      itemCountBadge.textContent = `${filtered.length} ${dict.placesCountUnit}`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="bg-slate-950 rounded-2xl p-8 text-center border border-slate-800 shadow-xs mt-2"><h4 class="text-xs font-bold text-slate-400">${dict.noResult}</h4><p class="text-[11px] text-slate-600 mt-1">${dict.noResultSub}</p></div>`;
        return;
      }

      listEl.innerHTML = filtered.map((item, idx) => {
        const name = getLocalizedText(item, 'name', currentShortLang) || item.name || item.name_en || '頂級名店';
        const isCurated = !!item.isCurated;

        const rawRating = item.googleRating ?? item.google_rating ?? item.rating ?? 4.5;
        const rating = parseFloat(String(rawRating).replace(/[^\d.]/g, '')) || 4.5;

        const rawReviews = item.googleReviewCount ?? item.google_reviews ?? item.review_count ?? item.reviews ?? 50;
        const reviewCount = parseInt(String(rawReviews).replace(/[^\d]/g, ''), 10) || 0;

        const isIslandArea = isIslandMode(item.city || currentCity);
        const isGoogleTop = !isCurated && (
          isIslandArea 
            ? (rating >= 4.6 && reviewCount >= 50)
            : (rating >= 4.8 && reviewCount >= 100)
        );

        const curatedNote = getLocalizedText(item, 'bigv_comment', currentShortLang) || item.curatedNote || '';
        const mustTry = getLocalizedText(item, 'must_try', currentShortLang) || item.mustTry || '';

        let desc = getLocalizedText(item, 'desc', currentShortLang) || getText(item.description);
        if (!desc || desc.trim() === '') {
          if (isCurated && curatedNote) {
            desc = curatedNote;
          } else if (currentShortLang === 'en') {
            desc = `Top-rated hotspot in ${item.city || 'the Philippines'}! Rated ${rating.toFixed(1)} stars with over ${reviewCount}+ authentic diner reviews.`;
          } else if (currentShortLang === 'tl') {
            desc = `Tanyag na kainan sa ${item.city || 'Pilipinas'}! May markang ${rating.toFixed(1)} bituin mula sa higit ${reviewCount}+ na kumento.`;
          } else {
            desc = `在地超人氣推薦名店！Google 評分高達 ${rating.toFixed(1)} 星，累積逾 ${reviewCount}+ 則真實饕客好評推薦。`;
          }
        }

        const navUrl = item.nav_link || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name + ' ' + (item.address || '')));
        const targetWebUrl = (item.website && typeof item.website === 'string' && item.website.trim().startsWith('http')) ? item.website.trim() : navUrl;

        const titleHtml = `
          <a href="${targetWebUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 transition inline-flex items-center gap-1.5 group cursor-pointer max-w-full">
            <span class="truncate leading-tight">${name}</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-amber-400/80 group-hover:text-amber-300 transition flex-shrink-0"></i>
          </a>
        `;

        const grabLink = getGrabLink(item, item.name_en || name, item.city);
        const cleanPhone = getCleanPhone(item.phone);
        const isIsland = isIslandMode(item.city || currentCity);

        const rightTopActionBtn = !isIsland ? `
          <a href="${grabLink}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-[#00B14F]/15 hover:bg-[#00B14F]/25 text-[#00B14F] border border-[#00B14F]/40 font-bold transition active:scale-95 shadow-sm">
            <i class="fa-solid fa-bag-shopping text-xs"></i>
            <span class="text-[11px]">${dict.btnGrab}</span>

        ` : `
          <a href="${targetWebUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 font-bold transition active:scale-95 shadow-sm">
            <i class="fa-solid fa-globe text-xs"></i>
            <span class="text-[11px]">${dict.btnWebsite}</span>
          </a>
        `;

        if (isCurated) {
          return `
            <article class="rounded-2xl overflow-hidden border-2 border-amber-400 bg-slate-950 shadow-[0_0_25px_-3px_rgba(245,158,11,0.5)] flex flex-col transition-all duration-300">
              <div class="relative w-full overflow-hidden">
                ${buildCarouselHtml(item.images, `res-${idx}`, name)}
                
                <div class="absolute top-3 left-3 bg-amber-400 text-slate-950 text-[11px] font-black px-2.5 py-1 rounded-lg shadow-md flex items-center gap-1.5 z-20">
                  <i class="fa-solid fa-crown text-slate-950 text-xs"></i>
                  <span>${dict.badgeCurated}</span>
                </div>

                <div class="absolute bottom-2.5 left-3.5 right-3.5 pr-8 text-white text-sm sm:text-base font-bold tracking-wide drop-shadow-md z-20">
                  ${titleHtml}
                </div>
              </div>

              <div class="h-[2px] w-full bg-amber-400"></div>

              <div class="p-3.5 space-y-2.5 bg-slate-950">
                <div class="flex items-center justify-between text-xs">
                  <span class="px-2.5 py-1 rounded-md bg-amber-400/10 border border-amber-400/40 text-amber-300 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-location-dot text-[10px]"></i>
                    <span>${dict['city_' + item.city] || item.city} · 站長嚴選</span>
                  </span>

                  <div class="flex items-center gap-1 bg-amber-400 text-slate-950 font-black px-2.5 py-0.5 rounded-md shadow-sm">
                    <i class="fa-solid fa-star text-[10px]"></i>
                    <span>私房評分 ${item.vScore || '9.8'}</span>
                  </div>
                </div>

                ${mustTry ? `
                  <div class="flex items-center gap-1.5 text-xs text-amber-300/90 font-medium">
                    <span class="px-1.5 py-0.5 rounded bg-amber-400/20 text-amber-300 text-[10px] font-bold border border-amber-400/30">${dict.mustTryBadge}</span>
                    <span>${mustTry}</span>
                  </div>
                ` : ''}

                <div class="pl-2.5 border-l-2 border-amber-400">
                  <p class="text-xs text-slate-200 leading-relaxed font-normal">
                    ${curatedNote || desc}
                  </p>
                </div>
              </div>

              <div class="px-3.5 py-2 bg-slate-900/90 border-t border-slate-800/80 flex items-center justify-between text-xs">
                <div class="flex items-center gap-2">
                  <span class="w-4 h-4 rounded bg-white text-slate-900 font-bold flex items-center justify-center text-[9px]">G</span>
                  <span class="text-slate-400 text-[11px]">Google 大眾評分</span>
                </div>
                <div class="flex items-center gap-1 text-slate-300 font-bold">
                  <i class="fa-solid fa-star text-amber-400 text-[11px]"></i>
                  <span>${rating.toFixed(1)}</span>
                  <span class="text-slate-500 text-[10px] font-normal">(${reviewCount}則評價)</span>
                </div>
              </div>

              <div class="p-2.5 bg-slate-900 border-t border-slate-800 space-y-2 text-xs">
                <div class="grid grid-cols-2 gap-2">
                  <button data-comment-id="${item.id}" data-comment-name="${name}" class="btn-open-comment flex items-center justify-center gap-1.5 py-2 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black shadow-md shadow-amber-500/20 transition active:scale-95">
                    <i class="fa-solid fa-pen text-slate-950 text-xs"></i>
                    <span class="text-[11px]">${dict.btnComment}</span>
                  </button>
                  ${rightTopActionBtn}
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <a href="${cleanPhone ? `tel:${cleanPhone}` : '#'}" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 transition active:scale-95 ${!cleanPhone ? 'opacity-40 pointer-events-none' : ''}">
                    <i class="fa-solid fa-phone text-emerald-400 text-xs"></i>
                    <span class="font-medium text-[11px]">${cleanPhone ? dict.btnCall : dict.phoneEmpty}</span>
                  </a>
                  <a href="${navUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 transition active:scale-95">
                    <i class="fa-solid fa-diamond-turn-right text-sky-400 text-xs"></i>
                    <span class="font-bold text-[11px]">${dict.btnNav}</span>
                  </a>
                </div>
              </div>
            </article>
          `;
        }

        if (isGoogleTop) {
          return `
            <article class="rounded-2xl overflow-hidden border border-sky-400/60 bg-slate-950 shadow-[0_0_15px_-3px_rgba(56,189,248,0.25)] flex flex-col transition-all">
              <div class="relative w-full overflow-hidden">
                ${buildCarouselHtml(item.images, `res-${idx}`, name)}
                
                <div class="absolute top-3 left-3 bg-white text-slate-900 text-[11px] font-bold px-2.5 py-1 rounded-lg shadow-md flex items-center gap-1.5 border border-slate-200 z-20">
                  <i class="fa-brands fa-google text-blue-600 text-xs"></i>
                  <span>${dict.badgeGoogleTop}</span>
                </div>

                <div class="absolute bottom-2.5 left-3.5 right-3.5 pr-8 text-white text-sm sm:text-base font-bold tracking-wide drop-shadow-md z-20">
                  ${titleHtml}
                </div>
              </div>

              <div class="h-[1.5px] w-full bg-sky-500/40"></div>

              <div class="p-3.5 space-y-2 bg-slate-950">
                <div class="flex items-center justify-between text-xs">
                  <span class="px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 font-medium text-[11px] border border-slate-700">
                    ${dict['city_' + item.city] || item.city} · 口碑指標
                  </span>
                </div>

                <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">
                  ${desc}
                </p>
              </div>

              <div class="px-3.5 py-2 bg-slate-900/90 border-t border-slate-800/80 flex items-center justify-between text-xs">
                <div class="flex items-center gap-2">
                  <span class="w-4 h-4 rounded bg-white text-slate-900 font-bold flex items-center justify-center text-[9px]">G</span>
                  <span class="text-slate-400 text-[11px]">Google 大眾評分</span>
                </div>
                <div class="flex items-center gap-1 text-slate-300 font-bold">
                  <i class="fa-solid fa-star text-amber-400 text-[11px]"></i>
                  <span>${rating.toFixed(1)}</span>
                  <span class="text-slate-500 text-[10px] font-normal">(${reviewCount}則評價)</span>
                </div>
              </div>

              <div class="p-2.5 bg-slate-900 border-t border-slate-800 space-y-2 text-xs">
                <div class="grid grid-cols-2 gap-2">
                  <button data-comment-id="${item.id}" data-comment-name="${name}" class="btn-open-comment flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold transition active:scale-95">
                    <i class="fa-solid fa-pen text-amber-400 text-xs"></i>
                    <span class="text-[11px]">${dict.btnComment}</span>
                  </button>
                  ${rightTopActionBtn}
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <a href="${cleanPhone ? `tel:${cleanPhone}` : '#'}" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 transition active:scale-95 ${!cleanPhone ? 'opacity-40 pointer-events-none' : ''}">
                    <i class="fa-solid fa-phone text-emerald-400 text-xs"></i>
                    <span class="font-medium text-[11px]">${cleanPhone ? dict.btnCall : dict.phoneEmpty}</span>
                  </a>
                  <a href="${navUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 transition active:scale-95">
                    <i class="fa-solid fa-diamond-turn-right text-sky-400 text-xs"></i>
                    <span class="font-bold text-[11px]">${dict.btnNav}</span>
                  </a>

        return `

              <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-md border border-slate-700 z-20">
                ${dict.badgeCommunity}
              </div>

              <div class="absolute bottom-2.5 left-3.5 right-3.5 pr-8 text-white text-sm sm:text-base font-bold tracking-wide drop-shadow-md z-20">
                ${titleHtml}
              </div>

            <div class="h-[1px] w-full bg-slate-800"></div>

            <div class="p-3.5 space-y-2 bg-slate-950">
              <div class="flex items-center justify-between text-xs">
                <span class="px-2.5 py-1 rounded-md bg-slate-900 text-slate-400 font-medium text-[11px] border border-slate-800">
                  ${dict['city_' + item.city] || item.city}
                </span>
              </div>

              <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed">
                ${desc}
              </p>
            </div>

            <div class="px-3.5 py-2 bg-slate-900/90 border-t border-slate-800/80 flex items-center justify-between text-xs">
              <div class="flex items-center gap-2">
                <span class="w-4 h-4 rounded bg-white text-slate-900 font-bold flex items-center justify-center text-[9px]">G</span>
                <span class="text-slate-400 text-[11px]">Google 大眾評分</span>
              </div>
              <div class="flex items-center gap-1 text-slate-300 font-bold">
                <i class="fa-solid fa-star text-amber-400 text-[11px]"></i>
                <span>${rating.toFixed(1)}</span>
                <span class="text-slate-500 text-[10px] font-normal">(${reviewCount}則評價)</span>
              </div>
            </div>

            <div class="p-2.5 bg-slate-900 border-t border-slate-800 space-y-2 text-xs">
              <div class="grid grid-cols-2 gap-2">
                <button data-comment-id="${item.id}" data-comment-name="${name}" class="btn-open-comment flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition active:scale-95">
                  <i class="fa-solid fa-pen text-amber-400 text-xs"></i>
                  <span class="text-[11px]">${dict.btnComment}</span>
                </button>
                ${rightTopActionBtn}
              </div>
              <div class="grid grid-cols-2 gap-2">
                <a href="${cleanPhone ? `tel:${cleanPhone}` : '#'}" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition active:scale-95 ${!cleanPhone ? 'opacity-40 pointer-events-none' : ''}">
                  <i class="fa-solid fa-phone text-emerald-400 text-xs"></i>
                  <span class="font-medium text-[11px]">${cleanPhone ? dict.btnCall : dict.phoneEmpty}</span>
                </a>
                <a href="${navUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition active:scale-95">
                  <i class="fa-solid fa-diamond-turn-right text-sky-400 text-xs"></i>
                  <span class="font-bold text-[11px]">${dict.btnNav}</span>
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // ==========================================================
    // 2. 景點導覽渲染 (支援五星奢華飯店與娛樂城品牌自動去重融合)
    // ==========================================================
    function renderAttractions() {
      const listEl = document.getElementById('attraction-list');
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const currentShortLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      let filtered = allAttractions.filter(item => {
        if (!isCityMatch(item, currentCity)) return false;
        if (!currentSubFilter || currentSubFilter === 'all') return true;

        const itemType = safeStr(item.type);
        const itemCat = safeStr(item.category);
        const nameAll = (safeStr(item.name_zh) + ' ' + safeStr(item.name_en) + ' ' + safeStr(item.id)).toLowerCase();

        // ⭐ 賭場娛樂城與國際頂級五星奢華大飯店整併
        if (currentSubFilter === 'casino') {
          if (itemType === 'casino' || itemType === 'hotel') return true;
          const luxuryKeywords = ['賭場', 'casino', 'resort', 'hotel', '飯店', '酒店', 'nustar', 'solaire', 'okada', 'hyatt', 'peninsula', 'shangri-la', 'dusit', 'radisson', 'seda', 'conrad', 'sofitel'];
          return luxuryKeywords.some(k => itemCat.includes(k) || nameAll.includes(k));
        }

        if (currentSubFilter === 'shopping') {
          if (itemType === 'casino' && !nameAll.includes('the mall') && !nameAll.includes('mall at')) {
            return false;
          }
          return itemCat.includes('商場') || itemCat.includes('mall') || itemCat.includes('shopping') ||
                 nameAll.includes('mall') || nameAll.includes('ayala') || nameAll.includes('sm ') || nameAll.includes('robinsons');
        }

        if (currentSubFilter === 'history') {
          return itemCat.includes('歷史') || itemCat.includes('history') || itemCat.includes('教堂') || 
                 itemCat.includes('museum') || itemCat.includes('景點') || itemCat.includes('觀光') || 
                 itemCat.includes('park') || itemCat.includes('attraction') || itemCat.includes('ocean') || 
                 itemCat.includes('eagle') || itemCat.includes('art') || 
                 nameAll.includes('cathedral') || nameAll.includes('church') || nameAll.includes('museum') ||
                 nameAll.includes('mind museum') || nameAll.includes('art in island') || nameAll.includes('ocean park');
        }

      if (currentSearchQuery) {
        const expandedTerms = expandSearchKeywords(currentSearchQuery);
        filtered = filtered.filter(item => {
          const corpus = (
            safeStr(item.name_zh) + ' ' +
            safeStr(item.name_en) + ' ' +
            safeStr(item.address) + ' ' +
            safeStr(item.category) + ' ' +
            safeStr(item.desc_zh) + ' ' +
            safeStr(item.description)
          ).toLowerCase();

          return expandedTerms.some(term => corpus.includes(term));
        });
      }

      // ⭐ 娛樂城與飯店同體系品牌自動去重，避免同一實體展示兩次
      const seenBrands = new Set();
      filtered = filtered.filter(item => {
        const checkName = (item.name_zh || item.name_en || item.id || '').toLowerCase();
        for (const brand of ['nustar', 'solaire', 'okada', 'newport', 'city of dreams', 'dusit thani', 'peninsula', 'shangri-la']) {
          if (checkName.includes(brand)) {
            if (seenBrands.has(brand)) return false;
            seenBrands.add(brand);
          }
        }
        return true;
      });

      filtered.sort((a, b) => {
        const ratingA = Number(a.google_rating || a.googlerating || a.googleRating || a.rating || 0);
        const ratingB = Number(b.google_rating || b.googlerating || b.googleRating || b.rating || 0);
        if (ratingB !== ratingA) return ratingB - ratingA;

        const revA = Number(a.review_count || a.reviewcount || a.googleReviewCount || a.reviews || 0);
        const revB = Number(b.review_count || b.reviewcount || b.googleReviewCount || b.reviews || 0);
        return revB - revA;
      });

      filterSummaryText.textContent = `${dict['city_' + currentCity] || ''} · ${dict.navSpot}`;
      itemCountBadge.textContent = `${filtered.length} ${dict.spotsCountUnit}`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="bg-slate-950 rounded-2xl p-8 text-center border border-slate-800 shadow-xs mt-2"><h4 class="text-xs font-bold text-slate-400">${dict.noResult}</h4></div>`;
        return;
      }

      listEl.innerHTML = filtered.map((item, idx) => {
        const name = getLocalizedText(item, 'name', currentShortLang) || item.name_en || item.name_zh || item.id;
        const desc = getLocalizedText(item, 'desc', currentShortLang) || getText(item.description) || '在地指標推薦地標。';
        const smartLink = getSmartLink(item.name_en || name, item.city, item.website);
        const cleanPhone = getCleanPhone(item.phone);

        const rawRating = item.google_rating || item.googlerating || item.googleRating || item.rating || 4.5;
        const rating = Number(rawRating);
        const reviewCount = item.review_count || item.reviewcount || item.googleReviewCount || item.reviews || 50;

        const isIslandArea = isIslandMode(item.city || currentCity);
        const isGoogleTop = isIslandArea ? (rating >= 4.6 && reviewCount >= 50) : (rating >= 4.8 && reviewCount >= 100);

        const targetWebUrl = (item.website && typeof item.website === 'string' && item.website.trim().startsWith('http')) ? item.website.trim() : smartLink;

        const titleHtml = `
          <a href="${targetWebUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 transition inline-flex items-center gap-1.5 group cursor-pointer max-w-full">
            <span class="truncate leading-tight">${name}</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-amber-400/80 group-hover:text-amber-300 transition flex-shrink-0"></i>
          </a>
        `;

        return `
          <article class="rounded-2xl overflow-hidden ${
            isGoogleTop 
              ? 'border border-sky-400/60 shadow-[0_0_15px_-3px_rgba(56,189,248,0.25)]' 
              : 'border border-slate-800 shadow-sm'
          } bg-slate-950 flex flex-col transition-all">
            <div class="relative w-full overflow-hidden">
              ${buildCarouselHtml(item.images, `attr-${idx}`, name)}
              
              <div class="absolute top-3 left-3 z-20 flex items-center gap-1.5 flex-wrap">
                ${isGoogleTop ? `
                  <div class="bg-white text-slate-900 text-[11px] font-bold px-2.5 py-1 rounded-lg shadow-md flex items-center gap-1.5 border border-slate-200">
                    <i class="fa-brands fa-google text-blue-600 text-xs"></i>
                    <span>${dict.badgeGoogleTop}</span>
                  </div>
                ` : `
                  <div class="bg-slate-900/80 backdrop-blur-md text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-md border border-slate-700">
                    ${dict.badgeCommunity}
                  </div>
                `}
              </div>

              <div class="absolute bottom-2.5 left-3.5 right-3.5 pr-8 text-white text-sm sm:text-base font-bold tracking-wide drop-shadow-md z-20">
                ${titleHtml}
              </div>
            </div>

            <div class="h-[1.5px] w-full ${isGoogleTop ? 'bg-sky-500/40' : 'bg-slate-800'}"></div>

            <div class="p-3.5 space-y-2.5 bg-slate-950">
              <div class="flex items-center justify-between text-xs">
                <span class="px-2.5 py-1 rounded-md bg-slate-900 text-slate-300 font-medium text-[11px] border border-slate-800">
                  <i class="fa-solid fa-location-dot text-amber-400 text-[10px] mr-1"></i>${dict['city_' + item.city] || item.city} · ${item.category || '景點'}
                </span>
              </div>

              <p class="text-xs text-slate-400 line-clamp-2 leading-relaxed font-normal">
                ${desc}
              </p>
            </div>

            <div class="px-3.5 py-2 bg-slate-900/90 border-t border-slate-800/80 flex items-center justify-between text-xs">
              <div class="flex items-center gap-2">
                <span class="w-4 h-4 rounded bg-white text-slate-900 font-bold flex items-center justify-center text-[9px]">G</span>
                <span class="text-slate-400 text-[11px]">Google 大眾評分</span>
              </div>
              <div class="flex items-center gap-1 text-slate-300 font-bold">
                <i class="fa-solid fa-star text-amber-400 text-[11px]"></i>
                <span>${rating.toFixed(1)}</span>
                <span class="text-slate-500 text-[10px] font-normal">(${reviewCount}則評價)</span>
              </div>
            </div>

            <div class="p-2.5 bg-slate-900 border-t border-slate-800 space-y-2 text-xs">
              <div class="grid grid-cols-2 gap-2">
                <button data-comment-id="${item.id}" data-comment-name="${name}" class="btn-open-comment flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold transition active:scale-95">
                  <i class="fa-solid fa-pen text-amber-400 text-xs"></i>
                  <span class="text-[11px]">${dict.btnComment}</span>
                </button>
                <a href="${targetWebUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 font-bold transition active:scale-95 shadow-sm">
                  <i class="fa-solid fa-globe text-xs"></i>
                  <span class="text-[11px]">${dict.btnWebsite}</span>
                </a>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <a href="${cleanPhone ? `tel:${cleanPhone}` : '#'}" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 transition active:scale-95 ${!cleanPhone ? 'opacity-40 pointer-events-none' : ''}">
                  <i class="fa-solid fa-phone text-emerald-400 text-xs"></i>
                  <span class="font-medium text-[11px]">${cleanPhone ? dict.btnCall : dict.phoneEmpty}</span>
                </a>
                <a href="${item.nav_link || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name + ' ' + (item.address || '')))}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 transition active:scale-95">
                  <i class="fa-solid fa-diamond-turn-right text-sky-400 text-xs"></i>
                  <span class="font-bold text-[11px]">${dict.btnNav}</span>
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // ==========================================================
    // 3. 醫療藥局渲染
    // ==========================================================
    function renderMedical() {
      const listEl = document.getElementById('medical-list');
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const currentShortLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      let filtered = allMedical.filter(item => {
        if (!isCityMatch(item, currentCity)) return false;

        const allText = `${safeStr(item.category)} ${safeStr(item.type)} ${safeStr(item.name_zh)} ${safeStr(item.name_en)}`.toLowerCase();

        const noiseWords = ['divers', 'diving', 'dive', 'tour', 'paradise', 'travel', 'resort', 'expedition', 'adventure', 'island hopping'];
        if (noiseWords.some(w => allText.includes(w))) return false;

        const isHospital = allText.includes('hospital') || allText.includes('綜合醫院') || allText.includes('醫院') || allText.includes('infirmary') || allText.includes('medical center');
        const isPharmacy = allText.includes('pharmacy') || allText.includes('連鎖藥局') || allText.includes('藥局') || allText.includes('mercury') || allText.includes('watsons') || allText.includes('drug');
        const isClinic = !isHospital && !isPharmacy && (
          allText.includes('clinic') || allText.includes('專科診所') || allText.includes('診所') || allText.includes('doctor') || allText.includes('health center')
        );

        if (!isHospital && !isClinic && !isPharmacy) return false;

        if (!currentSubFilter || currentSubFilter === 'all') return true;
        if (currentSubFilter === 'hospital') return isHospital;
        if (currentSubFilter === 'clinic') return isClinic;
        if (currentSubFilter === 'pharmacy') return isPharmacy;

        return true;
      });

      if (currentSearchQuery) {
        const expandedTerms = expandSearchKeywords(currentSearchQuery);
        filtered = filtered.filter(item => {
          const corpus = (
            safeStr(item.name) + ' ' +
            safeStr(item.name_zh) + ' ' +
            safeStr(item.name_en) + ' ' +
            safeStr(item.address) + ' ' +
            safeStr(item.category) + ' ' +
            safeStr(item.type) + ' ' +
            safeStr(item.desc_zh) + ' ' +
            safeStr(item.description)
          ).toLowerCase();

          return expandedTerms.some(term => corpus.includes(term));
        });
      }

      filtered.sort((a, b) => {
        const checkIsTopMedical = (item) => {
          const isIsland = isIslandMode(item.city || currentCity);
          const rawR = item.google_rating ?? item.googleRating ?? item.googlerating ?? item.rating ?? 0;
          const r = parseFloat(String(rawR).replace(/[^\d.]/g, '')) || 0;
          const rawC = item.review_count ?? item.reviewcount ?? item.google_reviews ?? item.reviews ?? 0;
          const c = parseInt(String(rawC).replace(/[^\d]/g, ''), 10) || 0;
          return isIsland ? (r >= 4.6 && c >= 50) : (r >= 4.8 && c >= 100);
        };

        const aIsTop = checkIsTopMedical(a);
        const bIsTop = checkIsTopMedical(b);

        if (aIsTop && !bIsTop) return -1;
        if (!aIsTop && bIsTop) return 1;

        const ratingA = parseFloat(String(a.google_rating ?? a.googleRating ?? a.googlerating ?? a.rating ?? 0).replace(/[^\d.]/g, '')) || 0;
        const ratingB = parseFloat(String(b.google_rating ?? b.googleRating ?? b.googlerating ?? b.rating ?? 0).replace(/[^\d.]/g, '')) || 0;
        if (ratingB !== ratingA) return ratingB - ratingA;

        const revA = parseInt(String(a.review_count ?? a.reviewcount ?? a.google_reviews ?? a.reviews ?? 0).replace(/[^\d]/g, ''), 10) || 0;
        const revB = parseInt(String(b.review_count ?? b.reviewcount ?? b.google_reviews ?? b.reviews ?? 0).replace(/[^\d]/g, ''), 10) || 0;
        return revB - revA;
      });
      
      filterSummaryText.textContent = `${dict['city_' + currentCity] || ''} · ${dict.navMedical}`;
      itemCountBadge.textContent = `${filtered.length} ${dict.medicalCountUnit}`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="bg-slate-950 rounded-2xl p-8 text-center border border-slate-800 shadow-xs mt-2"><h4 class="text-xs font-bold text-slate-400">該區域醫療與藥局資料更新中</h4></div>`;
        return;
      }

      listEl.innerHTML = filtered.map((item, idx) => {
        const name = getLocalizedText(item, 'name', currentShortLang) || item.name_en || item.name_zh || '醫療急救機構';
        const smartLink = getSmartLink(item.name_en || name, item.city, item.website);
        const rawPhone = item.phone || item.telephone || item.contact || '';
        const cleanPhone = getCleanPhone(rawPhone);

        const rawRating = item.google_rating ?? item.googleRating ?? item.googlerating ?? item.rating ?? 4.5;
        const numRating = parseFloat(String(rawRating).replace(/[^\d.]/g, ''));
        const rating = isNaN(numRating) ? 4.5 : numRating;

        const rawReviews = item.review_count ?? item.reviewcount ?? item.google_reviews ?? item.reviews ?? 50;
        const reviewCount = parseInt(String(rawReviews).replace(/[^\d]/g, ''), 10) || 0;
        
        let catBadge = '🏥 醫療機構';
        const catAll = `${(item.category || '')} ${(item.type || '')} ${(item.name_en || '')}`.toLowerCase();
        if (catAll.includes('hospital') || catAll.includes('medical center') || catAll.includes('infirmary')) {
          catBadge = '🏥 綜合醫院 (24H)';
        } else if (catAll.includes('clinic') || catAll.includes('doctor') || catAll.includes('health')) {
          catBadge = '🩺 專科診所';
        } else if (catAll.includes('pharmacy') || catAll.includes('drug') || catAll.includes('mercury') || catAll.includes('watsons')) {
          catBadge = '💊 連鎖藥局';
        }

        const isIslandArea = isIslandMode(item.city || currentCity);
        const isGoogleTopMedical = isIslandArea ? (rating >= 4.6 && reviewCount >= 50) : (rating >= 4.8 && reviewCount >= 100);

        const targetWebUrl = (item.website && typeof item.website === 'string' && item.website.trim().startsWith('http')) ? item.website.trim() : smartLink;

        const titleHtml = `
          <a href="${targetWebUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 transition inline-flex items-center gap-1.5 group cursor-pointer max-w-full">
            <span class="truncate leading-tight">${name}</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-amber-400/80 group-hover:text-amber-300 transition flex-shrink-0"></i>
          </a>
        `;

        return `
          <article class="rounded-2xl overflow-hidden ${
            isGoogleTopMedical 
              ? 'border border-sky-400/60 shadow-[0_0_15px_-3px_rgba(56,189,248,0.25)]' 
              : 'border border-slate-800 shadow-sm'
          } bg-slate-950 flex flex-col transition-all">
            <div class="relative w-full overflow-hidden">
              ${buildCarouselHtml(item.images, `med-${idx}`, name)}
              
              <div class="absolute top-3 left-3 z-20 flex items-center gap-1.5 flex-wrap">
                <span class="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg shadow-md">${catBadge}</span>
                ${isGoogleTopMedical ? `
                  <div class="bg-white text-slate-900 text-[11px] font-bold px-2.5 py-1 rounded-lg shadow-md flex items-center gap-1.5 border border-slate-200">
                    <i class="fa-brands fa-google text-blue-600 text-xs"></i>
                    <span>${dict.badgeGoogleTop}</span>
                  </div>
                ` : ''}
              </div>

              <div class="absolute bottom-2.5 left-3.5 right-3.5 pr-8 text-white text-sm sm:text-base font-bold tracking-wide drop-shadow-md z-20">
                ${titleHtml}

            <div class="h-[1.5px] w-full ${isGoogleTopMedical ? 'bg-sky-500/40' : 'bg-slate-800'}"></div>

            <div class="p-3.5 space-y-2 bg-slate-950">

            <div class="px-3.5 py-2 bg-slate-900/90 border-t border-slate-800/80 flex items-center justify-between text-xs">

                <span class="text-slate-400 text-[11px]">Google 大眾評分</span>

            <div class="p-2.5 bg-slate-900 border-t border-slate-800 space-y-2 text-xs">
              <div class="grid grid-cols-2 gap-2">

    async function loadComments(targetId) {
      const container = document.getElementById('comment-list-container');
      container.innerHTML = '<p class="text-center text-slate-500 py-6 text-xs"><i class="fa-solid fa-spinner fa-spin text-amber-400 mr-1.5"></i>載入最新訪客評論中...</p>';

      try {
        const cleanId = String(targetId).trim().toLowerCase();
        const q = query(collection(db, "comments"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);

        const matchedDocs = snap.docs.filter(d => {
          const c = d.data();
          return String(c.targetId || '').trim().toLowerCase() === cleanId || 
                 String(c.storeId || '').trim().toLowerCase() === cleanId;
        });

        if (matchedDocs.length === 0) {
          container.innerHTML = `
            <div class="text-center py-8 text-slate-500">
              <i class="fa-regular fa-comment-dots text-2xl mb-1.5 block text-slate-600"></i>
              目前尚無探店評語，快來搶頭香發表第一則心得！
            </div>
          `;
          return;
        }

        container.innerHTML = matchedDocs.map(d => {
          const c = d.data();
          const timeStr = c.createdAt ? new Date(c.createdAt.seconds ? c.createdAt.seconds * 1000 : c.createdAt).toLocaleDateString() : '近期';
          return `
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-1.5 shadow-xs">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">

                  <span class="font-bold text-slate-200 text-xs">${c.userName || '吃貨好友'}</span>
                </div>
                <span class="text-[10px] text-slate-500 font-medium">${timeStr}</span>
              </div>
              <p class="text-slate-300 text-xs leading-relaxed pl-7">${c.comment || c.content || ''}</p>
            </div>
          `;
        }).join('');
      } catch (e) {
        container.innerHTML = '<p class="text-center text-slate-500 py-6 text-xs">歡迎登入後發表第一則評語！</p>';

        toggleBtn.setAttribute('aria-checked', 'true');
      } else {
        toggleBtn.className = "relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-slate-800 transition-colors duration-200 ease-in-out focus:outline-none";
        toggleThumb.className = "pointer-events-none inline-block h-5 w-5 transform rounded-full bg-slate-400 shadow ring-0 transition duration-200 ease-in-out translate-x-0";

    const ThemeManager = {
      THEME_KEY: 'bigv_app_theme',
      init() {
        const savedTheme = localStorage.getItem(this.THEME_KEY) || 'dark';
        this.apply(savedTheme, false);

        const btn = document.getElementById('btn-toggle-theme');
        if (btn) {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isDark = document.documentElement.classList.contains('dark') || !document.documentElement.classList.contains('light');
            const nextTheme = isDark ? 'light' : 'dark';
            this.apply(nextTheme, true);
          });
        }
      },
      apply(theme, save = true) {
        const root = document.documentElement;
        const icon = document.getElementById('theme-icon');
        const iconContainer = document.getElementById('theme-icon-container');
        const desc = document.getElementById('theme-status-desc');
        const btnText = document.getElementById('theme-btn-text');

        if (theme === 'light') {
          root.classList.remove('dark');
          root.classList.add('light');
          if (icon) icon.className = 'fa-solid fa-sun text-xs text-orange-500';
          if (iconContainer) iconContainer.className = 'w-7 h-7 rounded-xl flex items-center justify-center bg-orange-100 border border-orange-300 text-orange-500 text-xs';
          if (desc) desc.textContent = '當前：暖陽金橘';
          if (btnText) btnText.textContent = '切換暗夜';
          if (save) localStorage.setItem(this.THEME_KEY, 'light');
        } else {
          root.classList.remove('light');
          root.classList.add('dark');
          if (icon) icon.className = 'fa-solid fa-moon text-xs text-amber-400';
          if (iconContainer) iconContainer.className = 'w-7 h-7 rounded-xl flex items-center justify-center bg-amber-400/10 border border-amber-400/30 text-amber-400 text-xs';
          if (desc) desc.textContent = '當前：暗夜尊爵';
          if (btnText) btnText.textContent = '切換暖陽';
          if (save) localStorage.setItem(this.THEME_KEY, 'dark');
        }
      }
    };

    });

    initAuthService();

    // ⭐ 最純粹安靜背景更新：零彈窗打擾、零突發 Reload，幕後靜默下載，下次重開或手動下拉即生效
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update().catch(() => {});

          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            if (!installingWorker) return;

            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                if (installingWorker.waiting) {
                  installingWorker.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
              }
            };
          };
        }).catch((err) => console.warn('[SW] 註冊異常:', err));
      });
    }
  </script>
</body>
