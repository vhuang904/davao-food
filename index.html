    // 解析支援多張照片陣列（支援逗號隔開）
    function parseImages(item, fallback) {
      if (!item) return [fallback];
      const keys = ['image_url', 'imageurl', 'image', 'photo', 'col_14', 'col_7'];
      for (let k of keys) {
        const val = item[k];
        if (val && typeof val === 'string') {
          const list = val.split(',')
            .map(s => s.trim())
            .filter(s => s.startsWith('http') && !s.includes('maps.google') && !s.includes('goo.gl/maps'));
          if (list.length > 0) return list;
        }
      }
      return [fallback || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop'];
    }

    // 全站多圖輪播相簿產生器 (支援原生滑動、吸附與圓點聯動)
    function buildCarouselHtml(images, uniqueId, altTitle) {
      if (!images || images.length === 0) {
        images = ["https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&auto=format&fit=crop"];
      }

      const hasMultiple = images.length > 1;

      return `
        <div class="relative h-48 w-full bg-slate-100 overflow-hidden">
          <div id="track-${uniqueId}" class="carousel-track flex w-full h-full overflow-x-auto hide-scrollbar">
            ${images.map(img => `
              <div class="carousel-slide flex-shrink-0 w-full h-full">
                <img 
                  src="${img}" 
                  alt="${altTitle}" 
                  class="w-full h-full object-cover" 
                  loading="lazy"
                  onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&auto=format&fit=crop';" 
                />
              </div>
            `).join('')}
          </div>
          ${hasMultiple ? `
            <span class="absolute top-2.5 right-2.5 bg-neutral-900/60 text-white text-[10px] px-2 py-0.5 rounded-full backdrop-blur-xs pointer-events-none z-10">👈 左右滑動</span>
            <div id="dots-${uniqueId}" class="absolute bottom-2.5 right-2.5 flex items-center gap-1 z-10 bg-black/40 backdrop-blur-xs px-2 py-1 rounded-full">
              ${images.map((_, i) => `<span class="dot-indicator inline-block w-1.5 h-1.5 rounded-full bg-white/40 transition-all ${i === 0 ? 'active' : ''}"></span>`).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    // 核心資料擷取與聚合整合 (四大分頁真值對齊 + Auto_Discovered 路由)
    async function fetchData() {
      try {
        let sheetMaster = { bigVPicks: [], attractions: [], promotions: [], autoDiscovered: [] };
        try {
          sheetMaster = await loadMasterDatabase();
        } catch (e) {
          console.warn("讀取 Google Sheet 失敗:", e);
        }

        const resSnap = await getDocs(collection(db, "restaurants")).catch(() => ({ forEach: () => {} }));
        const rawList = [];
        resSnap.forEach(d => rawList.push({ id: d.id, ...d.data() }));

        const mergedMap = new Map();
        const bigVLookup = new Map();

        // 1. 建立 BigV 私房嚴選索引 Map
        (sheetMaster.bigVPicks || []).forEach(v => {
          if (v.id) bigVLookup.set(v.id.toLowerCase().trim(), v);
        });

        // 2. 處理 Firebase 資料並與 BigV 私房嚴選去重對齊
        rawList.forEach(item => {
          const nameAll = (safeStr(item.name) + ' ' + safeStr(item.name_en) + ' ' + safeStr(item.id)).toLowerCase();
          let key = item.id;

          let matchedBigV = null;
          for (let [bId, bItem] of bigVLookup.entries()) {
            const cityMatch = !bItem.city || (item.city && item.city.toLowerCase().trim() === bItem.city.toLowerCase().trim());
            if (key.toLowerCase().trim() === bId || (cityMatch && bItem.name && nameAll.includes(bItem.name.toLowerCase().trim()))) {
              matchedBigV = bItem;
              break;
            }
          }

          if (matchedBigV) {
            key = matchedBigV.id;
            item.id = matchedBigV.id;
            item.name = matchedBigV.name;
            item.name_zh = matchedBigV.name_zh || matchedBigV.name;
            item.name_en = matchedBigV.name_en || item.name_en;
            item.name_tl = matchedBigV.name_tl;
            item.isCurated = true;
            item.curatedBadge = "👑 站長私房嚴選";
            item.curatedNote = matchedBigV.big_v_comment || matchedBigV.bigv_comment_zh || "站長每週必訪私房推薦！";
            item.bigv_comment_zh = matchedBigV.bigv_comment_zh || matchedBigV.big_v_comment;
            item.bigv_comment_en = matchedBigV.bigv_comment_en;
            item.bigv_comment_tl = matchedBigV.bigv_comment_tl;
            item.mustTry = matchedBigV.must_try || matchedBigV.must_try_zh || "";
            item.must_try_zh = matchedBigV.must_try_zh || matchedBigV.must_try;
            item.must_try_en = matchedBigV.must_try_en;
            item.must_try_tl = matchedBigV.must_try_tl;
            item.city = matchedBigV.city;
            if (matchedBigV.address) item.address = matchedBigV.address;
            if (matchedBigV.phone) item.phone = String(matchedBigV.phone).replace(/^['"]/, '').trim();
            if (matchedBigV.nav_link) item.nav_link = matchedBigV.nav_link;
            item.images = parseImages(matchedBigV, 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&auto=format&fit=crop');
            bigVLookup.delete(matchedBigV.id.toLowerCase().trim());
          } else {
            item.isCurated = false;
            delete item.curatedBadge;
            delete item.curatedNote;
            delete item.mustTry;
          }

          if (nameAll.includes('pearl farm') || nameAll.includes('chema')) {
            item.city = 'samal';
            item.islandType = 'hotel_villa';
          }

          if (!item.images || item.images.length === 0) {
            item.images = ["https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&auto=format&fit=crop"];
          }

          if (mergedMap.has(key)) {
            const existing = mergedMap.get(key);
            if ((!existing.images || existing.images.length === 0) && (item.images && item.images.length > 0)) {
              mergedMap.set(key, { ...existing, images: item.images });
            }
          } else {
            mergedMap.set(key, item);
          }
        });

        // 3. 注入 Google Sheet 剩餘的站長私房清單 (BigV_Picks 17 欄對齊)
        bigVLookup.forEach(bigVItem => {
          mergedMap.set(bigVItem.id, {
            id: bigVItem.id,
            name: bigVItem.name_zh || bigVItem.name,
            name_zh: bigVItem.name_zh || bigVItem.name,
            name_en: bigVItem.name_en || '',
            name_tl: bigVItem.name_tl || '',
            category: bigVItem.category || '',
            city: bigVItem.city,
            isCurated: true,
            curatedBadge: "👑 站長私房嚴選",
            curatedNote: bigVItem.big_v_comment || bigVItem.bigv_comment_zh || '',
            bigv_comment_zh: bigVItem.bigv_comment_zh || bigVItem.big_v_comment,
            bigv_comment_en: bigVItem.bigv_comment_en,
            bigv_comment_tl: bigVItem.bigv_comment_tl,
            mustTry: bigVItem.must_try || bigVItem.must_try_zh || '',
            must_try_zh: bigVItem.must_try_zh || bigVItem.must_try,
            must_try_en: bigVItem.must_try_en,
            must_try_tl: bigVItem.must_try_tl,
            address: bigVItem.address || "",
            phone: String(bigVItem.phone || "").replace(/^['"]/, '').trim(),
            nav_link: bigVItem.nav_link || "",
            googleRating: 5.0,
            googleReviewCount: 50,
            images: parseImages(bigVItem, 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&auto=format&fit=crop')
          });
        });

        // 4. 【核心整合】第 4 分頁 Auto_Discovered 資料流 (13 欄精準映射與分流)
        const autoAttractions = [];
        (sheetMaster.autoDiscovered || []).forEach(autoItem => {
          if (!autoItem.id) return;
          const autoKey = autoItem.id.toLowerCase().trim();
          const itemType = (autoItem.type || 'restaurant').toLowerCase().trim();
          const categoryStr = (autoItem.category || '').toLowerCase();

          if (itemType === 'attraction' || itemType === 'spot') {
            autoAttractions.push({
              id: autoItem.id,
              city: autoItem.city,
              category: autoItem.category || '',
              name_zh: autoItem.name_zh || autoItem.name_en || autoItem.id,
              name_en: autoItem.name_en || '',
              name_tl: autoItem.name_tl || '',
              desc_zh: `【Google探索指標】評分 ${autoItem.googleRating || 4.5} 星 (累積 ${autoItem.googleReviewCount || 50}+ 則在地評論)`,
              desc_en: `Google Pick: Rated ${autoItem.googleRating || 4.5} stars (${autoItem.googleReviewCount || 50}+ reviews)`,
              desc_tl: `Google Pick: May markang ${autoItem.googleRating || 4.5} bituin`,
              address: autoItem.address || '',
              phone: String(autoItem.phone || "").replace(/^['"]/, '').trim(),
              nav_link: autoItem.nav_link || '',
              images: parseImages(autoItem, 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop')
            });
          } else {
            if (!mergedMap.has(autoKey)) {
              const r = autoItem.googleRating || 4.5;
              const c = autoItem.googleReviewCount || 50;
              const isResort = categoryStr.includes('hotel') || categoryStr.includes('resort') || categoryStr.includes('villa');

              mergedMap.set(autoKey, {
                id: autoItem.id,
                name: autoItem.name_zh || autoItem.name_en || autoItem.id,
                name_zh: autoItem.name_zh || '',
                name_en: autoItem.name_en || '',
                name_tl: autoItem.name_tl || '',
                category: autoItem.category || '',
                categoryKey: categoryStr,
                city: autoItem.city,
                islandType: isResort ? 'hotel_villa' : 'food',
                isCurated: false,
                isGoogleTop: r >= 4.6 && c >= 100,
                googleTopNote: `Google 饕客探索推薦：累積逾 ${c} 則好評，在地極高評分熱點！`,
                address: autoItem.address || '',
                phone: String(autoItem.phone || "").replace(/^['"]/, '').trim(),
                nav_link: autoItem.nav_link || '',
                googleRating: r,
                googleReviewCount: c,
                images: parseImages(autoItem, 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&auto=format&fit=crop')
              });
            }
          }
        });

        // 5. 餐廳列表權重排序 (站長私房 > Google Top > 評分高低)
        allRestaurants = Array.from(mergedMap.values())
          .map(item => {
            const r = item.googleRating || 0;
            const c = item.googleReviewCount || 0;
            if (!item.isCurated && r >= 4.6 && c >= 100) {
              item.isGoogleTop = true;
              if (!item.googleTopNote) {
                item.googleTopNote = `Google 饕客高頻推薦：累積逾 ${c} 則好評，在地極高人氣指標！`;
              }
            } else if (!item.isCurated) {
              item.isGoogleTop = false;
            }
            return item;
          })
          .sort((a, b) => {
            if (a.isCurated && !b.isCurated) return -1;
            if (!a.isCurated && b.isCurated) return 1;
            if (a.isGoogleTop && !b.isGoogleTop) return -1;
            if (!a.isGoogleTop && b.isGoogleTop) return 1;
            return (b.googleRating || 0) - (a.googleRating || 0);
          });

        // 6. Attractions: 直接接收正規化後的資料（徹底移除型別破壞錯誤，保證景點順暢進來）
        const sheetAttractions = (sheetMaster.attractions || []).map(att => ({
          ...att,
          images: parseImages(att, 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop')
        }));
        allAttractions = [...sheetAttractions, ...autoAttractions];

        // 7. Promotions: 直接接收正規化後的資料（徹底移除型別破壞錯誤，保證特惠順暢進來）
        allNews = (sheetMaster.promotions || []).map(promo => ({
          ...promo,
          images: parseImages(promo, 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&auto=format&fit=crop')
        }));

      } catch (err) {
        console.error("載入失敗:", err);
      }

      updateUiLanguage();
    }

    function isCityMatch(item, targetCity) {
      if (!item || !targetCity || targetCity === 'all') return true;
      const c = safeStr(item.city);
      const a = safeStr(item.address);
      if (targetCity === 'samal') return c === 'samal' || a.includes('samal');
      if (targetCity === 'davao') return (c === 'davao' || a.includes('davao')) && !c.includes('samal') && !a.includes('samal');
      if (targetCity === 'manila') return c === 'manila' || a.includes('manila') || a.includes('makati') || a.includes('taguig') || a.includes('pasay') || a.includes('bgc');
      return c === targetCity || a.includes(targetCity);
    }

    const typeCityBtn = document.getElementById('typeCityBtn');
    const typeIslandBtn = document.getElementById('typeIslandBtn');
    const regionPillsNav = document.getElementById('regionPillsNav');
    const subFilterContainer = document.getElementById('subFilterContainer');
    const filterSummaryText = document.getElementById('filterSummaryText');
    const itemCountBadge = document.getElementById('itemCountBadge');

    function renderRegionPills() {
      const isCity = currentDimension === 'cities';
      typeCityBtn.className = `flex-1 py-1.5 text-xs font-bold rounded-xl transition text-center shadow-sm flex items-center justify-center gap-1.5 ${
        isCity ? 'bg-white text-orange-700' : 'bg-orange-700/60 text-amber-100 hover:bg-orange-700'
      }`;
      typeIslandBtn.className = `flex-1 py-1.5 text-xs font-bold rounded-xl transition text-center shadow-sm flex items-center justify-center gap-1.5 ${
        !isCity ? 'bg-white text-orange-700' : 'bg-orange-700/60 text-amber-100 hover:bg-orange-700'
      }`;

      const list = isCity ? REGION_CONFIG.cities : REGION_CONFIG.islands;
      if (!list.some(r => r.id === currentCity)) {
        currentCity = list[0].id;
        localStorage.setItem('ph_app_city', currentCity);
      }

      regionPillsNav.innerHTML = list.map(r => {
        const active = r.id === currentCity;
        const cityName = (typeof I18N_DICT !== 'undefined' && I18N_DICT[currentLang] && I18N_DICT[currentLang]['city_' + r.id]) 
          ? I18N_DICT[currentLang]['city_' + r.id] 
          : (r.name_en && currentLang === 'en' ? r.name_en : r.name);
        return `
          <button data-city="${r.id}" class="region-pill px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all duration-200 select-none ${
            active ? 'bg-slate-900 text-white shadow-md scale-105' : 'bg-orange-800/40 text-amber-100 hover:bg-orange-800/80'
          }">
            ${cityName}
          </button>
        `;
      }).join('');

      document.querySelectorAll('.region-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCity = btn.getAttribute('data-city');
          currentSubFilter = 'all';
          sessionStorage.setItem('ph_nav_sub', 'all');
          localStorage.setItem('ph_app_city', currentCity);
          renderRegionPills();
          renderSubFilterBar();
          renderContent();
        });
      });
    }

    function renderSubFilterBar() {
      let filterList = [];
      const isIsland = isIslandMode(currentCity);

      if (currentMainTab === 'map') {
        filterList = isIsland ? SUB_FILTERS.food_island : SUB_FILTERS.food_urban;
      } else if (currentMainTab === 'attraction') {
        filterList = isIsland ? SUB_FILTERS.attraction_island : SUB_FILTERS.attraction_urban;
      } else {
        filterList = SUB_FILTERS.news;
      }

      if (!filterList.some(f => f.key === currentSubFilter)) {
        currentSubFilter = 'all';
        sessionStorage.setItem('ph_nav_sub', 'all');
      }

      subFilterContainer.innerHTML = filterList.map(f => {
        const active = f.key === currentSubFilter;
        let label = (typeof f.label === 'object') ? (f.label[currentLang] || f.label['zh-TW']) : f.label;
        return `
          <button data-subkey="${f.key}" class="sub-pill px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition select-none ${
            active ? 'bg-orange-500 text-white shadow-xs font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }">
            ${label}
          </button>
        `;
      }).join('');

      document.querySelectorAll('.sub-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          currentSubFilter = btn.getAttribute('data-subkey');
          sessionStorage.setItem('ph_nav_sub', currentSubFilter);
          renderSubFilterBar();
          renderContent();
        });
      });
    }

    function renderContent() {
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const isIsland = isIslandMode(currentCity);

      ['map', 'attraction', 'news'].forEach(tab => {
        document.getElementById(`section-${tab}`).classList.toggle('hidden', tab !== currentMainTab);
        const btn = document.getElementById(`tab-btn-${tab}`);
        if (tab === currentMainTab) {
          btn.className = 'main-tab-pill py-1.5 rounded-lg text-center transition flex items-center justify-center gap-1 bg-white text-orange-600 shadow-sm font-bold';
        } else {
          btn.className = 'main-tab-pill py-1.5 rounded-lg text-center transition flex items-center justify-center gap-1 text-amber-100 hover:text-white';
        }
      });

      const mapLabel = document.getElementById('tab-label-map');
      if (mapLabel) {
        mapLabel.innerText = isIsland ? dict.navFoodIsland : dict.navFood;
      }

      const newsLabel = document.getElementById('tab-label-news');
      if (newsLabel) {
        newsLabel.innerText = isIsland ? dict.navNewsIsland : dict.navNews;
      }

      if (currentMainTab === 'map') renderRestaurants();
      if (currentMainTab === 'attraction') renderAttractions();
      if (currentMainTab === 'news') renderNews();

      bindCarouselDots();
    }

    function bindCarouselDots() {
      document.querySelectorAll('.carousel-track').forEach(track => {
        const id = track.id.replace('track-', '');
        const dotsContainer = document.getElementById(`dots-${id}`);
        if (!dotsContainer) return;
        const dots = dotsContainer.querySelectorAll('.dot-indicator');
        
        track.addEventListener('scroll', () => {
          const slideWidth = track.offsetWidth;
          if (slideWidth === 0) return;
          const activeIndex = Math.round(track.scrollLeft / slideWidth);
          dots.forEach((dot, idx) => {
            dot.classList.toggle('active', idx === activeIndex);
          });
        }, { passive: true });
      });
    }

    function renderRestaurants() {
      const listEl = document.getElementById('restaurant-list');
      document.getElementById('loading').style.display = 'none';
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const currentShortLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      let filtered = allRestaurants.filter(item => {
        const matchC = isCityMatch(item, currentCity);
        if (!matchC) return false;

        if (currentSubFilter === 'all') return true;

        if (isIslandMode(currentCity)) {
          if (currentSubFilter === 'food') return item.islandType === 'food' || item.categoryKey !== 'hotel_villa';
          if (currentSubFilter === 'hotel_villa') return item.islandType === 'hotel_villa' || item.categoryKey === 'hotel_villa' || item.categoryKey === 'hotel' || item.categoryKey === 'villa';
          return true;
        } else {
          const cat = (safeStr(item.categoryKey) + ' ' + safeStr(item.category)).toLowerCase();
          if (currentSubFilter === 'japanese_korean') return cat.includes('japanese') || cat.includes('korean') || cat.includes('日料') || cat.includes('燒肉') || cat.includes('生魚片');
          if (currentSubFilter === 'chinese') return cat.includes('chinese') || cat.includes('中餐') || cat.includes('火鍋') || cat.includes('hotpot');
          if (currentSubFilter === 'bbq_seafood') return cat.includes('bbq') || cat.includes('seafood') || cat.includes('炭烤') || cat.includes('海鮮') || cat.includes('排餐');
          if (currentSubFilter === 'fast_food') return cat.includes('fast') || cat.includes('速食') || cat.includes('美式');
          if (currentSubFilter === 'coffee_drinks') return cat.includes('coffee') || cat.includes('drinks') || cat.includes('咖啡') || cat.includes('手搖');
          return cat.includes(currentSubFilter.toLowerCase());
        }
      });

      if (currentSearchQuery) {
        const q = currentSearchQuery.toLowerCase();
        filtered = filtered.filter(item => {
          const text = (safeStr(item.name) + ' ' + safeStr(item.name_en) + ' ' + safeStr(item.address)).toLowerCase();
          return text.includes(q);
        });

      const curReg = [...REGION_CONFIG.cities, ...REGION_CONFIG.islands].find(r => r.id === currentCity);

      if (currentSubFilter !== 'all') {
        const currentList = isIslandMode(currentCity) ? SUB_FILTERS.food_island : SUB_FILTERS.food_urban;

        if (targetObj && typeof targetObj.label === 'object') {

        } else if (targetObj) {
          subName = targetObj.label;
        }
      }

      filterSummaryText.textContent = `${cityName} · ${subName}`;
      itemCountBadge.textContent = `${filtered.length} ${dict.placesCountUnit}`;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-slate-200/80 shadow-xs mt-2">
            <i class="fa-solid fa-compass-drafting text-3xl text-slate-300 mb-2"></i>
            <h4 class="text-xs font-bold text-slate-700">${dict.noResult}</h4>
            <p class="text-[11px] text-slate-400 mt-1">${dict.noResultSub}</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map((item, idx) => {
        const name = getLocalizedText(item, 'name', currentShortLang) || item.name || item.name_en || '特色名店';
        const desc = getLocalizedText(item, 'desc', currentShortLang) || getText(item.description) || '暫無詳細介紹。';
        const isCurated = !!item.isCurated;
        const isGoogleTop = !!item.isGoogleTop;

        const curatedNote = getLocalizedText(item, 'bigv_comment', currentShortLang) || item.curatedNote || '';
        const mustTry = getLocalizedText(item, 'must_try', currentShortLang) || item.mustTry || '';

        const reviewCount = item.googleReviewCount || 0;
        const isFoodOnly = (item.islandType === 'food') || (!item.islandType && item.categoryKey !== 'hotel_villa' && item.categoryKey !== 'hotel' && item.categoryKey !== 'villa');

        return `
          <article class="bg-white rounded-2xl overflow-hidden shadow-xs hover:shadow-md border ${
            isCurated ? 'border-amber-400 ring-2 ring-amber-400/20' : isGoogleTop ? 'border-sky-300 ring-2 ring-sky-300/20' : 'border-slate-200/80'
          } flex flex-col transition">
            
            <div class="relative w-full overflow-hidden">
              ${buildCarouselHtml(item.images, `res-${idx}`, name)}

              ${isCurated ? `
                <div class="absolute top-2.5 left-2.5 bg-neutral-900/95 text-amber-300 text-[11px] font-extrabold px-2.5 py-1 rounded-full shadow-lg flex items-center gap-1.5 border border-amber-400/60 backdrop-blur-md z-10">
                  <i class="fa-solid fa-crown text-amber-400"></i> ${dict.badgeCurated}
                </div>
              ` : ''}

              ${(!isCurated && isGoogleTop) ? `
                <div class="absolute top-2.5 left-2.5 bg-sky-900/95 text-sky-200 text-[11px] font-extrabold px-2.5 py-1 rounded-full shadow-lg flex items-center gap-1 border border-sky-400/60 backdrop-blur-md z-10">
                  <i class="fa-solid fa-fire text-amber-300"></i> ${dict.badgeGoogleTop}
                </div>
              ` : ''}

              <div class="absolute bottom-2.5 left-2.5 flex items-center gap-1.5 z-10">
                <span class="bg-slate-900/80 backdrop-blur-xs text-white text-[10px] px-2 py-0.5 rounded font-medium">
                  ${dict['city_' + item.city] || item.city}
                </span>
                ${item.googleRating ? `
                  <span class="bg-amber-500 text-white text-[10px] px-2 py-0.5 rounded font-bold flex items-center gap-0.5 shadow-xs">
                    <i class="fa-solid fa-star text-[9px]"></i> ${item.googleRating} (${reviewCount})
                  </span>
                ` : ''}
              </div>
            </div>

            <div class="p-3.5 flex flex-col flex-1">
              <h2 class="font-extrabold text-sm text-slate-900 leading-snug mb-1">${name}</h2>

              ${(isCurated && curatedNote) ? `
                <div class="bg-amber-50/90 border-l-3 border-amber-500 p-2.5 rounded-r-lg text-xs text-amber-950 font-medium leading-relaxed mb-2.5">
                  💡 <b>${dict.curatedNotePrefix}</b>${curatedNote}
                </div>
              ` : ''}
              
              ${(isCurated && mustTry) ? `
                <div class="flex items-start gap-1.5 p-2 mb-2.5 rounded-lg bg-amber-50/60 border border-amber-200/80 text-xs text-amber-900">
                  <span class="shrink-0 px-1.5 py-0.5 rounded bg-amber-500 text-white font-bold text-[10px] leading-none mt-0.5">${dict.mustTryBadge}</span>
                  <span class="font-medium leading-tight">${mustTry}</span>
                </div>
              ` : ''}

              ${(!isCurated && isGoogleTop && item.googleTopNote) ? `
                <div class="bg-sky-50/90 border-l-3 border-sky-500 p-2.5 rounded-r-lg text-xs text-sky-950 font-medium leading-relaxed mb-2.5">
                  💬 <b>${dict.googleTopNotePrefix}</b>${item.googleTopNote}
                </div>
              ` : ''}

              <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed mb-3">
                ${desc}
              </p>

              <div class="space-y-1 text-[11px] text-slate-500 border-t border-slate-100 pt-2 mb-3 font-medium">
                <p class="flex items-center gap-1.5 truncate">

                  <span>${item.phone || dict.phoneEmpty}</span>

              </div>

              <div class="mt-auto grid ${(!isIslandMode(currentCity) && isFoodOnly) ? 'grid-cols-3' : 'grid-cols-2'} gap-1.5 pt-1 border-t border-slate-100">
                ${(!isIslandMode(currentCity) && isFoodOnly) ? `
                  <a href="https://food.grab.com/ph/en/restaurants?search=${encodeURIComponent(name)}" target="_blank" rel="noopener noreferrer"
                     class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-[11px] font-bold py-2 rounded-xl text-center flex items-center justify-center gap-1 shadow-xs transition">
                    <i class="fa-solid fa-motorcycle"></i> ${dict.btnGrab}

                  <i class="fa-solid fa-phone"></i> ${dict.btnCall}
                </a>
                <a href="${item.nav_link || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name + ' ' + (item.address || '')))}" target="_blank" rel="noopener noreferrer"
                   class="bg-orange-500 hover:bg-orange-600 active:scale-95 text-white text-[11px] font-bold py-2 rounded-xl text-center flex items-center justify-center gap-1 shadow-xs transition">
                  <i class="fa-solid fa-location-arrow"></i> ${dict.btnNav}
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderAttractions() {
      const listEl = document.getElementById('attraction-list');
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const currentShortLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      let filtered = allAttractions.filter(item => {
        // 景點城市比對：若為 all 或比對符合即放行
        const matchC = !item.city || item.city === 'all' || isCityMatch(item, currentCity);
        if (!matchC) return false;
        if (!currentSubFilter || currentSubFilter === 'all') return true;

        const cat = (safeStr(item.category) + ' ' + safeStr(item.id) + ' ' + safeStr(item.name_zh) + ' ' + safeStr(item.name_en)).toLowerCase();
        
        if (currentSubFilter === 'shopping') {
          return cat.includes('shop') || cat.includes('商場') || cat.includes('購物') || cat.includes('mall') || cat.includes('market') || cat.includes('binondo');
        }
        if (currentSubFilter === 'casino') {
          return cat.includes('casino') || cat.includes('賭場') || cat.includes('娛樂') || cat.includes('dreams') || cat.includes('okada') || cat.includes('solaire') || cat.includes('nustar');
        }
        if (currentSubFilter === 'history') {
          return cat.includes('history') || cat.includes('歷史') || cat.includes('文化') || cat.includes('古蹟') || cat.includes('church') || cat.includes('cathedral') || cat.includes('教堂') || cat.includes('intramuros') || cat.includes('pedro') || cat.includes('santo') || cat.includes('magellan') || cat.includes('museum') || cat.includes('博物館') || cat.includes('leah');
        }
        if (currentSubFilter === 'nature') {
          return cat.includes('nature') || cat.includes('自然') || cat.includes('公園') || cat.includes('park') || cat.includes('garden') || cat.includes('ocean') || cat.includes('zoo') || cat.includes('tarsier') || cat.includes('hills') || cat.includes('cave') || cat.includes('falls') || cat.includes('tops') || cat.includes('eden') || cat.includes('croc');
        }
        if (currentSubFilter === 'beach') {
          return cat.includes('beach') || cat.includes('沙灘') || cat.includes('海灘');
        }
        if (currentSubFilter === 'island_hopping') {
          return cat.includes('island') || cat.includes('跳島') || cat.includes('浮潛') || cat.includes('lagoon');
        }

        return cat.includes(currentSubFilter.toLowerCase());
      });

      if (currentSearchQuery) {
        const q = currentSearchQuery.toLowerCase();
        filtered = filtered.filter(item => {
          const name = getLocalizedText(item, 'name', currentShortLang);
          return (safeStr(name) + ' ' + safeStr(item.address)).includes(q);
        });

      filterSummaryText.textContent = `${cityName} · ${dict.navSpot}`;

            <i class="fa-solid fa-camera-retro text-3xl text-slate-300 mb-2"></i>
            <h4 class="text-xs font-bold text-slate-700">${dict.noResult}</h4>
            <p class="text-[11px] text-slate-400 mt-1">${dict.noResultSub}</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map((item, idx) => {
        const name = getLocalizedText(item, 'name', currentShortLang) || item.name_en || item.name_zh || item.id || '景點地標';
        const desc = getLocalizedText(item, 'desc', currentShortLang) || getText(item.description) || '菲律賓熱門推薦地標。';

        return `
          <article class="bg-white rounded-2xl overflow-hidden shadow-xs hover:shadow-md border border-slate-200/80 flex flex-col transition">
            <div class="relative w-full overflow-hidden">
              ${buildCarouselHtml(item.images, `attr-${idx}`, name)}
              <div class="absolute bottom-2.5 left-2.5 flex items-center gap-1.5 z-10">
                <span class="bg-slate-900/80 backdrop-blur-xs text-white text-[10px] px-2 py-0.5 rounded font-medium">
                  ${dict['city_' + item.city] || item.city}
                </span>
              </div>
            </div>

            <div class="p-3.5 flex flex-col flex-1">
              <h2 class="font-extrabold text-sm text-slate-900 mb-1">${name}</h2>
              <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed mb-3">${desc}</p>
              
              <div class="space-y-1 text-[11px] text-slate-500 border-t border-slate-100 pt-2 mb-3">
                <p class="flex items-center gap-1.5 truncate">
                  <i class="fa-solid fa-location-dot text-orange-500 w-3"></i>
                  <span class="truncate">${item.address || dict.addressEmpty}</span>
                </p>
              </div>

              <div class="mt-auto grid ${item.phone ? 'grid-cols-2' : 'grid-cols-1'} gap-1.5 pt-1 border-t border-slate-100">
                ${item.phone ? `
                  <a href="tel:${item.phone}" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-[11px] font-bold py-2 rounded-xl text-center flex items-center justify-center gap-1 transition">
                    <i class="fa-solid fa-phone"></i> ${dict.btnCall}
                  </a>
                ` : ''}
                <a href="${item.nav_link || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name + ' ' + (item.address || '')))}" target="_blank" rel="noopener noreferrer"
                   class="bg-orange-500 hover:bg-orange-600 active:scale-95 text-white text-[11px] font-bold py-2 rounded-xl text-center flex items-center justify-center gap-1 shadow-xs transition">
                  <i class="fa-solid fa-location-arrow"></i> ${dict.btnNav}
                </a>
              </div>
            </div>
          </article>

    // 3. 精選優惠卡片渲染 (標準黃金視覺動線升級版)
    function renderNews() {
      const listEl = document.getElementById('news-list');
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const currentShortLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      let filtered = allNews.filter(item => {
        // 優惠城市放行：若為 all 或符合當前城市即放行
        const matchC = !item.city || (item.city === 'all') || (currentCity === 'all') || isCityMatch(item, currentCity);
        const matchS = (!currentSubFilter || currentSubFilter === 'all') || (item.type === currentSubFilter);
        return matchC && matchS;
      });

      if (currentSearchQuery) {
        const q = currentSearchQuery.toLowerCase();
        filtered = filtered.filter(item => {
          const t = getLocalizedText(item, 'title', currentShortLang);
          const d = getLocalizedText(item, 'description', currentShortLang);
          const s = safeStr(item.store_name);
          return (safeStr(t) + ' ' + safeStr(d) + ' ' + s).includes(q);
        });
      }

      filterSummaryText.textContent = `${isIslandMode(currentCity) ? dict.navNewsIsland : dict.navNews} · 即時優惠`;
      itemCountBadge.textContent = `${filtered.length} ${dict.newsCountUnit}`;

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-slate-200/80 shadow-xs mt-2">
            <i class="fa-solid fa-tags text-3xl text-slate-300 mb-2"></i>
            <h4 class="text-xs font-bold text-slate-700">${dict.noResult}</h4>
            <p class="text-[11px] text-slate-400 mt-1">${dict.noResultSub}</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map((item, idx) => {
        const storeName = item.store_name || '精選特約門市';
        const title = getLocalizedText(item, 'title', currentShortLang) || '特惠活動';
        const description = getLocalizedText(item, 'description', currentShortLang) || '活動詳情請洽門市工作人員。';
        const type = (item.type || 'ongoing').toLowerCase();

        let badgeHtml = '';
        if (type === 'exclusive') {
          badgeHtml = `
            <span class="bg-neutral-900/95 text-amber-300 border border-amber-400/70 text-[11px] font-extrabold px-2.5 py-1 rounded-full shadow-lg flex items-center gap-1.5 backdrop-blur-md">
              <i class="fa-solid fa-crown text-amber-400"></i> ${dict.badgeExclusive}
            </span>
          `;
        } else if (type === 'limited') {
          badgeHtml = `
            <span class="bg-rose-600/90 text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow-md flex items-center gap-1 backdrop-blur-md">
              <i class="fa-solid fa-clock text-white"></i> ${dict.badgeLimited}
            </span>
          `;
        } else {
          badgeHtml = `
            <span class="bg-emerald-600/90 text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow-md flex items-center gap-1 backdrop-blur-md">
              <i class="fa-solid fa-gem text-white"></i> ${dict.badgeOngoing}
            </span>
          `;
        }

        const validUntil = item.valid_until ? `${dict.validUntilPrefix}${item.valid_until}` : '長期有效';

        return `
          <article class="bg-white rounded-2xl overflow-hidden shadow-xs hover:shadow-md border ${
            type === 'exclusive' ? 'border-amber-400 ring-2 ring-amber-400/20' : 'border-slate-200/80'
          } flex flex-col transition">
            
            <!-- 1. 頂部多圖輪播相簿 (支援 Touch Snap & 指示圓點) -->
            <div class="relative w-full overflow-hidden">
              ${buildCarouselHtml(item.images, `promo-${idx}`, title)}
              
              <!-- 左上角子分類標籤 -->
              <div class="absolute top-2.5 left-2.5 z-10 flex flex-col gap-1">
                ${badgeHtml}
              </div>

              <!-- 右上角有效期膠囊 -->
              <div class="absolute top-2.5 right-2.5 z-10">
                <span class="bg-neutral-900/80 text-white text-[10px] px-2 py-0.5 rounded-full backdrop-blur-xs font-mono">
                  ${validUntil}
                </span>
              </div>

              <div class="absolute bottom-2.5 left-2.5 z-10">
                <span class="bg-slate-900/80 backdrop-blur-xs text-white text-[10px] px-2 py-0.5 rounded font-medium">
                  ${dict['city_' + item.city] || item.city || '全菲'}
                </span>
              </div>
            </div>

            <!-- 卡片內容主體 (標準視覺動線) -->
            <div class="p-4 flex flex-col flex-1">
              <!-- 2. 店家大標置頂 -->
              <h2 class="font-extrabold text-base text-slate-900 leading-tight mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-store text-orange-500 text-xs"></i>
                <span>${storeName}</span>
              </h2>

              <!-- 3. 優惠主標 -->
              <h3 class="font-bold text-xs text-orange-600 mb-2 leading-snug">
                ${title}
              </h3>

              <!-- 詳細活動說明文 -->
              <div class="bg-slate-50 border-l-3 border-orange-400 p-2.5 rounded-r-lg text-xs text-slate-600 leading-relaxed mb-3">
                ${description}
              </div>

              <!-- 4. 門市地址與電話 -->
              <div class="space-y-1 text-[11px] text-slate-500 border-t border-slate-100 pt-2 mb-3 font-medium">
                ${item.address ? `
                  <p class="flex items-center gap-1.5 truncate">
                    <i class="fa-solid fa-location-dot text-orange-500 w-3"></i>
                    <span class="truncate">${item.address}</span>
                  </p>
                ` : ''}
                ${item.phone ? `
                  <p class="flex items-center gap-1.5 font-mono">
                    <i class="fa-solid fa-phone text-slate-400 w-3"></i>
                    <a href="tel:${item.phone}" class="hover:text-orange-600 transition">${item.phone}</a>
                  </p>
                ` : ''}
              </div>

              <!-- 5. 底部 CTA 一鍵導航按鈕 -->
              <div class="mt-auto grid ${item.phone ? 'grid-cols-2' : 'grid-cols-1'} gap-2 pt-1 border-t border-slate-100">
                ${item.phone ? `
                  <a href="tel:${item.phone}" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-xs font-bold py-2.5 rounded-xl text-center flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-phone text-xs"></i> ${dict.btnCall}
                  </a>
                ` : ''}
                <a href="${item.nav_link || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(storeName + ' ' + (item.address || '')))}" 
                   target="_blank" rel="noopener noreferrer"
                   class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 active:scale-95 text-white text-xs font-bold py-2.5 rounded-xl text-center flex items-center justify-center gap-1.5 shadow-sm transition">
                  <i class="fa-solid fa-location-arrow text-xs"></i> ${dict.btnNav}
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderUI() {
      renderRegionPills();
      renderSubFilterBar();
      renderContent();
    }

    function updateUiLanguage() {
      document.documentElement.lang = currentLang;
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      
      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.placeholder = dict.searchPlaceholder;

      const chatWelcome = document.getElementById('chat-welcome-bubble');
      if (chatWelcome && dict.aiChatWelcome) chatWelcome.textContent = dict.aiChatWelcome;

      const chatInputEl = document.getElementById('chat-input');
      if (chatInputEl && dict.aiChatPlaceholder) chatInputEl.placeholder = dict.aiChatPlaceholder;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          el.textContent = dict[key];
        }
      });

      const authBtn = document.getElementById('auth-btn-text');
      if (authBtn && !currentUser) {
        authBtn.textContent = dict.btnLogin;
      }

      renderUI();
    }

    window.updateUiLanguage = updateUiLanguage;

    function enableHorizontalScroll() {
      const scrollContainers = [
        document.getElementById('regionPillsNav'),
        document.getElementById('subFilterContainer')
      ];

      scrollContainers.forEach(container => {
        if (!container) return;

        container.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) {
            e.preventDefault();
            container.scrollLeft += e.deltaY;
          }
        }, { passive: false });

        let isDown = false;
        let startX, scrollLeft;

        container.addEventListener('mousedown', (e) => {
          isDown = true;
          container.classList.add('drag-scroll-active');
          startX = e.pageX - container.offsetLeft;
          scrollLeft = container.scrollLeft;
        });

        window.addEventListener('mouseup', () => {
          if (!isDown) return;
          isDown = false;
          container.classList.remove('drag-scroll-active');
        });

        container.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - container.offsetLeft;
          const walk = (x - startX) * 1.5;
          container.scrollLeft = scrollLeft - walk;
        });
      });
    }

    const langSelect = document.getElementById('lang-select');
    if (langSelect) {
      langSelect.value = currentLang;
      langSelect.addEventListener('change', (e) => {
        currentLang = e.target.value;
        localStorage.setItem('ph_app_lang', currentLang);
        updateUiLanguage();
        const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
        showToast(`${dict.toastSwitch}${e.target.options[e.target.selectedIndex].text}`);
      });
    }

    typeCityBtn.addEventListener('click', () => {
      currentDimension = 'cities';
      sessionStorage.setItem('ph_dim', 'cities');
      currentCity = 'manila';
      currentSubFilter = 'all';
      sessionStorage.setItem('ph_nav_sub', 'all');
      localStorage.setItem('ph_app_city', currentCity);
      renderUI();
    });

    typeIslandBtn.addEventListener('click', () => {
      currentDimension = 'islands';
      sessionStorage.setItem('ph_dim', 'islands');
      currentCity = 'boracay';
      currentSubFilter = 'all';
      sessionStorage.setItem('ph_nav_sub', 'all');
      localStorage.setItem('ph_app_city', currentCity);
      renderUI();
    });

    document.querySelectorAll('.main-tab-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        currentMainTab = btn.getAttribute('data-maintab');
        sessionStorage.setItem('ph_nav_tab', currentMainTab);
        currentSubFilter = 'all';
        sessionStorage.setItem('ph_nav_sub', 'all');
        renderSubFilterBar();
        renderContent();
      });
    });

    const searchInput = document.getElementById('search-input');
    const searchClearBtn = document.getElementById('search-clear-btn');

    searchInput.addEventListener('input', (e) => {
      currentSearchQuery = e.target.value.trim();
      searchClearBtn.classList.toggle('hidden', !currentSearchQuery);
      renderContent();
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentSearchQuery = '';
      searchClearBtn.classList.add('hidden');
      renderContent();
    });

    const authModal = document.getElementById('auth-modal');
    document.getElementById('auth-state-btn').addEventListener('click', () => {
      if (currentUser) {
        signOut(auth).then(() => showToast('已成功登出'));
      } else {
        authModal.classList.remove('hidden');
      }
    });

    document.getElementById('close-auth-btn').addEventListener('click', () => authModal.classList.add('hidden'));
    document.getElementById('btn-google-login').addEventListener('click', () => {
      signInWithPopup(auth, googleProvider).then(() => {
        authModal.classList.add('hidden');
        showToast('Google 帳號登入成功！');
      });
    });

    document.getElementById('btn-send-magic').addEventListener('click', () => {
      const email = document.getElementById('magic-email-input').value.trim();
      if (!email) {
        alert('請輸入 Email 信箱');
        return;
      }
      sendSignInLinkToEmail(auth, email, { url: window.location.href, handleCodeInApp: true }).then(() => {
        alert('魔法登入信已發送至您的信箱，請點擊信中連結完成登入！');
        authModal.classList.add('hidden');
      });
    });

    document.getElementById('share-btn').addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: '大V的旅遊窩 - 菲律賓精緻生活 & 海島漫遊地圖',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => showToast('網站連結已複製！'));
      }
    });

    const chatFab = document.getElementById('chat-fab');
    const chatModal = document.getElementById('chat-modal');
    const btnCloseChat = document.getElementById('btn-close-chat');
    const chatInput = document.getElementById('chat-input');
    const btnSendChat = document.getElementById('btn-send-chat');
    const chatMessages = document.getElementById('chat-messages');

    chatFab.addEventListener('click', () => {
      chatModal.classList.toggle('hidden');
      if (!chatModal.classList.contains('hidden')) {
        chatInput.focus();
      }
    });

    btnCloseChat.addEventListener('click', () => chatModal.classList.add('hidden'));
    btnSendChat.addEventListener('click', handleChatSend);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleChatSend();
    });

    async function handleChatSend() {
      const msg = chatInput.value.trim();
      if (!msg) return;

      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const targetLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      chatMessages.innerHTML += `
        <div class="bg-orange-500 text-white p-2.5 rounded-xl rounded-tr-sm self-end max-w-[85%] ml-auto text-xs leading-relaxed shadow-xs">
          ${msg}
        </div>
      `;
      chatInput.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const loadId = 'load-' + Date.now();
      const loadingText = dict.aiLoading || '管家正在為您查詢... ⚡';
      chatMessages.innerHTML += `
        <div id="${loadId}" class="bg-white p-2.5 rounded-xl rounded-tl-sm border border-slate-200/70 text-slate-500 text-xs self-start max-w-[85%] flex items-center gap-1.5 shadow-2xs">
          <i class="fa-solid fa-spinner fa-spin text-orange-500"></i> ${loadingText}
        </div>
      `;
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const resContext = (allRestaurants || [])
        .filter(i => currentCity === 'all' || isCityMatch(i, currentCity))
        .slice(0, 8)
        .map(r => getLocalizedText(r, 'name', targetLang) || r.name)
        .join(', ');

      try {
        const res = await fetch(AI_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: msg,
            lang: targetLang,
            currentCity: currentCity,
            restaurantsContext: `精選參考: ${resContext}`
          })
        });
        const data = await res.json();
        const loadEl = document.getElementById(loadId);
        if (loadEl) {
          loadEl.className = 'bg-white p-2.5 rounded-xl rounded-tl-sm border border-slate-200/70 text-slate-800 text-xs self-start max-w-[88%] leading-relaxed shadow-2xs';
          loadEl.innerText = data.reply;
        }
      } catch (err) {
        const loadEl = document.getElementById(loadId);
        if (loadEl) {
          loadEl.className = 'bg-white p-2.5 rounded-xl rounded-tl-sm border border-slate-200/70 text-slate-800 text-xs self-start max-w-[88%] leading-relaxed shadow-2xs';
          loadEl.innerText = targetLang === 'en'
            ? "Quick tip: Check out our top-rated local dining spots and pristine island beaches!"
            : targetLang === 'tl'
            ? "Mabilisang tip: Bisitahin ang mga tanyag na kainan at magagandang isla sa Pilipinas!"
            : "已為您快速查詢！推薦造訪在地人氣嚴選私房餐廳與精選海島景點。";
        }
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    initVisitorCounter();
    enableHorizontalScroll();
    fetchData();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('ServiceWorker 註冊失敗:', err);
        });
      });
    }
  </script>
</body>
</html>
