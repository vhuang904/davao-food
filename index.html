<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大V的旅遊窩</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#EA580C">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdfbf7; color: #333; padding-bottom: 50px; }
        
        /* 頂部 Header */
        header { background: #EA580C; color: white; padding: 12px 16px 0 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-top h1 { font-size: 1.15rem; font-weight: bold; letter-spacing: 0.5px; }
        
        .btn-share { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; outline: none; }
        .btn-share:active { background: rgba(255, 255, 255, 0.35); }

        .controls-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .app-select { flex: 1; background: rgba(255, 255, 255, 0.18); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 6px 10px; border-radius: 6px; font-size: 0.82rem; outline: none; cursor: pointer; text-overflow: ellipsis; }
        .app-select option { color: #333; background: white; }

        /* 即時搜尋框容器 */
        .search-container { position: relative; margin-bottom: 10px; display: flex; align-items: center; }
        .search-input { width: 100%; background: #ffffff; color: #292524; border: 1px solid #fed7aa; border-radius: 22px; padding: 8px 36px 8px 36px; font-size: 0.85rem; outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: all 0.2s; }
        .search-input:focus { border-color: #ea580c; box-shadow: 0 2px 10px rgba(234, 88, 12, 0.2); }
        .search-icon { position: absolute; left: 12px; color: #ea580c; font-size: 0.85rem; pointer-events: none; }
        .search-clear-btn { position: absolute; right: 10px; background: #e7e5e4; border: none; width: 20px; height: 20px; border-radius: 50%; color: #78716c; font-size: 0.72rem; cursor: pointer; display: none; align-items: center; justify-content: center; line-height: 1; }
        .search-clear-btn:active { background: #d6d3d1; }

        /* 三欄式主導覽 Tab 切換 */
        .main-tabs { display: flex; border-top: 1px solid rgba(255,255,255,0.2); }
        .main-tab-btn { flex: 1; text-align: center; padding: 10px 4px; font-weight: bold; font-size: 0.85rem; color: rgba(255,255,255,0.75); border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
        .main-tab-btn.active { color: white; border-bottom: 3px solid white; }

        /* 分類列與二級篩選 Bar */
        .category-bar, .sub-filter-bar { display: none; gap: 8px; overflow-x: auto; padding: 10px 16px; background: #ffffff; margin: 0 -16px; border-bottom: 1px solid #f1ece1; }
        .category-bar::-webkit-scrollbar, .sub-filter-bar::-webkit-scrollbar { display: none; }
        .cat-chip { padding: 6px 14px; border-radius: 18px; font-size: 0.85rem; background: #f5f2eb; color: #666; white-space: nowrap; border: none; cursor: pointer; transition: all 0.2s; }
        .cat-chip.active { background: #EA580C; color: white; font-weight: bold; }

        /* 卡片與容器 */
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .search-results-info { font-size: 0.8rem; color: #78716c; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

        .card { background: white; border-radius: 14px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); border: 1px solid #f0eae1; }
        .card > img { width: 100%; height: 200px; object-fit: cover; background: #f7f5f0; display: block; }

        /* 多圖輪播容器 */
        .carousel-container { position: relative; width: 100%; height: 210px; background: #f7f5f0; overflow: hidden; }
        .carousel-track { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide { flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: start; position: relative; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .carousel-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; z-index: 10; pointer-events: none; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); }
        .dot.active { background: #ffffff; width: 14px; border-radius: 4px; }
        .photo-tag { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.6); color: white; font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; z-index: 10; backdrop-blur: 2px; }

        .card-body { padding: 16px; }
        
        .badge-group { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .badge { display: inline-flex; align-items: center; background: #fff7ed; color: #c2410c; font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; border: 1px solid #ffedd5; }
        .badge-city { background: #f0f9ff; color: #0369a1; border-color: #e0f2fe; }
        .badge-promo { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
        .badge-brand { background: #fefce8; color: #a16207; border-color: #fef08a; }
        .badge-expiry { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; font-weight: bold; }

        /* 營業狀態徽章 */
        .badge-open { background: #ecfdf5; color: #047857; border-color: #a7f3d0; font-weight: bold; }
        .badge-closed { background: #fef2f2; color: #b91c1c; border-color: #fecaca; font-weight: bold; }

        /* Google 權威真實評分與大V精選徽章 */
        .badge-google-rating { background: #fef3c7; color: #92400e; border-color: #fde68a; font-weight: bold; gap: 4px; }
        .badge-elite-choice { background: #fff1f2; color: #e11d48; border-color: #fecdd3; font-weight: bold; gap: 4px; }

        .card-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; color: #1c1917; line-height: 1.35; }
        .card-desc { font-size: 0.88rem; color: #57534e; line-height: 1.5; margin-bottom: 12px; }
        .info-item { font-size: 0.85rem; color: #78716c; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
        
        /* 營業時間自適應排版 */
        .hours-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; width: 100%; }
        .hours-text { flex: 1; word-break: break-word; }
        .hours-dropdown { white-space: nowrap; color: #ea580c; font-weight: bold; cursor: pointer; text-decoration: underline; font-size: 0.8rem; shrink: 0; padding-top: 1px; }
        
        .weekly-hours-box { display: none; background: #faf8f5; border: 1px solid #eee8dd; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 0.8rem; color: #57534e; line-height: 1.6; }
        .weekly-hours-box.show { display: block; }
        .weekly-hours-box div.today { font-weight: bold; color: #ea580c; }

        .btn-group { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: calc(50% - 3px); padding: 10px 6px; border-radius: 8px; font-size: 0.82rem; font-weight: bold; text-align: center; text-decoration: none; border: none; cursor: pointer; }
        .btn-primary { background: #EA580C; color: white; }
        .btn-secondary { background: #f5f2eb; color: #44403c; }
        .btn-grab { background: #00B14F; color: white; }
        .btn-foodpanda { background: #D70F64; color: white; }
        
        #loading { text-align: center; padding: 40px; color: #a8a29e; }

        /* 用戶評分區塊 */
        .card-forum-box { background: #faf8f5; border-radius: 12px; padding: 10px 14px; margin-top: 14px; border: 1px solid #ede5d8; }
        .rating-header { display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
        .rating-left { display: flex; align-items: baseline; gap: 6px; }
        .rating-label { font-size: 0.82rem; font-weight: bold; color: #78716c; }
        .rating-score-num { font-size: 0.95rem; font-weight: 800; color: #ea580c; }
        .rating-count-hint { font-size: 0.72rem; color: #a8a29e; }
        
        .star-picker { display: flex; gap: 3px; cursor: pointer; }
        .star-picker span { font-size: 1.15rem; color: #e2dcd2; transition: color 0.15s; line-height: 1; }
        .star-picker span.active { color: #f59e0b; }
        
        .btn-toggle-forum { background: none; border: none; color: #57534e; font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 8px 0 2px 0; width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #e7dfd3; margin-top: 8px; }
        .btn-toggle-forum:hover { color: #ea580c; }

        .forum-content { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #ede5d8; }
        .forum-content.show { display: block; }

        .mini-comment-form { margin-bottom: 12px; background: #ffffff; padding: 10px; border-radius: 8px; border: 1px solid #eee8dd; }
        .mini-form-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .mini-input { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #e7e5e4; font-size: 0.8rem; outline: none; }
        .mini-select { width: 90px; padding: 6px 4px; border-radius: 6px; border: 1px solid #e7e5e4; font-size: 0.78rem; outline: none; }
        .mini-textarea { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #e7e5e4; font-size: 0.8rem; outline: none; resize: vertical; min-height: 50px; margin-bottom: 6px; }
        .btn-mini-post { width: 100%; background: #EA580C; color: white; padding: 6px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 0.8rem; }

        .review-item { font-size: 0.82rem; color: #57534e; padding: 8px 0; border-bottom: 1px solid #f5f2eb; }
        .review-item:last-child { border-bottom: none; }
        .review-user { font-weight: bold; color: #1c1917; }
        .review-time { font-size: 0.72rem; color: #a8a29e; float: right; }
        .review-text { margin-top: 4px; color: #44403c; line-height: 1.35; }

        /* 3D 角色頭像懸浮 AI 管家按鈕 */
        .chat-fab { position: fixed; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: #ffffff; border: 2px solid #ea580c; box-shadow: 0 6px 20px rgba(234, 88, 12, 0.45); overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; transition: transform 0.2s, box-shadow 0.2s; }
        .chat-fab:active { transform: scale(0.92); }
        .chat-fab img { width: 100%; height: 100%; object-fit: cover; }

        .chat-modal { display: none; position: fixed; bottom: 92px; right: 20px; width: 350px; max-width: calc(100vw - 32px); height: 500px; max-height: calc(100vh - 110px); background: #ffffff; border-radius: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.18); border: 1px solid #f0e6d8; flex-direction: column; z-index: 1000; overflow: hidden; }
        .chat-modal.show { display: flex; }

        .chat-header { background: #EA580C; color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header-info { display: flex; align-items: center; gap: 8px; }
        .chat-avatar-small { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 1.5px solid white; background: white; flex-shrink: 0; }
        .chat-avatar-small img { width: 100%; height: 100%; object-fit: cover; }
        .chat-header-info h3 { font-size: 0.95rem; font-weight: bold; margin: 0; }
        .chat-header-info span { font-size: 0.72rem; color: #fed7aa; display: block; }
        .btn-close-chat { background: rgba(255,255,255,0.2); border: none; color: white; width: 26px; height: 26px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fdfbf7; font-size: 0.85rem; }
        .chat-bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; word-break: break-word; }
        .chat-bubble.bot { background: #ffffff; border: 1px solid #e7e2d7; align-self: flex-start; color: #292524; border-top-left-radius: 4px; }
        .chat-bubble.user { background: #EA580C; color: white; align-self: flex-end; border-top-right-radius: 4px; }

        .chat-input-area { display: flex; border-top: 1px solid #efe8dc; padding: 10px 12px; background: #ffffff; gap: 8px; align-items: center; }
        .chat-input { flex: 1; border: 1px solid #e2d9cd; border-radius: 20px; padding: 9px 14px; font-size: 0.85rem; outline: none; background: #faf8f5; }
        .btn-send-chat { background: #EA580C; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; font-weight: bold; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1 id="app-title">📍 大V的旅遊窩</h1>
            <button class="btn-share" id="share-btn" onclick="shareApp()">📤 分享</button>
        </div>
        
        <div class="controls-row">
            <select class="app-select" id="city-select" onchange="changeCity(this.value)">
                <option value="all">全部城市 (All Cities)</option>
                <option value="davao">達沃 (Davao)</option>
                <option value="manila">馬尼拉 (Manila)</option>
                <option value="cebu">宿霧 (Cebu)</option>
            </select>
            <select class="app-select" id="lang-select" onchange="changeLanguage(this.value)">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="tl">Tagalog</option>
            </select>
        </div>

        <!-- 即時搜尋框 -->
        <div class="search-container" id="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" class="search-input" id="search-input" placeholder="搜尋燒肉、火鍋、景點、演唱會..." oninput="handleSearchInput(this.value)">
            <button class="search-clear-btn" id="search-clear-btn" onclick="clearSearch()" title="清除">✕</button>
        </div>

        <!-- 三欄式主導覽 Tab 切換 -->
        <div class="main-tabs">
            <button class="main-tab-btn active" id="tab-btn-map" onclick="switchMainTab('map')">🗺️ 美食地圖</button>
            <button class="main-tab-btn" id="tab-btn-attraction" onclick="switchMainTab('attraction')">🏛️ 景點導覽</button>
            <button class="main-tab-btn" id="tab-btn-news" onclick="switchMainTab('news')">📰 城市動態</button>
        </div>
        
        <!-- 美食分類列 -->
        <div class="category-bar" id="category-bar"></div>

        <!-- 景點二級分類 Bar -->
        <div class="sub-filter-bar" id="attraction-filter-bar">
            <button class="cat-chip active" id="att-sub-all" onclick="filterAttractionCat('all')">全部景點</button>
            <button class="cat-chip" id="att-sub-history" onclick="filterAttractionCat('history')">🏛️ 歷史文化</button>
            <button class="cat-chip" id="att-sub-nature" onclick="filterAttractionCat('nature')">🌳 自然海灘</button>
            <button class="cat-chip" id="att-sub-shopping" onclick="filterAttractionCat('shopping')">🛒 購物商場</button>
        </div>

        <!-- 城市動態二級篩選 Bar -->
        <div class="sub-filter-bar" id="news-filter-bar">
            <button class="cat-chip active" id="news-sub-all" onclick="filterNewsType('all')">全部動態</button>
            <button class="cat-chip" id="news-sub-promo" onclick="filterNewsType('promo')">🔥 限時優惠</button>
            <button class="cat-chip" id="news-sub-new" onclick="filterNewsType('new')">✨ 新開餐廳</button>
            <button class="cat-chip" id="news-sub-event" onclick="filterNewsType('event')">🎵 演唱會與活動</button>
            <button class="cat-chip" id="news-sub-movie" onclick="filterNewsType('movie')">🎬 電影與娛樂</button>
        </div>
    </header>

    <!-- 美食地圖 Tab 內容 -->
    <div id="main-tab-map" class="tab-content active">
        <div class="container">
            <div id="search-results-info" class="search-results-info" style="display:none;"></div>
            <div id="loading">載入最新美食與旅遊清單中...</div>
            <div id="restaurant-list"></div>
        </div>
    </div>

    <!-- 景點導覽 Tab 內容 -->
    <div id="main-tab-attraction" class="tab-content">
        <div class="container">
            <div id="attraction-list">載入景點導覽中...</div>
        </div>
    </div>

    <!-- 城市動態 Tab 內容 -->
    <div id="main-tab-news" class="tab-content">
        <div class="container">
            <div id="news-list">載入城市動態中...</div>
        </div>
    </div>

    <!-- 3D 角色頭像懸浮 AI 管家按鈕 -->
    <button class="chat-fab" id="chat-fab" onclick="toggleChat()" title="大V旅遊窩管家">
        <img src="ai-avatar.png" alt="AI 管家" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop'">
    </button>

    <!-- AI 旅遊窩管家彈窗 -->
    <div class="chat-modal" id="chat-modal">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-avatar-small">
                    <img src="ai-avatar.png" alt="AI" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop'">
                </div>
                <div>
                    <h3 id="chat-header-title">大V旅遊窩管家</h3>
                    <span>Powered by Gemini 3.7 Flash</span>
                </div>
            </div>
            <button class="btn-close-chat" onclick="toggleChat()">✕</button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="chat-bubble bot" id="chat-welcome-msg">
                嗨！我是大V旅遊窩管家 👋 歡迎來到菲律賓！有任何餐廳推薦、必去景點、演唱會活動或外送疑問，隨時問我喔！
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="問點什麼吧（例：達沃有什麼推薦景點？）..." onkeypress="handleChatKeyPress(event)">
            <button class="btn-send-chat" id="chat-send-btn" onclick="sendChatMessage()">
                <i class="fa-solid fa-paper-plane" style="font-size:0.85rem;"></i>
            </button>
        </div>
    </div>

        function normalizeRestaurantName(name) {
            if (!name) return '';
            return name.toLowerCase()
                       .replace(/\([^)]*\)/g, '')
                       .replace(/restaurant|cafe|bistro|grill|express/g, '')
                       .replace(/[^a-z0-9\u4e00-\u9fa5]/g, '')
                       .trim();
        }

        function deduplicateRestaurants(list) {
            const uniqueMap = new Map();
            list.forEach(item => {
                const normName = normalizeRestaurantName(item.name_en || item.name || '');
                const city = (item.city || 'davao').toLowerCase();
                const dedupKey = `${city}_${normName}`;

                if (!uniqueMap.has(dedupKey)) {
                    uniqueMap.set(dedupKey, item);
                } else {
                    const existing = uniqueMap.get(dedupKey);
                    const score = (r) => {
                        let s = 0;
                        if (r.googleRating !== undefined && r.googleRating !== null) s += 50;
                        if (r.googleReviewCount) s += 20;
                        if (r.openingHours && r.openingHours.weekdayDescriptions && r.openingHours.weekdayDescriptions.length > 0) s += 20;
                        if (r.images && r.images.length > 0) s += r.images.length * 2;
                        return s;
                    };
                    if (score(item) > score(existing)) {
                        uniqueMap.set(dedupKey, item);
                    }
                }
            });
            return Array.from(uniqueMap.values());
        }

        function getUniqueRestaurantImageArray(name, catKey) {
            const pool = categoryImagePools[catKey] || categoryImagePools.attraction;
            let hash = 0;
            const str = name || 'default';
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const startIndex = Math.abs(hash) % pool.length;
            const images = [];
            for (let i = 0; i < 4; i++) {
                images.push(pool[(startIndex + i) % pool.length]);
            }
            return images;
        }

        window.handleCarouselScroll = function(el, resKey) {
            const scrollLeft = el.scrollLeft;
            const width = el.clientWidth;
            const index = Math.round(scrollLeft / width);
            const dots = document.querySelectorAll('#dots-' + resKey + ' .dot');
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === index);
            });
        }

        function parseOpeningStatus(openingHours) {
            if (!openingHours) return { hasData: false, isOpen: null, todayText: null, weeklyList: [] };
            const weekdayList = openingHours.weekdayDescriptions || [];
            const periods = openingHours.periods || [];
            if (weekdayList.length === 0 && periods.length === 0 && (openingHours.openNow === undefined || openingHours.openNow === null)) {
                return { hasData: false, isOpen: null, todayText: null, weeklyList: [] };
            }
            const now = new Date();
            const currentDay = now.getDay();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            let isOpen = (openingHours.openNow !== undefined && openingHours.openNow !== null) ? openingHours.openNow : false;
            let todayPeriodStr = "";
            const todayIndex = (currentDay === 0) ? 6 : (currentDay - 1);
            if (weekdayList.length > 0) {
                const fullText = weekdayList[todayIndex] || weekdayList[0];
                const parts = fullText.split(': ');
                todayPeriodStr = parts.length > 1 ? parts.slice(1).join(': ') : fullText;
            }
            return { hasData: true, isOpen: isOpen, todayText: todayPeriodStr || "營業中", weeklyList: weekdayList, todayDayIndex: todayIndex };
        }

        // 智慧同義詞過濾判定
        function matchQuery(item, query, langData) {
            if (!query) return true;
            const q = query.toLowerCase();
            const searchKeywords = new Set([q]);
            Object.keys(SYNONYM_MAP).forEach(key => {
                if (q.includes(key) || key.includes(q)) {
                    SYNONYM_MAP[key].forEach(syn => searchKeywords.add(syn.toLowerCase()));
                }
            });

            const name = (item.name || '').toLowerCase();
            const nameEn = (item.name_en || '').toLowerCase();
            const address = (item.address || '').toLowerCase();
            const desc = (item.description || item.description_zh || '').toLowerCase();
            const catKey = (item.categoryKey || item.category || '').toLowerCase();
            const searchableText = `${name} ${nameEn} ${address} ${desc} ${catKey}`;

            for (const kw of searchKeywords) {
                if (searchableText.includes(kw)) return true;
            }
            return false;
        }

                ...relevantRestaurants.map(r => `${r.name} (${r.city}, ${r.categoryKey || 'food'})`),
                "【景點清單】",
                ...relevantAttractions.map(a => `${a.name} (${a.city}, ${a.category})`)
            ].join('\n');

            try {
                const response = await fetch(AI_WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, lang: currentLang, currentCity: activeCity, restaurantsContext: contextText })
                });
                const data = await response.json();
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.innerText = data.reply;
            } catch (err) {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.innerText = langData.chatError;
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        };

        fetchData();
    </script>
</body>
</html>
