    const ISOLATED_POOLS = {
      history: [

    function resolveItemImage(item) {
      if (item.imageUrl) return item.imageUrl;
      const text = `${item.id} ${item.name} ${item.enName || ''}`.toLowerCase();

      // 1. 精準地標實景比對
      for (const [key, url] of Object.entries(STRICT_LANDMARKS)) {
        if (text.includes(key)) return url;
      }

      // 2. ID 雜湊餘數法（同店同圖、跨店不撞圖）
      const hash = Math.abs([...text].reduce((acc, c) => acc + c.charCodeAt(0), 0));

      if (item.subCategory === '歷史文化') {
        return ISOLATED_POOLS.history[hash % ISOLATED_POOLS.history.length];
      }
      if (item.subCategory === '賭場娛樂') {
        return ISOLATED_POOLS.casino[hash % ISOLATED_POOLS.casino.length];
      }
      if (item.subCategory === '絕美沙灘' || item.subCategory === '跳島浮潛' || item.subCategory === '生態秘境') {
        return ISOLATED_POOLS.beach[hash % ISOLATED_POOLS.beach.length];
      }
      if (item.category === 'hotel') {
        return ISOLATED_POOLS.island_resort[hash % ISOLATED_POOLS.island_resort.length];
      }
      if (item.subCategory === '日料生魚片') {
        return ISOLATED_POOLS.food_sushi[hash % ISOLATED_POOLS.food_sushi.length];
      }
      if (item.subCategory === '精選燒烤') {
        return ISOLATED_POOLS.food_bbq[hash % ISOLATED_POOLS.food_bbq.length];
      }

      return ISOLATED_POOLS.generic[hash % ISOLATED_POOLS.generic.length];
    }

    /* ==========================================================================
       5. 狀態管理與持久化 (sessionStorage & localStorage)
       ========================================================================== */
    const STATE_KEY = 'v_travel_app_state_2026';
    const FAV_KEY = 'v_travel_fav_list_2026';

    let appState = {
      type: 'city',
      region: 'manila',
      category: 'food',
      subCategory: '全部',
      search: ''
    };

    let activePlaces = [...FALLBACK_PLACES];
    let favorites = [];

    function loadSavedState() {
      const saved = sessionStorage.getItem(STATE_KEY);
      if (saved) {
        try {
          appState = { ...appState, ...JSON.parse(saved) };
        } catch (e) {
          console.error("狀態解析失敗", e);
        }
      }
      try {
        favorites = JSON.parse(localStorage.getItem(FAV_KEY)) || [];
      } catch (e) {
        favorites = [];
      }
    }

    function saveState() {
      sessionStorage.setItem(STATE_KEY, JSON.stringify(appState));
    }

    function saveFavorites() {
      localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
      updateFavBadge();
    }

    function updateFavBadge() {
      const favBadge = document.getElementById('favBadge');
      if (favorites.length > 0) {
        favBadge.textContent = favorites.length;
        favBadge.classList.remove('hidden');

    function showToast(message, icon = 'fa-check') {
      const toast = document.getElementById('toastNotification');
      const toastMessage = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');
      toastMessage.textContent = message;
      toastIcon.className = `fa-solid ${icon} text-amber-400`;
      toast.classList.remove('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
      }, 2200);

    /* ==========================================================================
       6. Firestore 雙軌非同步讀取邏輯
       ========================================================================== */
    async function fetchPlacesFromFirestore() {
      if (!db) return;
      try {
        const snapshot = await db.collection('places').get();
        if (!snapshot.empty) {
          const cloudData = [];
          snapshot.forEach(doc => {
            cloudData.push({ id: doc.id, ...doc.data() });
          });
          if (cloudData.length > 0) {
            activePlaces = cloudData;
            renderCards();
          }
        }
      } catch (err) {
        console.warn("Firestore 讀取跳過或使用本地快取：", err.message);
      }
    }

    /* ==========================================================================
       7. 評分星等渲染演算法
       ========================================================================== */
    function renderStars(rating) {
      let starsHtml = '';
      const fullStars = Math.floor(rating);
      const hasHalf = rating % 1 >= 0.4;
      for (let i = 0; i < fullStars; i++) {
        starsHtml += '<i class="fa-solid fa-star text-amber-400 mr-0.5"></i>';
      }
      if (hasHalf) {
        starsHtml += '<i class="fa-solid fa-star-half-stroke text-amber-400 mr-0.5"></i>';
      }
      const emptyStars = 5 - fullStars - (hasHalf ? 1 : 0);
      for (let i = 0; i < emptyStars; i++) {
        starsHtml += '<i class="fa-regular fa-star text-slate-300 mr-0.5"></i>';
      }
      return starsHtml;
    }

          answer = '日料頂級首選：達沃請指名【Yaki2gether】產地直送炙燒握壽司；馬尼拉請試預約制板前懷石天花板【Kyo-to】。';
        } else if (q.includes('燒烤') || q.includes('牛排') || q.includes('肉')) {
          answer = '炭烤美饌推薦：達沃必嚐【Backyard Butcher】慢火低溫煙燻牛胸肉與豬肋排，肉質軟嫩、香氣極為濃郁。';
        } else if (q.includes('衝浪') || q.includes('錫亞高') || q.includes('Siargao')) {
          answer = '衝浪勝地首選【錫亞高島 (Siargao)】！地標 Cloud 9 木棧道浪點世界聞名，還可造訪蘇格巴翡翠潟湖。';
        } else if (q.includes('賭場') || q.includes('娛樂城') || q.includes('Okada')) {
          answer = '賭場旗艦首推馬尼拉【Okada】水舞噴泉與【Solaire】海灣奢華渡假城；宿霧請認明地標【NUSTAR】雙子星。';
        } else if (q.includes('古蹟') || q.includes('歷史') || q.includes('教堂')) {
          answer = '歷史必訪：馬尼拉【王城區 Intramuros】西班牙古城石板路、宿霧【麥哲倫十字架】與達沃【聖佩德羅大教堂】。';
        } else {
          answer = `已為您快速索引「${q}」：推薦探索長灘島細緻白沙灘、巴拉望潟湖秘境或達沃在地私廚，享受菲律賓漫遊！`;
        }
        renderAiReply(loadingBubble, answer);
      }, 400);
    }

    function renderAiReply(loadingBubble, text) {
      loadingBubble.remove();
      const replyBubble = document.createElement('div');
      replyBubble.className = 'bg-amber-50 text-amber-950 p-3 rounded-2xl rounded-tl-sm self-start max-w-[90%] border border-amber-200/50 text-xs leading-relaxed shadow-sm';
      replyBubble.textContent = text;
      aiChatBox.appendChild(replyBubble);
      aiChatBox.scrollTop = aiChatBox.scrollHeight;
    }

    /* ==========================================================================
       12. 主類別與搜尋事件監聽
       ========================================================================== */
    typeCityBtn.addEventListener('click', () => {
      appState.type = 'city';
      saveState();
      renderDimensionTabs();
      renderSubCategories();
      renderCards();
    });

    typeIslandBtn.addEventListener('click', () => {
      appState.type = 'island';
      saveState();
      renderDimensionTabs();
      renderSubCategories();
      renderCards();
    });

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => {
          b.className = 'cat-btn py-2 rounded-lg text-center transition flex items-center justify-center gap-1.5 hover:text-slate-800';
        });
        btn.className = 'cat-btn py-2 rounded-lg text-center transition flex items-center justify-center gap-1.5 bg-white text-amber-600 shadow-sm font-bold';
        
        appState.category = btn.getAttribute('data-cat');
        appState.subCategory = '全部';
        saveState();
        renderSubCategories();
        renderCards();
      });
    });

    searchInput.addEventListener('input', (e) => {
      appState.search = e.target.value;
      clearSearchBtn.classList.toggle('hidden', !appState.search);
      renderCards();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      appState.search = '';
      clearSearchBtn.classList.add('hidden');
      renderCards();
    });

    /* ==========================================================================
       13. PWA Service Worker 離線快取註冊
       ========================================================================== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          // 靜默處理離線環境
        });
      });
    }

    /* ==========================================================================
       14. 應用程式初始化
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedState();
      updateFavBadge();

      // 同步三大主類別按鈕狀態
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === appState.category) {
          btn.className = 'cat-btn py-2 rounded-lg text-center transition flex items-center justify-center gap-1.5 bg-white text-amber-600 shadow-sm font-bold';
        } else {
          btn.className = 'cat-btn py-2 rounded-lg text-center transition flex items-center justify-center gap-1.5 hover:text-slate-800';
        }
      });

      renderDimensionTabs();
      renderSubCategories();
      renderCards();

      // 非同步拉取 Firestore 遠端最新資料（具備本地快取）
      fetchPlacesFromFirestore();
    });
  </script>
</body>
</html>
