      const dump = (safeStr(item.id) + ' ' + safeStr(item.name_zh) + ' ' + safeStr(item.name_en) + ' ' + safeStr(item.category)).toLowerCase();
      if (dump.includes('dreams') || dump.includes('新濠') || dump.includes('okada') || dump.includes('solaire') || dump.includes('nustar') || dump.includes('casino')) {
        return LANDMARK_CATEGORY_PHOTOS.casino;
      }
      if (dump.includes('mall') || dump.includes('moa') || dump.includes('商場') || dump.includes('購物') || dump.includes('sm ')) {
        return LANDMARK_CATEGORY_PHOTOS.mall;
      }
      if (dump.includes('museum') || dump.includes('博物館') || dump.includes('art') || dump.includes('heritage')) {
        return LANDMARK_CATEGORY_PHOTOS.museum;
      }
      if (dump.includes('rizal') || dump.includes('黎剎') || dump.includes('park') || dump.includes('公園') || dump.includes('people')) {
        return LANDMARK_CATEGORY_PHOTOS.park;
      }
      if (dump.includes('church') || dump.includes('cathedral') || dump.includes('教堂') || dump.includes('pedro') || dump.includes('santo') || dump.includes('intramuros')) {
        return LANDMARK_CATEGORY_PHOTOS.church;
      }
      if (dump.includes('ocean') || dump.includes('海洋') || dump.includes('aquarium') || dump.includes('zoo')) {
        return LANDMARK_CATEGORY_PHOTOS.ocean;
      }
      if (dump.includes('garden') || dump.includes('sira') || dump.includes('hills') || dump.includes('nature') || dump.includes('花園')) {
        return LANDMARK_CATEGORY_PHOTOS.nature;
      }
      if (dump.includes('beach') || dump.includes('island') || dump.includes('沙灘') || dump.includes('海灘')) {
        return LANDMARK_CATEGORY_PHOTOS.beach;
      }
      return LANDMARK_CATEGORY_PHOTOS.nature;
    }

    // 嚴格圖片擷取器：過濾掉 Google Maps 網頁導航連結，只取真實圖片網址！
    function extractValidPhotoUrl(item, fallbackUrl) {
      if (!item) return fallbackUrl;

      // 檢查候選鍵值
      const keys = ['image_url', 'imageurl', 'photo', 'image', '圖片網址', '圖片', 'image_link', 'col_14', 'col_7'];
      for (let k of keys) {
        const val = item[k];
        if (val && typeof val === 'string') {
          const trimmed = val.trim();
          // 嚴格排除 Google Maps 導航連結
          if (trimmed.startsWith('http') && !trimmed.includes('maps.google') && !trimmed.includes('goo.gl/maps')) {
            return trimmed;
          }
        }
      }

      return fallbackUrl;
    }

    async function fetchData() {
      try {
        let sheetMaster = { bigVPicks: [], attractions: [], promotions: [] };
        try {
          sheetMaster = await loadMasterDatabase();
        } catch (e) {
          console.warn("讀取 Google Sheet 失敗:", e);
        }

        const resSnap = await getDocs(collection(db, "restaurants")).catch(() => ({ forEach: () => {} }));
        const rawList = [];
        resSnap.forEach(d => rawList.push({ id: d.id, ...d.data() }));

        const mergedMap = new Map();
        const bigVLookup = new Map();
        sheetMaster.bigVPicks.forEach(v => {
          if (v.id) bigVLookup.set(v.id.toLowerCase().trim(), v);
        });

        rawList.forEach(item => {
          const nameAll = (safeStr(item.name) + ' ' + safeStr(item.name_en) + ' ' + safeStr(item.id)).toLowerCase();
          let key = item.id;

          let matchedBigV = null;
          for (let [bId, bItem] of bigVLookup.entries()) {
            const cityMatch = !bItem.city || (item.city && item.city.toLowerCase().trim() === bItem.city.toLowerCase().trim());
            if (key.toLowerCase().trim() === bId || (cityMatch && bItem.name && nameAll.includes(bItem.name.toLowerCase().trim()))) {
              matchedBigV = bItem;
              break;
            }
          }

          if (matchedBigV) {
            key = matchedBigV.id;
            item.id = matchedBigV.id;
            item.name = matchedBigV.name;
            item.name_zh = matchedBigV.name_zh || matchedBigV.name;
            item.name_en = matchedBigV.name_en || item.name_en;
            item.name_tl = matchedBigV.name_tl;
            item.isCurated = true;
            item.curatedBadge = "👑 站長私房嚴選";
            item.curatedNote = matchedBigV.big_v_comment || "站長每週必訪私房推薦！";
            item.mustTry = matchedBigV.must_try || "";
            item.city = matchedBigV.city;
            if (matchedBigV.address) item.address = matchedBigV.address;
            if (matchedBigV.nav_link) item.nav_link = matchedBigV.nav_link;
            item.images = [extractValidPhotoUrl(matchedBigV, LANDMARK_CATEGORY_PHOTOS.food_default)];
            bigVLookup.delete(matchedBigV.id.toLowerCase().trim());
          } else {
            item.isCurated = false;
            delete item.curatedBadge;
            delete item.curatedNote;
            delete item.mustTry;
          }

          if (nameAll.includes('pearl farm') || nameAll.includes('chema')) {
            item.city = 'samal';
            item.islandType = 'hotel';
          }

          if (!item.images || item.images.length === 0) {
            item.images = [LANDMARK_CATEGORY_PHOTOS.food_default];
          }

          if (mergedMap.has(key)) {
            const existing = mergedMap.get(key);
            if ((!existing.images || existing.images.length === 0) && (item.images && item.images.length > 0)) {
              mergedMap.set(key, { ...existing, images: item.images });
            }
          } else {
            mergedMap.set(key, item);
          }
        });

        bigVLookup.forEach(bigVItem => {
          mergedMap.set(bigVItem.id, {
            id: bigVItem.id,
            name: bigVItem.name,
            name_zh: bigVItem.name_zh || bigVItem.name,
            name_en: bigVItem.name_en || '',
            name_tl: bigVItem.name_tl || '',
            city: bigVItem.city,
            isCurated: true,
            curatedBadge: "👑 站長私房嚴選",
            curatedNote: bigVItem.big_v_comment,
            mustTry: bigVItem.must_try,
            address: bigVItem.address || "",
            phone: bigVItem.phone || "",
            googleRating: 5.0,
            googleReviewCount: 50,
            images: [extractValidPhotoUrl(bigVItem, LANDMARK_CATEGORY_PHOTOS.food_default)]
          });
        });

        allRestaurants = Array.from(mergedMap.values())
          .sort((a, b) => {
            if (a.isCurated && !b.isCurated) return -1;
            if (!a.isCurated && b.isCurated) return 1;
            return (b.googleRating || 0) - (a.googleRating || 0);
          });

        // 景點清單：排除 Google Maps 導航網址，並對應專屬高畫質代表圖
        if (sheetMaster.attractions && sheetMaster.attractions.length > 0) {
          allAttractions = sheetMaster.attractions.map(att => {
            const smartFallback = getSmartLandmarkPhoto(att);
            const img = extractValidPhotoUrl(att, smartFallback);

            return {
              id: att.id,
              city: att.city,
              category: att.category || '',
              name_zh: att.name_zh || att.name,
              name_en: att.name_en,
              name_tl: att.name_tl,
              desc_zh: att.desc_zh || att.description || att.desc,
              desc_en: att.desc_en,
              desc_tl: att.desc_tl,
              address: att.address,
              nav_link: att.nav_link || (att.image_url && String(att.image_url).includes('maps.google') ? att.image_url : ''),
              images: [img]
            };
          });
          console.log("📸 景點第一筆修正後的圖片網址:", allAttractions[0]?.images[0]);
        }

        // 動態清單
        if (sheetMaster.promotions && sheetMaster.promotions.length > 0) {
          allNews = sheetMaster.promotions.map(promo => {
            const img = extractValidPhotoUrl(promo, LANDMARK_CATEGORY_PHOTOS.nature);

            return {
              id: promo.id,
              city: promo.city || 'all',
              type: promo.type || 'promo',
              brand: promo.store_name,
              title_zh: promo.title_zh || promo.title,
              title_en: promo.title_en,
              title_tl: promo.title_tl,
              tag: promo.discount_badge || '🔥 獨家優惠',
              validity_zh: promo.valid_until_zh || promo.valid_until || '長期有效',
              validity_en: promo.valid_until_en || promo.valid_until || 'Ongoing',
              validity_tl: promo.valid_until_tl || promo.valid_until || 'Patuloy',
              detail_zh: promo.detail_zh || promo.detail || promo.description,
              detail_en: promo.detail_en,
              detail_tl: promo.detail_tl,
              location: promo.store_name,
              images: [img]
            };
          });
        }

      } catch (err) {
        console.error("載入失敗:", err);
      }

      updateUiLanguage();
    }

    function isCityMatch(item, targetCity) {
      if (targetCity === 'all') return true;
      const c = safeStr(item.city);
      const a = safeStr(item.address);
      if (targetCity === 'samal') {
        return c === 'samal' || a.includes('samal');
      }
      if (targetCity === 'davao') {
        return (c === 'davao' || a.includes('davao')) && !c.includes('samal') && !a.includes('samal');
      }
      if (targetCity === 'manila') {
        return c === 'manila' || a.includes('manila') || a.includes('makati') || a.includes('taguig') || a.includes('pasay') || a.includes('bgc');
      }
      return c === targetCity || a.includes(targetCity);
    }

      }`;

        currentCity = list[0].id;
        localStorage.setItem('ph_app_city', currentCity);
      }

      regionPillsNav.innerHTML = list.map(r => {
        const active = r.id === currentCity;

          }">
            ${cityName}
          </button>
        `;
      }).join('');

      document.querySelectorAll('.region-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCity = btn.getAttribute('data-city');
          currentSubFilter = 'all';
          sessionStorage.setItem('ph_nav_sub', 'all');
          localStorage.setItem('ph_app_city', currentCity);
          renderRegionPills();
          renderSubFilterBar();
          renderContent();
        });
      });

    function renderSubFilterBar() {
      let filterList = [];
      const isIsland = isIslandMode(currentCity);

      if (currentMainTab === 'map') {
        filterList = isIsland ? SUB_FILTERS.food_island : SUB_FILTERS.food_urban;
      } else if (currentMainTab === 'attraction') {
        filterList = isIsland ? SUB_FILTERS.attraction_island : SUB_FILTERS.attraction_urban;
      } else {
        filterList = SUB_FILTERS.news;
      }

      if (!filterList.some(f => f.key === currentSubFilter)) {
        currentSubFilter = 'all';
        sessionStorage.setItem('ph_nav_sub', 'all');
      }

      subFilterContainer.innerHTML = filterList.map(f => {
        const active = f.key === currentSubFilter;
        let label = (typeof f.label === 'object') ? (f.label[currentLang] || f.label['zh-TW']) : f.label;
        return `
          <button data-subkey="${f.key}" class="sub-pill px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition select-none ${
            active ? 'bg-orange-500 text-white shadow-xs font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
          }">
            ${label}
          </button>
        `;
      }).join('');

      document.querySelectorAll('.sub-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          currentSubFilter = btn.getAttribute('data-subkey');
          sessionStorage.setItem('ph_nav_sub', currentSubFilter);
          renderSubFilterBar();
          renderContent();
        });
      });
    }

    function renderContent() {
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      ['map', 'attraction', 'news'].forEach(tab => {
        document.getElementById(`section-${tab}`).classList.toggle('hidden', tab !== currentMainTab);
        const btn = document.getElementById(`tab-btn-${tab}`);
        if (tab === currentMainTab) {
          btn.className = 'main-tab-pill py-1.5 rounded-lg text-center transition flex items-center justify-center gap-1 bg-white text-orange-600 shadow-sm font-bold';
        } else {
          btn.className = 'main-tab-pill py-1.5 rounded-lg text-center transition flex items-center justify-center gap-1 text-amber-100 hover:text-white';
        }
      });

      const mapLabel = document.getElementById('tab-label-map');
      if (mapLabel) {
        mapLabel.innerText = isIslandMode(currentCity) ? dict.navFoodIsland : dict.navFood;
      }

      if (currentMainTab === 'map') renderRestaurants();
      if (currentMainTab === 'attraction') renderAttractions();
      if (currentMainTab === 'news') renderNews();
    }

    function renderRestaurants() {
      const listEl = document.getElementById('restaurant-list');

      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];

        if (currentSubFilter === 'all') return true;

        if (isIslandMode(currentCity)) {
          if (currentSubFilter === 'food') return item.islandType === 'food' || item.categoryKey !== 'hotel_villa';

          if (currentSubFilter === 'villa') return item.islandType === 'villa';

        } else {
          const cat = (safeStr(item.categoryKey) + ' ' + safeStr(item.category)).toLowerCase();

          if (currentSubFilter === 'chinese') return cat.includes('chinese') || cat.includes('中餐') || cat.includes('火鍋') || cat.includes('hotpot');
          if (currentSubFilter === 'bbq_seafood') return cat.includes('bbq') || cat.includes('seafood') || cat.includes('炭烤') || cat.includes('海鮮') || cat.includes('排餐');
          if (currentSubFilter === 'fast_food') return cat.includes('fast') || cat.includes('速食') || cat.includes('美式');
          if (currentSubFilter === 'coffee_drinks') return cat.includes('coffee') || cat.includes('drinks') || cat.includes('咖啡') || cat.includes('手搖');
          return cat.includes(currentSubFilter.toLowerCase());

          </div>

        return `

          } flex flex-col transition">
            
            <div class="relative h-48 w-full bg-slate-100 overflow-hidden">

                    <img 
                      src="${img}"

              </div>

                  <i class="fa-solid fa-crown text-amber-400"></i> ${dict.badgeCurated}
                </div>
              ` : ''}

              ${(!isCurated && isGoogleTop) ? `
                <div class="absolute top-2.5 left-2.5 bg-sky-900/95 text-sky-200 text-[11px] font-extrabold px-2.5 py-1 rounded-full shadow-lg flex items-center gap-1 border border-sky-400/60 backdrop-blur-md">
                  <i class="fa-solid fa-fire text-amber-300"></i> Google Top
                </div>
              ` : ''}

              <div class="absolute bottom-2.5 left-2.5 flex items-center gap-1.5">
                <span class="bg-slate-900/80 backdrop-blur-xs text-white text-[10px] px-2 py-0.5 rounded font-medium">
                  ${dict['city_' + item.city] || item.city}

                ${item.googleRating ? `

                  💡 <b>${dict.curatedNotePrefix}</b>${item.curatedNote}
                </div>
              ` : ''}
              
              ${(isCurated && item.mustTry) ? `
                <div class="flex items-start gap-1.5 p-2 mb-2.5 rounded-lg bg-amber-50/60 border border-amber-200/80 text-xs text-amber-900">
                  <span class="shrink-0 px-1.5 py-0.5 rounded bg-amber-500 text-white font-bold text-[10px] leading-none mt-0.5">${dict.mustTryBadge}</span>
                  <span class="font-medium leading-tight">${item.mustTry}</span>
                </div>
              ` : ''}

              ${(!isCurated && isGoogleTop && item.googleTopNote) ? `
                <div class="bg-sky-50/90 border-l-3 border-sky-500 p-2.5 rounded-r-lg text-xs text-sky-950 font-medium leading-relaxed mb-2.5">
                  💬 <b>${dict.googleTopNotePrefix}</b>${item.googleTopNote}
                </div>
              ` : ''}

              <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed mb-3">
                ${desc}
              </p>

              <div class="space-y-1 text-[11px] text-slate-500 border-t border-slate-100 pt-2 mb-3 font-medium">
                <p class="flex items-center gap-1.5 truncate">
                  <i class="fa-solid fa-location-dot text-orange-500 w-3"></i>
                  <span class="truncate">${item.address || dict.addressEmpty}</span>

                <p class="flex items-center gap-1.5 font-mono">
                  <i class="fa-solid fa-phone text-slate-400 w-3"></i>

                ${(!isIslandMode(currentCity) && isFoodOnly) ? `

                    <i class="fa-solid fa-motorcycle"></i> ${dict.btnGrab}
                  </a>
                ` : ''}
                <a href="tel:${item.phone || ''}" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-[11px] font-bold py-2 rounded-xl text-center flex items-center justify-center gap-1 transition">
                  <i class="fa-solid fa-phone"></i> ${dict.btnCall}
                </a>
                <a href="${item.nav_link || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name + ' ' + (item.address || '')))}" target="_blank" rel="noopener noreferrer"
                   class="bg-orange-500 hover:bg-orange-600 active:scale-95 text-white text-[11px] font-bold py-2 rounded-xl text-center flex items-center justify-center gap-1 shadow-xs transition">
                  <i class="fa-solid fa-location-arrow"></i> ${dict.btnNav}
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');

    function renderAttractions() {
      const listEl = document.getElementById('attraction-list');
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const currentShortLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      let filtered = allAttractions.filter(item => {
        const matchC = isCityMatch(item, currentCity);
        if (!matchC) return false;
        if (currentSubFilter === 'all') return true;

        const cat = (safeStr(item.category) + ' ' + safeStr(item.id) + ' ' + safeStr(item.name_zh) + ' ' + safeStr(item.name_en)).toLowerCase();
        
        if (currentSubFilter === 'shopping') {
          return cat.includes('shop') || cat.includes('商場') || cat.includes('購物') || cat.includes('mall') || cat.includes('market');
        }
        if (currentSubFilter === 'casino') {
          return cat.includes('casino') || cat.includes('賭場') || cat.includes('娛樂') || cat.includes('dreams') || cat.includes('okada') || cat.includes('solaire') || cat.includes('nustar');
        }
        if (currentSubFilter === 'history') {
          return cat.includes('history') || cat.includes('歷史') || cat.includes('文化') || cat.includes('古蹟') || cat.includes('church') || cat.includes('cathedral') || cat.includes('教堂') || cat.includes('intramuros') || cat.includes('pedro') || cat.includes('santo') || cat.includes('magellan') || cat.includes('museum') || cat.includes('博物館');
        }
        if (currentSubFilter === 'nature') {
          return cat.includes('nature') || cat.includes('自然') || cat.includes('公園') || cat.includes('park') || cat.includes('garden') || cat.includes('ocean') || cat.includes('zoo') || cat.includes('tarsier') || cat.includes('hills') || cat.includes('cave');
        }
        if (currentSubFilter === 'beach') {
          return cat.includes('beach') || cat.includes('沙灘') || cat.includes('海灘');

        if (currentSubFilter === 'island_hopping') {
          return cat.includes('island') || cat.includes('跳島') || cat.includes('浮潛') || cat.includes('lagoon');
        }

        return cat.includes(currentSubFilter.toLowerCase());
      });

      if (currentSearchQuery) {

            <p class="text-[11px] text-slate-400 mt-1">${dict.noResultSub}</p>
          </div>

        return;

      listEl.innerHTML = filtered.map(item => {
        const name = getLocalizedText(item, 'name', currentShortLang) || item.name_en || item.name_zh || item.id || '景點地標';
        const desc = getLocalizedText(item, 'desc', currentShortLang) || getText(item.description) || '菲律賓熱門推薦地標。';
        const smartPhoto = getSmartLandmarkPhoto(item);
        const img = (item.images && item.images[0]) ? item.images[0] : smartPhoto;

        return `

              <div class="absolute bottom-2.5 left-2.5 flex items-center gap-1.5">
                <span class="bg-slate-900/80 backdrop-blur-xs text-white text-[10px] px-2 py-0.5 rounded font-medium">
                  ${dict['city_' + item.city] || item.city}
                </span>
                ${item.googleRating ? `

            <div class="p-3.5 flex flex-col flex-1">

                }">
                  ${tag}
                </span>
                ${validity ? `<span class="bg-neutral-900/80 text-white text-[10px] px-2 py-0.5 rounded">⏰ ${validity}</span>` : ''}
              </div>
            </div>

            <div class="p-3.5 flex flex-col flex-1">
              <h2 class="font-extrabold text-sm text-slate-900 mb-1.5">${titleHtml}</h2>
              <p class="text-xs text-slate-600 leading-relaxed mb-3">${desc}</p>
              <div class="mt-auto text-[11px] text-slate-500 border-t border-slate-100 pt-2 flex items-center gap-1.5 font-medium">
                <i class="fa-solid fa-location-dot text-orange-500"></i>
                <span>${location}</span>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function renderUI() {
      renderRegionPills();
      renderSubFilterBar();
      renderContent();
    }

    function updateUiLanguage() {
      document.documentElement.lang = currentLang;
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      
      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.placeholder = dict.searchPlaceholder;

      const chatWelcome = document.getElementById('chat-welcome-bubble');
      if (chatWelcome && dict.aiChatWelcome) chatWelcome.textContent = dict.aiChatWelcome;

      const chatInputEl = document.getElementById('chat-input');
      if (chatInputEl && dict.aiChatPlaceholder) chatInputEl.placeholder = dict.aiChatPlaceholder;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          el.textContent = dict[key];
        }
      });

      const authBtn = document.getElementById('auth-btn-text');
      if (authBtn && !currentUser) {
        authBtn.textContent = dict.btnLogin;
      }

      renderUI();
    }

    window.updateUiLanguage = updateUiLanguage;

    function enableHorizontalScroll() {
      const scrollContainers = [
        document.getElementById('regionPillsNav'),
        document.getElementById('subFilterContainer')
      ];

      scrollContainers.forEach(container => {
        if (!container) return;

        container.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) {
            e.preventDefault();
            container.scrollLeft += e.deltaY;
          }
        }, { passive: false });

        let isDown = false;
        let startX, scrollLeft;

        container.addEventListener('mousedown', (e) => {
          isDown = true;
          container.classList.add('drag-scroll-active');
          startX = e.pageX - container.offsetLeft;
          scrollLeft = container.scrollLeft;
        });

        window.addEventListener('mouseup', () => {
          if (!isDown) return;
          isDown = false;
          container.classList.remove('drag-scroll-active');
        });

        container.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - container.offsetLeft;
          const walk = (x - startX) * 1.5;
          container.scrollLeft = scrollLeft - walk;
        });
      });
    }

    const langSelect = document.getElementById('lang-select');
    if (langSelect) {
      langSelect.value = currentLang;
      langSelect.addEventListener('change', (e) => {
        currentLang = e.target.value;
        localStorage.setItem('ph_app_lang', currentLang);
        updateUiLanguage();
        const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
        showToast(`${dict.toastSwitch}${e.target.options[e.target.selectedIndex].text}`);
      });
    }

    typeCityBtn.addEventListener('click', () => {
      currentDimension = 'cities';
      sessionStorage.setItem('ph_dim', 'cities');
      currentCity = 'manila';
      currentSubFilter = 'all';
      sessionStorage.setItem('ph_nav_sub', 'all');
      localStorage.setItem('ph_app_city', currentCity);
      renderUI();
    });

    typeIslandBtn.addEventListener('click', () => {
      currentDimension = 'islands';
      sessionStorage.setItem('ph_dim', 'islands');
      currentCity = 'boracay';
      currentSubFilter = 'all';
      sessionStorage.setItem('ph_nav_sub', 'all');
      localStorage.setItem('ph_app_city', currentCity);
      renderUI();
    });

    document.querySelectorAll('.main-tab-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        currentMainTab = btn.getAttribute('data-maintab');
        sessionStorage.setItem('ph_nav_tab', currentMainTab);
        currentSubFilter = 'all';
        sessionStorage.setItem('ph_nav_sub', 'all');
        renderSubFilterBar();
        renderContent();
      });
    });

    const searchInput = document.getElementById('search-input');
    const searchClearBtn = document.getElementById('search-clear-btn');

    searchInput.addEventListener('input', (e) => {
      currentSearchQuery = e.target.value.trim();
      searchClearBtn.classList.toggle('hidden', !currentSearchQuery);
      renderContent();
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentSearchQuery = '';
      searchClearBtn.classList.add('hidden');
      renderContent();
    });

    const authModal = document.getElementById('auth-modal');
    document.getElementById('auth-state-btn').addEventListener('click', () => {
      if (currentUser) {
        signOut(auth).then(() => showToast('已成功登出'));
      } else {
        authModal.classList.remove('hidden');
      }
    });

    document.getElementById('close-auth-btn').addEventListener('click', () => authModal.classList.add('hidden'));
    document.getElementById('btn-google-login').addEventListener('click', () => {
      signInWithPopup(auth, googleProvider).then(() => {
        authModal.classList.add('hidden');
        showToast('Google 帳號登入成功！');
      });
    });

    document.getElementById('btn-send-magic').addEventListener('click', () => {
      const email = document.getElementById('magic-email-input').value.trim();
      if (!email) {
        alert('請輸入 Email 信箱');
        return;
      }
      sendSignInLinkToEmail(auth, email, { url: window.location.href, handleCodeInApp: true }).then(() => {
        alert('魔法登入信已發送至您的信箱，請點擊信中連結完成登入！');
        authModal.classList.add('hidden');
      });
    });

    document.getElementById('share-btn').addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: '大V的旅遊窩 - 菲律賓精緻生活 & 海島漫遊地圖',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => showToast('網站連結已複製！'));
      }
    });

    // 大V AI 懸浮球與管家問答
    const chatFab = document.getElementById('chat-fab');
    const chatModal = document.getElementById('chat-modal');
    const btnCloseChat = document.getElementById('btn-close-chat');
    const chatInput = document.getElementById('chat-input');
    const btnSendChat = document.getElementById('btn-send-chat');
    const chatMessages = document.getElementById('chat-messages');

    chatFab.addEventListener('click', () => {
      chatModal.classList.toggle('hidden');
      if (!chatModal.classList.contains('hidden')) {
        chatInput.focus();
      }
    });

    btnCloseChat.addEventListener('click', () => chatModal.classList.add('hidden'));
    btnSendChat.addEventListener('click', handleChatSend);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleChatSend();
    });

    async function handleChatSend() {
      const msg = chatInput.value.trim();
      if (!msg) return;

      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const targetLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      chatMessages.innerHTML += `
        <div class="bg-orange-500 text-white p-2.5 rounded-xl rounded-tr-sm self-end max-w-[85%] ml-auto text-xs leading-relaxed shadow-xs">
          ${msg}
        </div>
      `;
      chatInput.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const loadId = 'load-' + Date.now();
      const loadingText = dict.aiLoading || '管家正在為您查詢... ⚡';
      chatMessages.innerHTML += `
        <div id="${loadId}" class="bg-white p-2.5 rounded-xl rounded-tl-sm border border-slate-200/70 text-slate-500 text-xs self-start max-w-[85%] flex items-center gap-1.5 shadow-2xs">
          <i class="fa-solid fa-spinner fa-spin text-orange-500"></i> ${loadingText}
        </div>
      `;
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const resContext = (allRestaurants || [])
        .filter(i => currentCity === 'all' || isCityMatch(i, currentCity))
        .slice(0, 8)
        .map(r => getLocalizedText(r, 'name', targetLang) || r.name)
        .join(', ');

      try {
        const res = await fetch(AI_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: msg,
            lang: targetLang,
            currentCity: currentCity,
            restaurantsContext: `精選參考: ${resContext}`
          })
        });
        const data = await res.json();
        const loadEl = document.getElementById(loadId);
        if (loadEl) {
          loadEl.className = 'bg-white p-2.5 rounded-xl rounded-tl-sm border border-slate-200/70 text-slate-800 text-xs self-start max-w-[88%] leading-relaxed shadow-2xs';
          loadEl.innerText = data.reply;
        }
      } catch (err) {
        const loadEl = document.getElementById(loadId);
        if (loadEl) {
          loadEl.className = 'bg-white p-2.5 rounded-xl rounded-tl-sm border border-slate-200/70 text-slate-800 text-xs self-start max-w-[88%] leading-relaxed shadow-2xs';
          loadEl.innerText = targetLang === 'en'
            ? "Quick tip: Check out our top-rated local dining spots and pristine island beaches!"
            : targetLang === 'tl'
            ? "Mabilisang tip: Bisitahin ang mga tanyag na kainan at magagandang isla sa Pilipinas!"
            : "已為您快速查詢！推薦造訪在地人氣嚴選私房餐廳與精選海島景點。";
        }
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    initVisitorCounter();
    enableHorizontalScroll();
    fetchData();
  </script>
</body>
</html>
