<!DOCTYPE html>
<html lang="zh-TW">

    <meta name="theme-color" content="#EA580C">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdfbf7; color: #333; padding-bottom: 50px; }
        
        /* 頂部 Header */
        header { background: #EA580C; color: white; padding: 12px 16px 0 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-top h1 { font-size: 1.15rem; font-weight: bold; letter-spacing: 0.5px; }
        
        .btn-share { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; outline: none; }
        .btn-share:active { background: rgba(255, 255, 255, 0.35); }

        .controls-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .app-select { flex: 1; background: rgba(255, 255, 255, 0.18); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 6px 10px; border-radius: 6px; font-size: 0.82rem; outline: none; cursor: pointer; text-overflow: ellipsis; }
        .app-select option { color: #333; background: white; }

        /* 主導覽 Tab 切換 */
        .main-tabs { display: flex; border-top: 1px solid rgba(255,255,255,0.2); }
        .main-tab-btn { flex: 1; text-align: center; padding: 10px; font-weight: bold; font-size: 0.92rem; color: rgba(255,255,255,0.75); border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; }
        .main-tab-btn.active { color: white; border-bottom: 3px solid white; }

        /* 分類列 */
        .category-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: #ffffff; margin: 0 -16px; border-bottom: 1px solid #f1ece1; }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-chip { padding: 6px 14px; border-radius: 18px; font-size: 0.85rem; background: #f5f2eb; color: #666; white-space: nowrap; border: none; cursor: pointer; transition: all 0.2s; }
        .cat-chip.active { background: #EA580C; color: white; font-weight: bold; }

        /* 新聞二級篩選 Bar */
        .news-filter-bar { display: none; gap: 8px; padding: 10px 16px; background: #ffffff; margin: 0 -16px; border-bottom: 1px solid #f1ece1; }
        .news-sub-btn { flex: 1; padding: 8px 4px; border-radius: 8px; font-size: 0.83rem; font-weight: bold; border: 1px solid #e7e2d7; background: #ffffff; color: #666; cursor: pointer; text-align: center; white-space: nowrap; }
        .news-sub-btn.active { background: #ea580c; color: white; border-color: #ea580c; }

        /* 卡片與容器 */
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: white; border-radius: 14px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); border: 1px solid #f0eae1; }
        .card > img { width: 100%; height: 200px; object-fit: cover; background: #f7f5f0; display: block; }

        /* 多圖輪播容器 */
        .carousel-container { position: relative; width: 100%; height: 210px; background: #f7f5f0; overflow: hidden; }
        .carousel-track { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide { flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: start; position: relative; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .carousel-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; z-index: 10; pointer-events: none; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); }
        .dot.active { background: #ffffff; width: 14px; border-radius: 4px; }
        .photo-tag { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.6); color: white; font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; z-index: 10; backdrop-blur: 2px; }

        .card-body { padding: 16px; }
        
        .badge-group { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .badge { display: inline-flex; align-items: center; background: #fff7ed; color: #c2410c; font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; border: 1px solid #ffedd5; }
        .badge-city { background: #f0f9ff; color: #0369a1; border-color: #e0f2fe; }
        .badge-promo { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
        .badge-brand { background: #fefce8; color: #a16207; border-color: #fef08a; }
        .badge-expiry { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; font-weight: bold; }

        /* 營業狀態徽章 */
        .badge-open { background: #ecfdf5; color: #047857; border-color: #a7f3d0; font-weight: bold; }
        .badge-closed { background: #fef2f2; color: #b91c1c; border-color: #fecaca; font-weight: bold; }

        /* Google 權威真實評分徽章 */
        .badge-google-rating { background: #fef3c7; color: #92400e; border-color: #fde68a; font-weight: bold; gap: 4px; }

        .card-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; color: #1c1917; line-height: 1.35; }
        .card-desc { font-size: 0.88rem; color: #57534e; line-height: 1.5; margin-bottom: 12px; }
        .info-item { font-size: 0.85rem; color: #78716c; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
        
        /* 營業時間自適應排版 */
        .hours-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; width: 100%; }
        .hours-text { flex: 1; word-break: break-word; }
        .hours-dropdown { white-space: nowrap; color: #ea580c; font-weight: bold; cursor: pointer; text-decoration: underline; font-size: 0.8rem; shrink: 0; padding-top: 1px; }
        
        .weekly-hours-box { display: none; background: #faf8f5; border: 1px solid #eee8dd; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 0.8rem; color: #57534e; line-height: 1.6; }
        .weekly-hours-box.show { display: block; }
        .weekly-hours-box div.today { font-weight: bold; color: #ea580c; }

        .btn-group { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: calc(50% - 3px); padding: 10px 6px; border-radius: 8px; font-size: 0.82rem; font-weight: bold; text-align: center; text-decoration: none; border: none; cursor: pointer; }
        .btn-primary { background: #EA580C; color: white; }
        .btn-secondary { background: #f5f2eb; color: #44403c; }
        .btn-grab { background: #00B14F; color: white; }
        .btn-foodpanda { background: #D70F64; color: white; }
        
        #loading { text-align: center; padding: 40px; color: #a8a29e; }

        /* ==================== 重新重構：精簡乾淨的用戶評分區 ==================== */
        .card-forum-box { background: #faf8f5; border-radius: 12px; padding: 10px 14px; margin-top: 14px; border: 1px solid #ede5d8; }
        .rating-header { display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
        .rating-left { display: flex; align-items: baseline; gap: 6px; }
        .rating-label { font-size: 0.82rem; font-weight: bold; color: #78716c; }
        .rating-score-num { font-size: 0.95rem; font-weight: 800; color: #ea580c; }
        .rating-count-hint { font-size: 0.72rem; color: #a8a29e; }
        
        .star-picker { display: flex; gap: 3px; cursor: pointer; }
        .star-picker span { font-size: 1.15rem; color: #e2dcd2; transition: color 0.15s; line-height: 1; }
        .star-picker span.active { color: #f59e0b; }
        
        .btn-toggle-forum { background: none; border: none; color: #57534e; font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 8px 0 2px 0; width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #e7dfd3; margin-top: 8px; }
        .btn-toggle-forum:hover { color: #ea580c; }

        .forum-content { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #ede5d8; }
        .forum-content.show { display: block; }

        .mini-comment-form { margin-bottom: 12px; background: #ffffff; padding: 10px; border-radius: 8px; border: 1px solid #eee8dd; }
        .mini-form-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .mini-input { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #e7e5e4; font-size: 0.8rem; outline: none; }
        .mini-select { width: 90px; padding: 6px 4px; border-radius: 6px; border: 1px solid #e7e5e4; font-size: 0.78rem; outline: none; }
        .mini-textarea { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #e7e5e4; font-size: 0.8rem; outline: none; resize: vertical; min-height: 50px; margin-bottom: 6px; }
        .btn-mini-post { width: 100%; background: #EA580C; color: white; padding: 6px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 0.8rem; }

        .review-item { font-size: 0.82rem; color: #57534e; padding: 8px 0; border-bottom: 1px solid #f5f2eb; }
        .review-item:last-child { border-bottom: none; }
        .review-user { font-weight: bold; color: #1c1917; }
        .review-time { font-size: 0.72rem; color: #a8a29e; float: right; }
        .review-text { margin-top: 4px; color: #44403c; line-height: 1.35; }

        /* 質感圓形懸浮 AI 管家按鈕 */

        .chat-fab:active { transform: scale(0.92); }

        .btn-close-chat { background: rgba(255,255,255,0.2); border: none; color: white; width: 26px; height: 26px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fdfbf7; font-size: 0.85rem; }
        .chat-bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; word-break: break-word; }
        .chat-bubble.bot { background: #ffffff; border: 1px solid #e7e2d7; align-self: flex-start; color: #292524; border-top-left-radius: 4px; }
        .chat-bubble.user { background: #EA580C; color: white; align-self: flex-end; border-top-right-radius: 4px; }

        .chat-input-area { display: flex; border-top: 1px solid #efe8dc; padding: 10px 12px; background: #ffffff; gap: 8px; align-items: center; }
        .chat-input { flex: 1; border: 1px solid #e2d9cd; border-radius: 20px; padding: 9px 14px; font-size: 0.85rem; outline: none; background: #faf8f5; }
        .btn-send-chat { background: #EA580C; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; font-weight: bold; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>

        <div class="controls-row">

                <option value="davao">達沃 (Davao)</option>
                <option value="manila">馬尼拉 (Manila)</option>
                <option value="cebu">宿霧 (Cebu)</option>
            </select>
            <select class="app-select" id="lang-select" onchange="changeLanguage(this.value)">
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
                <option value="tl">Tagalog</option>

    <div id="main-tab-map" class="tab-content active">

        function getUniqueRestaurantImageArray(name, catKey) {
            const pool = categoryImagePools[catKey] || categoryImagePools.filipino;
            let hash = 0;
            const str = name || 'default';
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const startIndex = Math.abs(hash) % pool.length;
            
            const images = [];
            for (let i = 0; i < 4; i++) {
                images.push(pool[(startIndex + i) % pool.length]);
            }
            return images;
        }

        // 營業時間動態解析
        function parseOpeningStatus(openingHours) {
            if (!openingHours) {
                return { hasData: false, isOpen: null, todayText: null, weeklyList: [] };
            }

            const weekdayList = openingHours.weekdayDescriptions || [];
            const periods = openingHours.periods || [];

            if (weekdayList.length === 0 && periods.length === 0 && (openingHours.openNow === undefined || openingHours.openNow === null)) {
                return { hasData: false, isOpen: null, todayText: null, weeklyList: [] };
            }

            const now = new Date();
            const currentDay = now.getDay();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            let isOpen = (openingHours.openNow !== undefined && openingHours.openNow !== null) 
                         ? openingHours.openNow 
                         : false;

            if (periods.length > 0) {
                for (const period of periods) {
                    if (!period.open) continue;
                    const openDay = period.open.day;
                    const openMin = (period.open.hour || 0) * 60 + (period.open.minute || 0);

                    if (period.close) {
                        const closeDay = period.close.day;
                        const closeMin = (period.close.hour || 0) * 60 + (period.close.minute || 0);

                        if (openDay === closeDay && openDay === currentDay) {
                            if (currentMinutes >= openMin && currentMinutes < closeMin) isOpen = true;
                        } else if (openDay === currentDay && currentMinutes >= openMin) {
                            isOpen = true;
                        } else if (closeDay === currentDay && currentMinutes < closeMin) {
                            isOpen = true;
                        }
                    } else {
                        if (openDay === currentDay) isOpen = true;
                    }
                }
            }

            let todayPeriodStr = "";
            const todayIndex = (currentDay === 0) ? 6 : (currentDay - 1);
            if (weekdayList.length > 0) {
                const fullText = weekdayList[todayIndex] || weekdayList[0];
                const parts = fullText.split(': ');
                todayPeriodStr = parts.length > 1 ? parts.slice(1).join(': ') : fullText;
            }

            return {
                hasData: true,
                isOpen: isOpen,
                todayText: todayPeriodStr || (isOpen ? "營業中" : "已打烊"),
                weeklyList: weekdayList,
                todayDayIndex: todayIndex
            };
        }

                const matchesCity = (currentCity === 'all') || (item.city === 'all') || (item.city === currentCity);
                
                let matchesSub = true;
                if (currentNewsSubFilter === 'promo') {
                    matchesSub = (item.type === 'promo');
                } else if (currentNewsSubFilter === 'new') {
                    matchesSub = (item.type === 'new');
                }

                return matchesCity && matchesSub;
            });

            if (!filteredNews || filteredNews.length === 0) {
                newsEl.innerHTML = `<p style="text-align:center; color:#a8a29e; padding: 40px;">${langData.noNewsData}</p>`;
                return;
            }

            newsEl.innerHTML = filteredNews.map(item => {
                let titleText = '';
                if (item.titles && item.titles[currentLang]) {
                    titleText = item.titles[currentLang];
                } else if (item.titles && item.titles['en']) {
                    titleText = item.titles['en'];
                } else {
                    titleText = item.title || '';
                }

                let tagText = '';
                if (item.tags && item.tags[currentLang]) {
                    tagText = item.tags[currentLang];
                } else if (item.tags && item.tags['en']) {
                    tagText = item.tags['en'];
                } else {
                    tagText = item.tag || (item.type === 'promo' ? '🔥 Promo' : '✨ New Spot');
                }

                let validityText = '';
                if (item.validity && typeof item.validity === 'object') {
                    validityText = item.validity[currentLang] || item.validity['en'] || '';
                } else if (typeof item.validity === 'string') {
                    validityText = item.validity;
                }

                let descText = '';
                if (item.descriptions) {
                    descText = item.descriptions[currentLang] || item.descriptions['en'] || '';
                } else if (item.description_zh) {
                    descText = item.description_zh;
                }

                const titleHtml = item.url 
                    ? `<a href="${item.url}" target="_blank" style="color: #1c1917; text-decoration: none; border-bottom: 2px solid #EA580C;" title="Visit Website">${titleText} 🔗</a>` 
                    : titleText;

                return `
                    <div class="card">
                        <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&auto=format&fit=crop'}" alt="${titleText}" loading="lazy">
                        <div class="card-body">
                            <div class="badge-group">
                                <span class="badge badge-city">${langData.cities[item.city] || 'Philippines'}</span>
                                ${item.brand ? `<span class="badge badge-brand">${item.brand}</span>` : ''}
                                <span class="badge badge-promo">${tagText}</span>
                                ${validityText ? `<span class="badge badge-expiry">⏰ ${validityText}</span>` : ''}
                            </div>
                            <div class="card-title" style="font-size:1.1rem; margin-top:4px;">${titleHtml}</div>
                            <div class="card-desc" style="color:#44403c; margin-top:8px;">${descText}</div>
                            <div class="info-item"><span>📍</span> <span>${item.location || ''}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==================== AI 客服視窗互動邏輯 ====================
        window.toggleChat = function() {
            const modal = document.getElementById('chat-modal');
            modal.classList.toggle('show');
            if (modal.classList.contains('show')) {
                document.getElementById('chat-input').focus();
            }
        };

        window.handleChatKeyPress = function(e) {
            if (e.key === 'Enter') sendChatMessage();
        };

        window.sendChatMessage = async function() {
            const inputEl = document.getElementById('chat-input');
            const msg = inputEl.value.trim();
            if (!msg) return;

            const messagesEl = document.getElementById('chat-messages');
            const langData = i18n[currentLang];

            messagesEl.innerHTML += `<div class="chat-bubble user">${msg}</div>`;
            inputEl.value = '';
            messagesEl.scrollTop = messagesEl.scrollHeight;

            const loadingId = "loading-" + Date.now();
            messagesEl.innerHTML += `<div class="chat-bubble bot" id="${loadingId}">${langData.chatThinking}</div>`;
            messagesEl.scrollTop = messagesEl.scrollHeight;

            const activeCity = document.getElementById('city-select').value || currentCity;

            const catMap = {
                'bbq_seafood': '海鮮燒烤、火烤兩吃、BBQ、烤肉',
                'japanese_korean': '日韓料理、韓式烤肉、日式鍋物',
                'chinese': '中式料理、合菜、點心',
                'fast_food': '美式速食、炸雞漢堡',
                'coffee_drinks': '咖啡、手搖飲料、甜點',
                'filipino': '菲律賓在地傳統菜、烤乳豬 Lechon'
            };

            const relevantRestaurants = (allRestaurants || []).filter(item => {
                return activeCity === 'all' || item.city === activeCity;
            }).slice(0, 80);

            const restaurantsContext = relevantRestaurants.map((item, idx) => {
                const deliveryOptions = [];
                if (item.grabUrl) deliveryOptions.push("GrabFood");
                if (item.foodpandaUrl) deliveryOptions.push("Foodpanda");
                const deliveryText = deliveryOptions.length > 0 ? `外送支援: ${deliveryOptions.join(', ')}` : "無外送";

                const catDesc = catMap[item.categoryKey] || item.categoryKey || '精選美食';
                const localizedName = (item.names && item.names[currentLang]) ? item.names[currentLang] : (item.name || '未知');
                return `${idx + 1}. 【${localizedName} / 英文名: ${item.name || ''}】 城市: ${item.city || 'davao'}, 標籤特色: ${catDesc}, 地址: ${item.address || ''}, ${deliveryText}`;
            }).join('\n');

            try {
                const response = await fetch(AI_WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: msg, 
                        lang: currentLang,
                        currentCity: activeCity,
                        restaurantsContext: restaurantsContext
                    })
                });
                const data = await response.json();
                
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) {
                    loadingEl.innerText = data.reply;
                }
            } catch (err) {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) {
                    loadingEl.innerText = langData.chatError;
                }
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        };

        fetchData();
    </script>
</body>
</html>
