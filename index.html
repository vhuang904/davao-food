    // ====== 工具函式 ======
    function getSmartLink(name, city, website) {
      if (website && typeof website === 'string' && website.trim().startsWith('http')) {
        return website.trim();
      }
      const q = encodeURIComponent(((name || '') + ' ' + (city || '')).trim());
      return `https://www.google.com/search?q=${q}`;
    }

    function getGrabLink(item, name, city) {
      // 1. 如果試算表有填寫該店專屬的 Grab 網址，100% 優先直達店家頁面
      if (item.grab_url && typeof item.grab_url === 'string' && item.grab_url.trim().startsWith('http')) {
        return item.grab_url.trim();
      }

      // 2. 清理店名：優先使用英文名，移除中文、特殊符號與括號，確保菲律賓 Grab 系統能搜到
      let cleanQuery = (item.name_en || name || item.id || '').trim();
      // 去除括號與括號內文字 (例如: "(Davao Branch)")
      cleanQuery = cleanQuery.replace(/\(.*?\)|（.*?）/g, '').trim();
      // 如果包含中文且有英文部分，優先保留英文部分
      const englishMatch = cleanQuery.match(/[a-zA-Z0-9\s'&]+/);
      if (englishMatch && englishMatch[0].trim().length >= 2) {
        cleanQuery = englishMatch[0].trim();
      }

      const q = encodeURIComponent(cleanQuery);

      // 3. GrabFood 菲律賓官方精準搜尋網址 (支援網頁端直接帶入關鍵字列表)
      return `https://food.grab.com/ph/en/restaurants?search=${q}`;
    }

    function getCleanPhone(phone) {
      if (!phone) return '';
      return String(phone).replace(/[^\d+]/g, '');
    }

    function safeStr(val) {
      if (!val) return '';
      if (typeof val === 'string') return val.toLowerCase().trim();
      if (typeof val === 'object') return Object.values(val).join(' ').toLowerCase().trim();
      return String(val).toLowerCase().trim();
    }

    function getText(val) {
      if (!val) return '';
      if (typeof val === 'string') return val;
      if (typeof val === 'object') {
        const langKey = currentLang === 'zh-TW' ? 'zh' : currentLang;
        return val[currentLang] || val[langKey] || val['zh-TW'] || val['zh'] || val['en'] || val['tl'] || Object.values(val)[0] || '';
      }
      return String(val);
    }

      toastMessage.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
      setTimeout(() => {

    async function initVisitorCounter() {
      try {
        const statsRef = doc(db, "stats", "global");
        const snap = await getDoc(statsRef);
        let count = 3856;
        if (!snap.exists()) {
          await setDoc(statsRef, { viewCount: 3856 });
        } else {
          await updateDoc(statsRef, { viewCount: increment(1) });
          count = (snap.data().viewCount || 3856) + 1;
        }
        document.getElementById('visit-count-val').innerText = Number(count).toLocaleString();
      } catch (err) {
        document.getElementById('visit-count-val').innerText = "3,856";
      }
    }

    function parseImages(item, fallback) {
      if (!item) return [fallback || CATEGORY_FALLBACK_IMAGES.default[0]];

      if (Array.isArray(item.images) && item.images.length > 0) {
        const valid = item.images.filter(s => typeof s === 'string' && s.startsWith('http'));
        if (valid.length > 0) return valid;
      }
      if (Array.isArray(item.photos) && item.photos.length > 0) {
        const valid = item.photos.filter(s => typeof s === 'string' && s.startsWith('http'));
        if (valid.length > 0) return valid;
      }

      const keys = ['images', 'image_url', 'imageurl', 'image', 'photo_url', 'photo', 'cover', 'thumbnail', 'col_14', 'col_7', 'img'];
      for (let k of keys) {
        const val = item[k];
        if (val) {
          if (Array.isArray(val)) {
            const list = val.filter(s => typeof s === 'string' && s.startsWith('http'));
            if (list.length > 0) return list;
          } else if (typeof val === 'string' && val.trim().length > 5) {
            const list = val.split(',')
              .map(s => s.trim())
              .filter(s => s.startsWith('http') && !s.includes('maps.google') && !s.includes('goo.gl/maps'));
            if (list.length > 0) return list;
          }
        }
      }

      const cat = (safeStr(item.categoryKey) + ' ' + safeStr(item.category) + ' ' + safeStr(item.name)).toLowerCase();
      let pool = CATEGORY_FALLBACK_IMAGES.default;
      if (cat.includes('日式') || cat.includes('japan') || cat.includes('yaki') || cat.includes('sushi')) pool = CATEGORY_FALLBACK_IMAGES.japanese;
      else if (cat.includes('菲餐') || cat.includes('filipino')) pool = CATEGORY_FALLBACK_IMAGES.filipino;
      else if (cat.includes('中餐') || cat.includes('chinese') || cat.includes('hotpot')) pool = CATEGORY_FALLBACK_IMAGES.chinese;
      else if (cat.includes('炭烤') || cat.includes('海鮮') || cat.includes('bbq') || cat.includes('seafood')) pool = CATEGORY_FALLBACK_IMAGES.bbq_seafood;
      else if (cat.includes('甜點') || cat.includes('咖啡') || cat.includes('cafe')) pool = CATEGORY_FALLBACK_IMAGES.dessert_cafe;

      const str = item.id || item.name || 'default';
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
      const chosenImg = pool[Math.abs(hash) % pool.length];

      return [fallback || chosenImg];
    }

    function buildCarouselHtml(images, uniqueId, altTitle) {
      if (!images || images.length === 0) {
        images = ["https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800&auto=format&fit=crop"];

      return `

            <div id="dots-${uniqueId}" class="absolute bottom-2.5 right-2.5 flex items-center gap-1 z-10 bg-black/50 backdrop-blur-xs px-2 py-1 rounded-full border border-slate-700">

    function makeScrollable(element) {
      if (!element) return;
      let isDown = false;
      let startX = 0;
      let scrollLeft = 0;

      element.addEventListener('mousedown', (e) => {
        isDown = true;
        element.classList.add('drag-scroll-active');
        startX = e.pageX - element.offsetLeft;
        scrollLeft = element.scrollLeft;
      });

      element.addEventListener('mouseleave', () => {
        isDown = false;
        element.classList.remove('drag-scroll-active');
      });

      element.addEventListener('mouseup', () => {
        isDown = false;
        element.classList.remove('drag-scroll-active');
      });

      element.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - element.offsetLeft;
        const walk = (x - startX) * 1.5;
        element.scrollLeft = scrollLeft - walk;
      });
    }

    function bindCarouselControls() {
      document.querySelectorAll('.carousel-track').forEach(track => {
        const id = track.id.replace('track-', '');
        const dotsContainer = document.getElementById(`dots-${id}`);
        const dots = dotsContainer ? dotsContainer.querySelectorAll('.dot-indicator') : [];
        
        track.addEventListener('scroll', () => {
          const slideWidth = track.offsetWidth;
          if (slideWidth === 0) return;
          const activeIndex = Math.round(track.scrollLeft / slideWidth);
          dots.forEach((dot, idx) => {
            dot.classList.toggle('active', idx === activeIndex);
          });
        }, { passive: true });

        makeScrollable(track);
      });
    }

    function enableHorizontalScroll() {
      ['regionPillsNav', 'subFilterContainer'].forEach(id => {
        const c = document.getElementById(id);
        if (!c) return;

        makeScrollable(c);

        c.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) {
            e.preventDefault();
            c.scrollLeft += e.deltaY;
          }
        }, { passive: false });
      });
    }

            // 👉 補上這 3 行讀取試算表的新欄位：

        });

        const autoAttractions = [];
        (sheetMaster.autoDiscovered || []).forEach(autoItem => {
          if (!autoItem.id) return;
          const autoKey = autoItem.id.toLowerCase().trim();
          const itemType = (autoItem.type || 'restaurant').toLowerCase().trim();

    function isCityMatch(item, targetCity) {
      if (!item) return false;

      // 👉 第一道防線：徹底排除美國、紐約等海外誤爬資料
      const a = safeStr(item.address);
      if (a.includes('usa') || a.includes('ny ') || a.includes('10550') || a.includes('united states')) {
        return false;
      }

      if (!targetCity || targetCity === 'all') return true;
      const c = safeStr(item.city);
      if (targetCity === 'samal') return c === 'samal' || a.includes('samal');
      if (targetCity === 'davao') return (c === 'davao' || a.includes('davao')) && !c.includes('samal') && !a.includes('samal');
      if (targetCity === 'manila') return c === 'manila' || a.includes('manila') || a.includes('makati') || a.includes('taguig') || a.includes('pasay') || a.includes('bgc');
      return c === targetCity || a.includes(targetCity);
    }

    function renderMedical() {
      const listEl = document.getElementById('medical-list');
      const dict = I18N_DICT[currentLang] || I18N_DICT['zh-TW'];
      const currentShortLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      let filtered = allMedical.filter(item => {
        if (!isCityMatch(item, currentCity)) return false;
        if (!currentSubFilter || currentSubFilter === 'all') return true;

        const sub = currentSubFilter.toLowerCase();
        const cat = (item.category || '').toLowerCase();
        const type = (item.type || '').toLowerCase();
        const allText = `${cat} ${type}`;

        if (sub === 'hospital') return allText.includes('hospital') || allText.includes('綜合醫院') || allText.includes('醫院');
        if (sub === 'clinic') return allText.includes('clinic') || allText.includes('專科診所') || allText.includes('診所');
        if (sub === 'pharmacy') return allText.includes('pharmacy') || allText.includes('連鎖藥局') || allText.includes('藥局') || allText.includes('mercury');

        return allText.includes(sub);
      });

      if (currentSearchQuery) {
        const q = currentSearchQuery.toLowerCase();
        filtered = filtered.filter(item => (safeStr(item.name_zh) + ' ' + safeStr(item.name_en) + ' ' + safeStr(item.address)).includes(q));
      }

      // 👉 請確保這段排序有放在 renderMedical 裡面！
      filtered.sort((a, b) => {
        const ratingA = Number(a.google_rating || a.googlerating || a.rating || 0);
        const ratingB = Number(b.google_rating || b.googlerating || b.rating || 0);
        if (ratingB !== ratingA) {
          return ratingB - ratingA; // 評分高者排前面
        }
        const reviewsA = Number(a.review_count || a.reviewcount || 0);
        const reviewsB = Number(b.review_count || b.reviewcount || 0);
        return reviewsB - reviewsA; // 評論數多者排前面
      });
      
      filterSummaryText.textContent = `${dict['city_' + currentCity] || ''} · ${dict.navMedical}`;

        // 讀取 Google 評分與評論數 (帶容錯預設值)

        const reviewCount = item.review_count || item.reviewcount || item.reviews || 50;
        
        let catBadge = '🏥 綜合醫院';
        if (item.category === 'clinic') catBadge = '🩺 專科診所';
        if (item.category === 'pharmacy') catBadge = '💊 連鎖藥局';

        return `

            <div class="relative w-full overflow-hidden">

                <span class="bg-slate-950/85 backdrop-blur-xs text-amber-300 border border-slate-700/80 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 shadow-sm">

              </div>
            </div>

            <div class="p-3.5 flex flex-col flex-1">

                <a href="${smartLink}" target="_blank" rel="noopener noreferrer" class="hover:text-amber-400 transition inline-flex items-center gap-1.5 group">
                  <span>${name}</span>

    // ====== 即時留言與評分系統 ======
    let activeCommentTarget = null;

    function bindCommentButtons() {
      document.querySelectorAll('.btn-open-comment').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-comment-id');
          const targetName = btn.getAttribute('data-comment-name');
          openCommentModal(targetId, targetName);

    async function openCommentModal(targetId, targetName) {
      if (!targetId) return;
      activeCommentTarget = { id: String(targetId).trim(), name: targetName || '店家' };
      document.getElementById('comment-modal-title').innerText = `${activeCommentTarget.name} · 訪客點評`;
      document.getElementById('comment-modal').classList.remove('hidden');
      loadComments(activeCommentTarget.id);
    }

    async function loadComments(targetId) {
      const container = document.getElementById('comment-list-container');
      container.innerHTML = '<p class="text-center text-slate-500 py-6 text-xs"><i class="fa-solid fa-spinner fa-spin text-amber-400 mr-1.5"></i>載入最新訪客評論中...</p>';

      try {
        const cleanId = String(targetId).trim().toLowerCase();
        const q = query(collection(db, "comments"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);

        const matchedDocs = snap.docs.filter(d => {
          const c = d.data();
          return String(c.targetId || '').trim().toLowerCase() === cleanId || 
                 String(c.storeId || '').trim().toLowerCase() === cleanId;
        });

        if (matchedDocs.length === 0) {
          container.innerHTML = `
            <div class="text-center py-8 text-slate-500">
              <i class="fa-regular fa-comment-dots text-2xl mb-1.5 block text-slate-600"></i>
              目前尚無探店評語，快來搶頭香發表第一則心得！
            </div>
          `;
          return;
        }

        container.innerHTML = matchedDocs.map(d => {
          const c = d.data();
       const timeStr = c.createdAt ? new Date(c.createdAt.seconds ? c.createdAt.seconds * 1000 : c.createdAt).toLocaleDateString() : '近期';
       return `
         <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col gap-1.5 shadow-xs">
           <div class="flex items-center justify-between">
             <div class="flex items-center gap-2">
               <img src="${c.userPhoto || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=50'}" class="w-5 h-5 rounded-full object-cover ring-1 ring-amber-400/50" />
               <span class="font-bold text-slate-200 text-xs">${c.userName || '吃貨好友'}</span>
             </div>
             <span class="text-[10px] text-slate-500 font-medium">${timeStr}</span>
           </div>
           <p class="text-slate-300 text-xs leading-relaxed pl-7">${c.comment || c.content || ''}</p>
         </div>
       `;
        }).join('');
      } catch (e) {
        console.warn("載入留言異常:", e);
        container.innerHTML = '<p class="text-center text-slate-500 py-6 text-xs">歡迎登入後發表第一則評語！</p>';
      }
    }

    // ====== 發表留言核心邏輯 (支援電腦點擊與手機觸控) ======
    async function submitCommentAction(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      if (!currentUser) {
        document.getElementById('comment-modal').classList.add('hidden');
        document.getElementById('auth-modal').classList.remove('hidden');
        showToast('請先登入 Google 帳號再發表留言！', 'fa-user-lock');
        return;
      }

      const input = document.getElementById('comment-input-text');
      const text = input ? input.value.trim() : '';
      if (!text) {
        showToast('請輸入留言內容');
        return;
      }

      const submitBtn = document.getElementById('btn-submit-comment');
      try {
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerText = '送出中...';
        }

        await addStoreComment(activeCommentTarget.id, {
          rating: selectedRating,
          comment: text
        });

        if (input) {
          input.value = '';
          input.blur(); // 收起手機鍵盤
        }
        showToast('留言發布成功！獲得 20 積分 🎁', 'fa-award');
        loadComments(activeCommentTarget.id);
      } catch (err) {
        console.error("發布留言失敗:", err);
        showToast(err.message || '留言發表失敗，請稍候再試');
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = '發表 (+20分)';
        }
      }
    }

    btnCloseChat.addEventListener('click', () => chatModal.classList.add('hidden'));

    async function handleChatSend() {
      const msg = chatInput.value.trim();
      if (!msg) return;
      const targetLang = currentLang === 'zh-TW' ? 'zh' : currentLang;

      chatMessages.innerHTML += `<div class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold p-2.5 rounded-xl rounded-tr-sm self-end max-w-[85%] ml-auto text-xs leading-relaxed shadow-xs">${msg}</div>`;
      chatInput.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const loadId = 'load-' + Date.now();
      chatMessages.innerHTML += `<div id="${loadId}" class="bg-slate-900 p-2.5 rounded-xl rounded-tl-sm border border-slate-800 text-slate-400 text-xs self-start max-w-[85%] flex items-center gap-1.5 shadow-2xs"><i class="fa-solid fa-spinner fa-spin text-amber-400"></i> 管家正在為您查詢... ⚡</div>`;
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const res = await fetch(AI_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, lang: targetLang, currentCity: currentCity })
        });
        const data = await res.json();
        const loadEl = document.getElementById(loadId);
        if (loadEl) loadEl.innerText = data.reply;
      } catch (err) {
        const loadEl = document.getElementById(loadId);
        if (loadEl) loadEl.innerText = "已為您快速查詢！推薦造訪在地人氣嚴選私房餐廳、醫療機構與精選海島景點。";
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    initVisitorCounter();
    enableHorizontalScroll();
    fetchData();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.update();
        }).catch(err => console.warn('SW 註冊異常:', err));
      });
    }
  </script>
</body>
</html>
