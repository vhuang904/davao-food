name: Weekly Davao Food Sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch All Davao Restaurants via Firecrawl API
        env:
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          echo "[]" > new_data.json

          # 提示詞中加入分類要求：Chinese, American, Filipino, BBQ/Grill, Seafood, Cafe, Other
          curl -X POST https://api.firecrawl.dev/v1/scrape \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $FIRECRAWL_KEY" \
            -d '{
                  "url": "https://www.tripadvisor.com/Restaurants-g298459-Davao_City_Davao_del_Sur_Mindanao.html",
                  "formats": ["extract"],
                  "extract": {
                    "prompt": "Extract ALL Davao City restaurant listings including name, phone number, physical address, description, image URL, and classify each restaurant into one cuisine category (Chinese, American, Filipino, BBQ, Seafood, Cafe, or Other).",
                    "schema": {
                      "type": "object",
                      "properties": {
                        "restaurants": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "name": {"type": "string"},
                              "phone": {"type": "string"},
                              "address": {"type": "string"},
                              "description": {"type": "string"},
                              "imageUrl": {"type": "string"},
                              "category": {"type": "string"}
                            },
                            "required": ["name"]
                          }
                        }
                      }
                    }
                  }
                }' > response_ta.json

          curl -X POST https://api.firecrawl.dev/v1/scrape \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $FIRECRAWL_KEY" \
            -d '{
                  "url": "https://www.google.com/search?q=new+restaurants+in+davao+city",
                  "formats": ["extract"],
                  "extract": {
                    "prompt": "Extract newly opened or popular restaurants in Davao City including name, address, phone, brief description, and classify cuisine into (Chinese, American, Filipino, BBQ, Seafood, Cafe, or Other).",
                    "schema": {
                      "type": "object",
                      "properties": {
                        "restaurants": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "name": {"type": "string"},
                              "phone": {"type": "string"},
                              "address": {"type": "string"},
                              "description": {"type": "string"},
                              "imageUrl": {"type": "string"},
                              "category": {"type": "string"}
                            },
                            "required": ["name"]
                          }
                        }
                      }
                    }
                  }
                }' > response_google.json

          node -e "
            const fs = require('fs');

            function getList(file) {
              try {
                const raw = JSON.parse(fs.readFileSync(file));
                return raw.data?.extract?.restaurants || [];
              } catch(e) { return []; }
            }

            let existing = [];
            try {
              existing = JSON.parse(fs.readFileSync('restaurants.json'));
            } catch(e) { existing = []; }

            const fetchedTA = getList('response_ta.json');
            const fetchedGoogle = getList('response_google.json');
            const allFetched = [...fetchedTA, ...fetchedGoogle];

            const map = new Map();
            existing.forEach(r => { if(r.name) map.set(r.name.trim().toLowerCase(), r); });
            allFetched.forEach(r => {
              if(r.name) {
                const key = r.name.trim().toLowerCase();
                const oldData = map.get(key) || {};
                
                // 處理分類標籤在地化對應
                let cat = r.category || oldData.category || '菲律賓餐';
                if (/chinese/i.test(cat)) cat = '中式餐廳';
                else if (/american|burger/i.test(cat)) cat = '美式餐廳';
                else if (/filipino/i.test(cat)) cat = '菲律賓餐';
                else if (/bbq|barbecue|grill/i.test(cat)) cat = '燒烤類';
                else if (/seafood/i.test(cat)) cat = '海鮮類';
                else if (/cafe|coffee/i.test(cat)) cat = '咖啡輕食';
                else if (cat === 'Other') cat = '菲律賓餐';

                map.set(key, {
                  name: r.name,
                  phone: r.phone || oldData.phone || '無電話資訊',
                  address: r.address || oldData.address || 'Davao City',
                  description: r.description || oldData.description || '暫無介紹',
                  imageUrl: r.imageUrl || oldData.imageUrl || '',
                  category: cat
                });
              }
            });

            const merged = Array.from(map.values());
            fs.writeFileSync('restaurants.json', JSON.stringify(merged, null, 2));
            console.log('Database updated with categories. Total count: ' + merged.length);
          "

      - name: Commit and Push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add restaurants.json
          git commit -m "Auto-update & merge Davao restaurants with categories" || exit 0
          git push
