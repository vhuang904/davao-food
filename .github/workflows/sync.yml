name: Weekly Multi-City Food Sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Multi-Source Scraping (Tripadvisor + Google/Blogs + Facebook)
        env:
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          fetch_city() {
            CITY=$1
            
            # 1. Tripadvisor 來源
            curl -X POST https://api.firecrawl.dev/v1/scrape \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $FIRECRAWL_KEY" \
              -d "{\"url\": \"https://www.tripadvisor.com/Search?q=${CITY}+restaurants\", \"formats\": [\"extract\"], \"extract\": {\"prompt\": \"Extract restaurant listings in ${CITY}. For each, provide name, phone, address, imageUrl, cuisine category, and write a short description in Traditional Chinese (desc_zh), English (desc_en), and Tagalog (desc_tl).\", \"schema\": {\"type\": \"object\", \"properties\": {\"restaurants\": {\"type\": \"array\", \"items\": {\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\"}, \"phone\": {\"type\": \"string\"}, \"address\": {\"type\": \"string\"}, \"desc_zh\": {\"type\": \"string\"}, \"desc_en\": {\"type\": \"string\"}, \"desc_tl\": {\"type\": \"string\"}, \"imageUrl\": {\"type\": \"string\"}, \"category\": {\"type\": \"string\"}}}}}}}}" > "res_${CITY}_ta.json"

            # 2. OpenTable / Yelp / 食記部落格來源
            curl -X POST https://api.firecrawl.dev/v1/scrape \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $FIRECRAWL_KEY" \
              -d "{\"url\": \"https://www.google.com/search?q=top+restaurants+in+${CITY}+site:opentable.com+OR+site:yelp.com\", \"formats\": [\"extract\"], \"extract\": {\"prompt\": \"Extract popular restaurants in ${CITY} including name, address, phone, imageUrl, cuisine category, and write short descriptions in Traditional Chinese (desc_zh), English (desc_en), and Tagalog (desc_tl).\", \"schema\": {\"type\": \"object\", \"properties\": {\"restaurants\": {\"type\": \"array\", \"items\": {\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\"}, \"phone\": {\"type\": \"string\"}, \"address\": {\"type\": \"string\"}, \"desc_zh\": {\"type\": \"string\"}, \"desc_en\": {\"type\": \"string\"}, \"desc_tl\": {\"type\": \"string\"}, \"imageUrl\": {\"type\": \"string\"}, \"category\": {\"type\": \"string\"}}}}}}}}" > "res_${CITY}_blogs.json"

            # 3. Facebook 餐廳粉專定向檢索來源 (site:facebook.com)
            curl -X POST https://api.firecrawl.dev/v1/scrape \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $FIRECRAWL_KEY" \
              -d "{\"url\": \"https://www.google.com/search?q=popular+restaurant+in+${CITY}+site:facebook.com\", \"formats\": [\"extract\"], \"extract\": {\"prompt\": \"Extract popular Facebook restaurant pages in ${CITY} with name, address, phone, imageUrl, cuisine category, and write short descriptions in Traditional Chinese (desc_zh), English (desc_en), and Tagalog (desc_tl).\", \"schema\": {\"type\": \"object\", \"properties\": {\"restaurants\": {\"type\": \"array\", \"items\": {\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\"}, \"phone\": {\"type\": \"string\"}, \"address\": {\"type\": \"string\"}, \"desc_zh\": {\"type\": \"string\"}, \"desc_en\": {\"type\": \"string\"}, \"desc_tl\": {\"type\": \"string\"}, \"imageUrl\": {\"type\": \"string\"}, \"category\": {\"type\": \"string\"}}}}}}}}" > "res_${CITY}_fb.json"
          }

          fetch_city "davao"
          fetch_city "manila"
          fetch_city "cebu"

          node -e "
            const fs = require('fs');

            function getList(file) {
              try {
                const raw = JSON.parse(fs.readFileSync(file));
                return raw.data?.extract?.restaurants || [];
              } catch(e) { return []; }
            }

            function mapCategoryKey(item) {
              const text = ((item.category || '') + ' ' + (item.name || '') + ' ' + (item.desc_en || '')).toLowerCase();
              if (/chinese|dim sum|noodle|asian|taiwanese|hong kong/i.test(text)) return 'chinese';
              if (/american|burger|steak|pizza|fast food/i.test(text)) return 'american';
              if (/bbq|barbecue|grill|lechon|ihaw/i.test(text)) return 'bbq';
              if (/seafood|tuna|fish|crab|shrimp|kinilaw/i.test(text)) return 'seafood';
              if (/cafe|coffee|bakery|dessert|tea/i.test(text)) return 'cafe';
              return 'filipino';
            }

            const cities = ['davao', 'manila', 'cebu'];
            const map = new Map();

            cities.forEach(city => {
              const listTA = getList('res_' + city + '_ta.json');
              const listBlogs = getList('res_' + city + '_blogs.json');
              const listFB = getList('res_' + city + '_fb.json');
              const combined = [...listTA, ...listBlogs, ...listFB];

              combined.forEach(r => {
                if(r.name && r.name.trim().length > 0) {
                  // 清理粉專名稱常出現的後綴字眼
                  let cleanName = r.name.replace(/\s*-\s*Home\s*|\s*-\s*Facebook\s*/gi, '').trim();
                  const key = city + '_' + cleanName.toLowerCase();

                  map.set(key, {
                    city: city,
                    name: cleanName,
                    phone: r.phone || '',
                    address: r.address || (city.toUpperCase() + ' City'),
                    descriptions: {
                      'zh-TW': r.desc_zh || r.desc_en || '暫無介紹。',
                      'en': r.desc_en || r.desc_zh || 'No description available.',
                      'tl': r.desc_tl || r.desc_en || 'Walang magagamit na paglalarawan.'
                    },
                    imageUrl: r.imageUrl || '',
                    categoryKey: mapCategoryKey(r)
                  });
                }
              });
            });

            const merged = Array.from(map.values());
            fs.writeFileSync('restaurants.json', JSON.stringify(merged, null, 2));
            console.log('Saved ' + merged.length + ' multi-source (including Facebook) restaurants.');
          "

      - name: Commit and Push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add restaurants.json
          git commit -m "Include Facebook search source in multi-city sync" || exit 0
          git push
