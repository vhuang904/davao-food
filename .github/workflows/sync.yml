name: Weekly Davao Food Sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch All Davao Restaurants via Firecrawl API
        env:
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          curl -X POST https://api.firecrawl.dev/v1/scrape \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $FIRECRAWL_KEY" \
            -d '{
                  "url": "https://www.tripadvisor.com/Restaurants-g298459-Davao_City_Davao_del_Sur_Mindanao.html",
                  "formats": ["extract"],
                  "extract": {
                    "prompt": "Extract ALL Davao City restaurant listings including name, phone, address, description, imageUrl, and classify cuisine into (chinese, american, filipino, bbq, seafood, or cafe).",
                    "schema": {
                      "type": "object",
                      "properties": {
                        "restaurants": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "name": {"type": "string"},
                              "phone": {"type": "string"},
                              "address": {"type": "string"},
                              "description": {"type": "string"},
                              "imageUrl": {"type": "string"},
                              "category": {"type": "string"}
                            },
                            "required": ["name"]
                          }
                        }
                      }
                    }
                  }
                }' > response_ta.json

          curl -X POST https://api.firecrawl.dev/v1/scrape \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $FIRECRAWL_KEY" \
            -d '{
                  "url": "https://www.google.com/search?q=best+restaurants+and+cafes+in+davao+city",
                  "formats": ["extract"],
                  "extract": {
                    "prompt": "Extract popular Davao City restaurants including name, address, phone, description, imageUrl, and classify cuisine.",
                    "schema": {
                      "type": "object",
                      "properties": {
                        "restaurants": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "properties": {
                              "name": {"type": "string"},
                              "phone": {"type": "string"},
                              "address": {"type": "string"},
                              "description": {"type": "string"},
                              "imageUrl": {"type": "string"},
                              "category": {"type": "string"}
                            },
                            "required": ["name"]
                          }
                        }
                      }
                    }
                  }
                }' > response_google.json

          node -e "
            const fs = require('fs');

            function getList(file) {
              try {
                const raw = JSON.parse(fs.readFileSync(file));
                return raw.data?.extract?.restaurants || [];
              } catch(e) { return []; }
            }

            const fetchedTA = getList('response_ta.json');
            const fetchedGoogle = getList('response_google.json');
            const allFetched = [...fetchedTA, ...fetchedGoogle];

            function mapCategoryKey(item) {
              const text = ((item.category || '') + ' ' + (item.name || '') + ' ' + (item.description || '')).toLowerCase();
              if (/chinese|dim sum|noodle|asian|taiwanese|hong kong/i.test(text)) return 'chinese';
              if (/american|burger|steak|pizza|fast food/i.test(text)) return 'american';
              if (/bbq|barbecue|grill|lechon|ihaw/i.test(text)) return 'bbq';
              if (/seafood|tuna|fish|crab|shrimp|kinilaw/i.test(text)) return 'seafood';
              if (/cafe|coffee|bakery|dessert|tea/i.test(text)) return 'cafe';
              return 'filipino';
            }

            const map = new Map();
            allFetched.forEach(r => {
              if(r.name && r.name.trim().length > 0) {
                const key = r.name.trim().toLowerCase();
                map.set(key, {
                  name: r.name,
                  phone: r.phone || '',
                  address: r.address || 'Davao City',
                  description: r.description || '',
                  imageUrl: r.imageUrl || '',
                  categoryKey: mapCategoryKey(r)
                });
              }
            });

            const merged = Array.from(map.values());
            fs.writeFileSync('restaurants.json', JSON.stringify(merged, null, 2));
            console.log('Saved ' + merged.length + ' restaurants with i18n categoryKeys.');
          "

      - name: Commit and Push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add restaurants.json
          git commit -m "Auto-update Davao restaurants with multilingual category keys" || exit 0
          git push
