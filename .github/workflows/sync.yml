name: Weekly Multi-City Food Sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Multi-Source Scraping for Davao, Manila & Cebu
        env:
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          # 定義抓取函式，支援 OpenTable, Yelp, Tripadvisor 與 Google 食記部落格
          fetch_city() {
            CITY=$1
            
            # 1. Tripadvisor
            curl -X POST https://api.firecrawl.dev/v1/scrape \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $FIRECRAWL_KEY" \
              -d "{\"url\": \"https://www.tripadvisor.com/Search?q=${CITY}+restaurants\", \"formats\": [\"extract\"], \"extract\": {\"prompt\": \"Extract restaurant listings in ${CITY} with name, phone, address, description, imageUrl, and cuisine type.\", \"schema\": {\"type\": \"object\", \"properties\": {\"restaurants\": {\"type\": \"array\", \"items\": {\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\"}, \"phone\": {\"type\": \"string\"}, \"address\": {\"type\": \"string\"}, \"description\": {\"type\": \"string\"}, \"imageUrl\": {\"type\": \"string\"}, \"category\": {\"type\": \"string\"}}}}}}}}" > "res_${CITY}_ta.json"

            # 2. OpenTable / Yelp / 食記部落格綜合搜尋
            curl -X POST https://api.firecrawl.dev/v1/scrape \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $FIRECRAWL_KEY" \
              -d "{\"url\": \"https://www.google.com/search?q=top+restaurants+and+food+blogs+in+${CITY}+site:opentable.com+OR+site:yelp.com+OR+blogs\", \"formats\": [\"extract\"], \"extract\": {\"prompt\": \"Extract popular restaurants and blog recommendations in ${CITY} including name, address, phone, description, imageUrl, and cuisine type.\", \"schema\": {\"type\": \"object\", \"properties\": {\"restaurants\": {\"type\": \"array\", \"items\": {\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\"}, \"phone\": {\"type\": \"string\"}, \"address\": {\"type\": \"string\"}, \"description\": {\"type\": \"string\"}, \"imageUrl\": {\"type\": \"string\"}, \"category\": {\"type\": \"string\"}}}}}}}}" > "res_${CITY}_blogs.json"
          }

          # 依次抓取三個城市
          fetch_city "davao"
          fetch_city "manila"
          fetch_city "cebu"

          # 使用 Node.js 彙整、去重並標註城市標籤
          node -e "
            const fs = require('fs');

            function getList(file) {
              try {
                const raw = JSON.parse(fs.readFileSync(file));
                return raw.data?.extract?.restaurants || [];
              } catch(e) { return []; }
            }

            function mapCategoryKey(item) {
              const text = ((item.category || '') + ' ' + (item.name || '') + ' ' + (item.description || '')).toLowerCase();
              if (/chinese|dim sum|noodle|asian|taiwanese|hong kong/i.test(text)) return 'chinese';
              if (/american|burger|steak|pizza|fast food/i.test(text)) return 'american';
              if (/bbq|barbecue|grill|lechon|ihaw/i.test(text)) return 'bbq';
              if (/seafood|tuna|fish|crab|shrimp|kinilaw/i.test(text)) return 'seafood';
              if (/cafe|coffee|bakery|dessert|tea/i.test(text)) return 'cafe';
              return 'filipino';
            }

            const cities = ['davao', 'manila', 'cebu'];
            const map = new Map();

            cities.forEach(city => {
              const listTA = getList('res_' + city + '_ta.json');
              const listBlogs = getList('res_' + city + '_blogs.json');
              const combined = [...listTA, ...listBlogs];

              combined.forEach(r => {
                if(r.name && r.name.trim().length > 0) {
                  const key = city + '_' + r.name.trim().toLowerCase();
                  map.set(key, {
                    city: city,
                    name: r.name,
                    phone: r.phone || '',
                    address: r.address || (city.toUpperCase() + ' City'),
                    description: r.description || '',
                    imageUrl: r.imageUrl || '',
                    categoryKey: mapCategoryKey(r)
                  });
                }
              });
            });

            const merged = Array.from(map.values());
            fs.writeFileSync('restaurants.json', JSON.stringify(merged, null, 2));
            console.log('Saved ' + merged.length + ' restaurants across Davao, Manila, and Cebu.');
          "

      - name: Commit and Push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add restaurants.json
          git commit -m "Expand scraping to Manila, Cebu, Davao with multi-platform sources" || exit 0
          git push
