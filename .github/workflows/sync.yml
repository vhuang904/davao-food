name: Weekly Multi-City Food Sync

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Multi-Source Scraping for Davao, Manila & Cebu
        env:
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          fetch_city() {
            CITY=$1
            PROMPT_RULE="Extract restaurants in ${CITY}. Classify category strictly as one of: [chinese, japanese_korean, filipino, american_western, bbq_seafood, cafe_dessert]. Include name, phone, address, imageUrl, desc_zh, desc_en, desc_tl."

            curl -X POST https://api.firecrawl.dev/v1/scrape \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $FIRECRAWL_KEY" \
              -d "{\"url\": \"https://www.tripadvisor.com/Search?q=${CITY}+restaurants\", \"formats\": [\"extract\"], \"extract\": {\"prompt\": \"${PROMPT_RULE}\", \"schema\": {\"type\": \"object\", \"properties\": {\"restaurants\": {\"type\": \"array\", \"items\": {\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\"}, \"phone\": {\"type\": \"string\"}, \"address\": {\"type\": \"string\"}, \"desc_zh\": {\"type\": \"string\"}, \"desc_en\": {\"type\": \"string\"}, \"desc_tl\": {\"type\": \"string\"}, \"imageUrl\": {\"type\": \"string\"}, \"category\": {\"type\": \"string\"}}}}}}}}" > "res_${CITY}_ta.json"

            curl -X POST https://api.firecrawl.dev/v1/scrape \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $FIRECRAWL_KEY" \
              -d "{\"url\": \"https://www.google.com/search?q=top+restaurants+in+${CITY}+site:facebook.com+OR+site:opentable.com\", \"formats\": [\"extract\"], \"extract\": {\"prompt\": \"${PROMPT_RULE}\", \"schema\": {\"type\": \"object\", \"properties\": {\"restaurants\": {\"type\": \"array\", \"items\": {\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\"}, \"phone\": {\"type\": \"string\"}, \"address\": {\"type\": \"string\"}, \"desc_zh\": {\"type\": \"string\"}, \"desc_en\": {\"type\": \"string\"}, \"desc_tl\": {\"type\": \"string\"}, \"imageUrl\": {\"type\": \"string\"}, \"category\": {\"type\": \"string\"}}}}}}}}" > "res_${CITY}_fb.json"
          }

          fetch_city "davao"
          fetch_city "manila"
          fetch_city "cebu"

          node -e "
            const fs = require('fs');

            function getList(file) {
              try {
                const raw = JSON.parse(fs.readFileSync(file));
                return raw.data?.extract?.restaurants || [];
              } catch(e) { return []; }
            }

            function preciseCategory(r) {
              const text = ((r.category || '') + ' ' + (r.name || '') + ' ' + (r.desc_en || '') + ' ' + (r.desc_zh || '')).toLowerCase();
              if (/japan|japanese|ramen|sushi|bento|yakitori|korean|samgyupsal|kimchi|bbq korean/i.test(text)) return 'japanese_korean';
              if (/chinese|dim sum|dumpling|noodle|taiwan|hong kong|cantonese|hotpot|xiao long bao/i.test(text)) return 'chinese';
              if (/bbq|barbecue|grill|inasal|ihaw|lechon|seafood|tuna|crab|shrimp|kinilaw/i.test(text)) return 'bbq_seafood';
              if (/cafe|coffee|matcha|bakery|cake|dessert|tea|boba|milk tea|breakfast|brunch/i.test(text)) return 'cafe_dessert';
              if (/american|burger|steak|ribs|pizza|pasta|italian|burger joint/i.test(text)) return 'american_western';
              if (/filipino|pinoy|sinigang|adobo|sisig|kare-kare|bistro|mindanao/i.test(text)) return 'filipino';
              return 'filipino';
            }

            const cities = ['davao', 'manila', 'cebu'];
            const map = new Map();

            cities.forEach(city => {
              const listTA = getList('res_' + city + '_ta.json');
              const listFB = getList('res_' + city + '_fb.json');
              const combined = [...listTA, ...listFB];

              combined.forEach(r => {
                if(r.name && r.name.trim().length > 0) {
                  let cleanName = r.name.replace(/\s*-\s*Home\s*|\s*-\s*Facebook\s*/gi, '').trim();
                  const key = city + '_' + cleanName.toLowerCase();

                  map.set(key, {
                    city: city,
                    name: cleanName,
                    phone: r.phone || '',
                    address: r.address || (city.toUpperCase() + ' City'),
                    descriptions: {
                      'zh-TW': r.desc_zh || r.desc_en || '暫無介紹。',
                      'en': r.desc_en || r.desc_zh || 'No description available.',
                      'tl': r.desc_tl || r.desc_en || 'Walang magagamit na paglalarawan.'
                    },
                    imageUrl: r.imageUrl || '',
                    categoryKey: preciseCategory(r)
                  });
                }
              });
            });

            const merged = Array.from(map.values());
            fs.writeFileSync('restaurants.json', JSON.stringify(merged, null, 2));
            console.log('Successfully re-classified ' + merged.length + ' restaurants.');
          "

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add restaurants.json
          git commit -m "Optimize restaurant classification logic with precise keyword matrix" || exit 0
          git push
