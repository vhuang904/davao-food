name: Sync Attractions Bi-Monthly

on:
  schedule:
    - cron: '0 4 1,16 * *'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install firebase

      - name: Run Attraction Sync Script
        run: node sync-attractions.js
